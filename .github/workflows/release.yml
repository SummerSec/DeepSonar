  release:
    needs: [base-image, images, kali-minimal, openharmony-test, openharmony-audit, openharmony-fuzz, chrome-images, mobile]
    runs-on: ubuntu-latest
    env:
      ALIYUN_REGISTRY: ${{ secrets.ALIYUN_REGISTRY }}
      ALIYUN_REGISTRY_NAMESPACE: ${{ secrets.ALIYUN_REGISTRY_NAMESPACE }}
      ALIYUN_REGISTRY_USERNAME: ${{ secrets.ALIYUN_REGISTRY_USERNAME }}
      ALIYUN_REGISTRY_PASSWORD: ${{ secrets.ALIYUN_REGISTRY_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
        with:
          # 需要 fetch 默认分支以便把发布清单回写进仓库（bundled 回退用）
          fetch-depth: 0
          ref: ${{ needs.base-image.outputs.checkout_ref }}
      - id: release
        name: 解析 registry 命名空间
        shell: bash
        run: |
          set -euo pipefail
          version="${{ needs.base-image.outputs.version }}"
          owner="${GITHUB_REPOSITORY_OWNER,,}"
          [[ -n "$version" ]]
          [[ -n "$owner" ]]
          printf 'version=%s\n' "$version" >> "$GITHUB_OUTPUT"
          printf 'owner=%s\n' "$owner" >> "$GITHUB_OUTPUT"
      - uses: actions/download-artifact@v4
        with:
          pattern: runtime-image-digest-*
          path: release-digests
          merge-multiple: true
      - uses: actions/download-artifact@v4
        with:
          name: release-changelog
          path: release-changelog
      - name: 生成 runtime 镜像清单
        env:
          VERSION: ${{ steps.release.outputs.version }}
          OWNER: ${{ steps.release.outputs.owner }}
        run: |
          set -euo pipefail
          node agent-harness/generate-runtime-image-registry.mjs release-digests deploy/runtime-image-registry.json
      - name: 校验发布清单
        run: |
          set -euo pipefail
          node agent-harness/generate-runtime-image-registry.mjs --check deploy/runtime-image-registry.json
      - name: 准备 v2 Release asset
        run: |
          set -euo pipefail
          cp deploy/runtime-image-registry.json runtime-image-registry-v2.json
          node agent-harness/generate-runtime-image-registry.mjs --check runtime-image-registry-v2.json
      - uses: actions/upload-artifact@v4
        with:
          name: runtime-image-registry
          path: |
            deploy/runtime-image-registry.json
            runtime-image-registry-v2.json
          if-no-files-found: error
      - name: 回写 bundled 清单到默认分支
        env:
          VERSION: ${{ steps.release.outputs.version }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          set -euo pipefail
          registry_file="deploy/runtime-image-registry.json"
          env_file="deploy/.env.example"
          [[ -f "$registry_file" ]]
          [[ -f "$env_file" ]]
          [[ "$VERSION" =~ ^[0-9][^[:space:]]*$ ]]
          node agent-harness/generate-runtime-image-registry.mjs --check "$registry_file"
          validate_image_tag_line() {
            local file="$1" line_count
            line_count="$(grep -Ec '^DEEPSONAR_IMAGE_TAG=[^[:space:]]+$' "$file" || true)"
            [[ "$line_count" == "1" ]] || {
              echo "$file must contain exactly one valid DEEPSONAR_IMAGE_TAG= line" >&2
              exit 1
            }
          }
          validate_image_tag_line "$env_file"
          # 生成步骤已改动工作区中的 registry；必须先拷到临时文件，再用 -f 切到默认分支，
          # 否则 git checkout 会因本地改动被覆盖而失败（Your local changes would be overwritten）。
          tmp_registry="$(mktemp)"
          tmp_env="$(mktemp)"
          cp "$registry_file" "$tmp_registry"
          VERSION="$VERSION" awk '
            /^DEEPSONAR_IMAGE_TAG=/ { print "DEEPSONAR_IMAGE_TAG=" ENVIRON["VERSION"]; next }
            { print }
          ' "$env_file" > "$tmp_env"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch origin "$DEFAULT_BRANCH"
          git checkout -f -B "bot/sync-runtime-registry-v${VERSION}" "origin/${DEFAULT_BRANCH}"
          validate_image_tag_line "$env_file"
          cp "$tmp_registry" "$registry_file"
          cp "$tmp_env" "$env_file"
          rm -f "$tmp_registry" "$tmp_env"
          git add -- "$registry_file" "$env_file"
          if git diff --cached --quiet -- "$registry_file" "$env_file"; then
            echo "默认分支上的 $registry_file 和 $env_file 已是本次发布内容，跳过回写"
            exit 0
          fi
          git commit -m "chore(release): sync runtime-image-registry.json and image tag for v${VERSION}"
          # 只更新清单文件；推到默认分支不会再次触发本 workflow（仅 tag 触发）
          git push origin "HEAD:${DEFAULT_BRANCH}"
          echo "已将 $registry_file 和 $env_file 回写到 origin/${DEFAULT_BRANCH}" >> "$GITHUB_STEP_SUMMARY"
      - name: 打包 Management Skill
        shell: bash
        run: |
          set -euo pipefail
          VERSION="${{ needs.base-image.outputs.version }}"
          tar -czf "deepsonar-management-skill-${VERSION}.tar.gz" -C skills deepsonar-management
      - name: 生成 Release 正文
        env:
          VERSION: ${{ needs.base-image.outputs.version }}
          PREVIOUS_VERSION: ${{ needs.base-image.outputs.previous_version }}
        shell: bash
        run: |
          set -euo pipefail
          [[ -s release-changelog/release-notes.md ]]
          {
            cat <<EOF
          > **License notice:** This release contains proprietary DeepSonar source code. Prior written authorization from SummerSec is required before use. Earlier versions lawfully released under MIT keep their original terms. Third-party components retain their own licenses. See [LICENSE](https://github.com/SummerSec/DeepSonar/blob/v${VERSION}/LICENSE) and [THIRD_PARTY_NOTICES.md](https://github.com/SummerSec/DeepSonar/blob/v${VERSION}/THIRD_PARTY_NOTICES.md).

          EOF
            cat release-changelog/release-notes.md
            printf '\n[Full Changelog](https://github.com/SummerSec/DeepSonar/compare/v%s...v%s)\n' "$PREVIOUS_VERSION" "$VERSION"
          } > release-body.md
      - name: 发布 Release 与附件
        uses: softprops/action-gh-release@v2
        with:
          # 手动触发时 GITHUB_REF 是分支，必须显式指定已有 v* tag
          tag_name: v${{ needs.base-image.outputs.version }}
          body_path: release-body.md
          files: |
            deepsonar-management-skill-*.tar.gz
            deploy/runtime-image-registry.json
            runtime-image-registry-v2.json
          generate_release_notes: true
