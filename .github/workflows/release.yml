name: release

# v* tag 发布调度器、前端、准入服务和官方运行时镜像；也支持手动触发。
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      version:
        description: "发布版本号（如 0.1.16 或 v0.1.16；留空=自动用仓库最新 v* tag）"
        required: false
        type: string
        default: ""
      ref:
        description: "检出的 git ref（分支/tag/sha）；留空=触发时所选分支的最新 commit（GITHUB_SHA）"
        required: false
        type: string
        default: ""

permissions:
  contents: write
  packages: write

concurrency:
  group: release-runtime-images-${{ github.repository }}
  cancel-in-progress: false

env:
  REGISTRY: ghcr.io
  DOCKERHUB_IMAGE: docker.io/sumsec/deepsonar

# Slice B release evidence: record-runtime-image-digest writes canonical
# `registry_records` only after inspecting each available channel.  The
# DOCKERHUB_CONFIGURED/ACR_CONFIGURED flags and *_UNAVAILABLE_REASON values
# make skipped optional channels explicit; an available-channel publish
# failure sets CHANNEL_PUBLISH_FAILED and aborts catalog generation.

jobs:
  base-image:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.release.outputs.version }}
      owner: ${{ steps.release.outputs.owner }}
      # 下游 job 统一 checkout 此 ref；手动触发且未填 ref 时为触发分支 HEAD 的 commit sha
      checkout_ref: ${{ steps.release.outputs.checkout_ref }}
      # base 镜像 digest（openharmony 指纹与 BASE_IMAGE 钉死用）
      digest: ${{ steps.image.outputs.digest }}
      previous_version: ${{ steps.changelog.outputs.previous_version }}
    env:
      DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
      DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
      ALIYUN_REGISTRY: ${{ secrets.ALIYUN_REGISTRY }}
      ALIYUN_REGISTRY_NAMESPACE: ${{ secrets.ALIYUN_REGISTRY_NAMESPACE }}
      ALIYUN_REGISTRY_USERNAME: ${{ secrets.ALIYUN_REGISTRY_USERNAME }}
      ALIYUN_REGISTRY_PASSWORD: ${{ secrets.ALIYUN_REGISTRY_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
        with:
          # 先拉全量 tags，便于解析「最新 v*」版本号；源码默认用触发 commit。
          fetch-depth: 0
          fetch-tags: true
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.ref != '' && inputs.ref || github.ref }}
      - id: release
        name: 解析发布版本
        shell: bash
        run: |
          set -euo pipefail
          owner="${GITHUB_REPOSITORY_OWNER,,}"
          [[ -n "$owner" ]]
          git fetch --tags --force origin 2>/dev/null || true

          if [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            raw="${{ inputs.version }}"
            if [[ -z "$raw" ]]; then
              # 默认：仓库最新 v* tag（版本排序，如 v0.1.16）——只作镜像/Release 版本号
              raw="$(git tag -l 'v*' --sort=-v:refname | head -n1 || true)"
              if [[ -z "$raw" ]]; then
                echo "未找到任何 v* tag，请填写 version 输入项" >&2
                exit 1
              fi
              echo "手动触发未填 version，自动使用最新 tag 作为版本号: ${raw}" >> "$GITHUB_STEP_SUMMARY"
            fi
            version="${raw#v}"
            if [[ -z "$version" || ! "$version" =~ ^[0-9] ]]; then
              echo "version 不合法（期望如 0.1.16 / v0.1.16），当前: ${version:-empty}" >&2
              exit 1
            fi
            # 未指定 ref：用触发时所选分支的最新 commit（GITHUB_SHA），不回退到 v* tag
            if [[ -z "${{ inputs.ref }}" ]]; then
              checkout_ref="${GITHUB_SHA}"
              echo "手动触发未填 ref，使用触发分支最新 commit: ${checkout_ref} (${GITHUB_REF_NAME})" >> "$GITHUB_STEP_SUMMARY"
            else
              checkout_ref="${{ inputs.ref }}"
              git fetch --force origin "${checkout_ref}" 2>/dev/null || true
              if git rev-parse -q --verify "${checkout_ref}^{commit}" >/dev/null 2>&1 \
                || git rev-parse -q --verify "refs/tags/${checkout_ref}" >/dev/null 2>&1 \
                || git rev-parse -q --verify "refs/remotes/origin/${checkout_ref}" >/dev/null 2>&1; then
                git checkout --force "${checkout_ref}" 2>/dev/null \
                  || git checkout --force "refs/tags/${checkout_ref}" 2>/dev/null \
                  || git checkout --force "origin/${checkout_ref}"
                echo "checkout ${checkout_ref} for release build" >> "$GITHUB_STEP_SUMMARY"
              else
                echo "无法解析 ref: ${checkout_ref}" >&2
                exit 1
              fi
            fi
          else
            version="${GITHUB_REF_NAME#v}"
            if [[ "$version" == "$GITHUB_REF_NAME" || -z "$version" ]]; then
              echo "tag 推送须为 v* 格式，当前 GITHUB_REF_NAME=${GITHUB_REF_NAME}" >&2
              exit 1
            fi
            checkout_ref="${GITHUB_SHA}"
          fi

          printf 'version=%s\n' "$version" >> "$GITHUB_OUTPUT"
          printf 'owner=%s\n' "$owner" >> "$GITHUB_OUTPUT"
          printf 'checkout_ref=%s\n' "$checkout_ref" >> "$GITHUB_OUTPUT"
          echo "release version=${version} checkout_ref=${checkout_ref} (event=${{ github.event_name }})" >> "$GITHUB_STEP_SUMMARY"
      - id: changelog
        name: 校验 tag 与 CHANGELOG
        env:
          VERSION: ${{ steps.release.outputs.version }}
          CHECKOUT_REF: ${{ steps.release.outputs.checkout_ref }}
          EVENT_NAME: ${{ github.event_name }}
          TAG_NAME: ${{ github.ref_name }}
        shell: bash
        run: |
          set -euo pipefail
          release_tag="v${VERSION}"
          checkout_commit="$(git rev-parse "${CHECKOUT_REF}^{commit}")"
          tag_commit="$(git rev-parse -q --verify "refs/tags/${release_tag}^{commit}" || true)"
          if [[ -z "$tag_commit" ]]; then
            echo "目标 release tag 不存在：${release_tag}" >&2
            exit 1
          fi
          if [[ "$tag_commit" != "$checkout_commit" ]]; then
            echo "release tag ${release_tag} 不指向 checkout ref ${CHECKOUT_REF}" >&2
            exit 1
          fi
          if [[ "$EVENT_NAME" == "push" && "$TAG_NAME" != "$release_tag" ]]; then
            echo "触发 tag ${TAG_NAME} 与版本 ${release_tag} 不匹配" >&2
            exit 1
          fi
          previous_tag="$(git tag -l 'v[0-9]*' --sort=-v:refname | while IFS= read -r candidate; do
            if [[ "$candidate" != "$release_tag" ]]; then
              printf '%s' "$candidate"
              break
            fi
          done)"
          if [[ -z "$previous_tag" ]]; then
            echo "未找到 ${release_tag} 的 previous v* tag" >&2
            exit 1
          fi
          previous_version="${previous_tag#v}"
          node agent-harness/validate-changelog.mjs \
            --file CHANGELOG.md \
            --version "$VERSION" \
            --previous-version "$previous_version" \
            --tag "$release_tag" \
            --output release-notes.md
          printf 'previous_version=%s\n' "$previous_version" >> "$GITHUB_OUTPUT"
          echo "CHANGELOG validated for ${release_tag} against ${previous_tag}" >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        with:
          name: release-changelog
          path: release-notes.md
          if-no-files-found: error
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: 检查 ACR 配置
        id: acr-config
        shell: bash
        run: |
          set -euo pipefail
          if [[ -n "$ALIYUN_REGISTRY" && -n "$ALIYUN_REGISTRY_NAMESPACE" && -n "$ALIYUN_REGISTRY_USERNAME" && -n "$ALIYUN_REGISTRY_PASSWORD" ]]; then
            echo 'configured=true' >> "$GITHUB_OUTPUT"
          else
            echo 'configured=false' >> "$GITHUB_OUTPUT"
            echo 'ACR 凭据未完整配置，将只发布 GHCR/Docker Hub。' >> "$GITHUB_STEP_SUMMARY"
          fi
      - name: 登录 Docker Hub
        if: ${{ env.DOCKERHUB_USERNAME != '' && env.DOCKERHUB_TOKEN != '' }}
        uses: docker/login-action@v3
        with:
          registry: docker.io
          username: ${{ env.DOCKERHUB_USERNAME }}
          password: ${{ env.DOCKERHUB_TOKEN }}
      - name: Docker Hub 凭据未配置
        if: ${{ env.DOCKERHUB_USERNAME == '' || env.DOCKERHUB_TOKEN == '' }}
        run: |
          set -euo pipefail
          echo 'Docker Hub 凭据未配置，将跳过 Docker Hub。' >> "$GITHUB_STEP_SUMMARY"
      - name: 登录阿里云 ACR
        if: ${{ steps.acr-config.outputs.configured == 'true' }}
        uses: docker/login-action@v3
        with:
          registry: ${{ env.ALIYUN_REGISTRY }}
          username: ${{ env.ALIYUN_REGISTRY_USERNAME }}
          password: ${{ env.ALIYUN_REGISTRY_PASSWORD }}
      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ steps.release.outputs.owner }}/deepsonar-base
          labels: |
            org.opencontainers.image.title=DeepSonar Base
            org.opencontainers.image.description=Explore、Analyze、Code、Hub、Verify 与系统沙箱使用的 DeepSonar 官方最小运行时。
            org.opencontainers.image.licenses=LicenseRef-DeepSonar-Proprietary
            org.opencontainers.image.documentation=https://github.com/SummerSec/DeepSonar/blob/main/docs/RELEASE_RUNTIME_IMAGES.md
          annotations: |
            org.opencontainers.image.title=DeepSonar Base
            org.opencontainers.image.description=Explore、Analyze、Code、Hub、Verify 与系统沙箱使用的 DeepSonar 官方最小运行时。
            org.opencontainers.image.licenses=LicenseRef-DeepSonar-Proprietary
            org.opencontainers.image.documentation=https://github.com/SummerSec/DeepSonar/blob/main/docs/RELEASE_RUNTIME_IMAGES.md
          tags: |
            type=semver,pattern={{version}}
            type=sha,prefix=
        env:
          DOCKER_METADATA_ANNOTATIONS_LEVELS: manifest,index
      - id: dockerhub-meta
        if: ${{ env.DOCKERHUB_USERNAME != '' && env.DOCKERHUB_TOKEN != '' }}
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.DOCKERHUB_IMAGE }}
          flavor: latest=false
          tags: |
            type=semver,pattern=base-{{version}}
            type=sha,prefix=base-sha-
      - id: acr-meta
        if: ${{ steps.acr-config.outputs.configured == 'true' }}
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.ALIYUN_REGISTRY }}/${{ env.ALIYUN_REGISTRY_NAMESPACE }}/deepsonar-base
          flavor: latest=false
          tags: |
            type=semver,pattern={{version}}
            type=sha,prefix=sha-
      - id: fingerprint
        name: Build fingerprint
        shell: bash
        run: node agent-harness/image-build-fingerprint.mjs --preset deepsonar-base
      - id: resolve
        name: Resolve src cache
        shell: bash
        env:
          IMAGE_NAME: ${{ env.REGISTRY }}/${{ steps.release.outputs.owner }}/deepsonar-base
          FINGERPRINT: ${{ steps.fingerprint.outputs.fingerprint }}
          SRC_TAG: ${{ steps.fingerprint.outputs.src_tag }}
        run: bash agent-harness/resolve-image-src-cache.sh resolve
      - id: build
        if: ${{ steps.resolve.outputs.skip != 'true' }}
        uses: docker/build-push-action@v6
        with:
          context: .
          file: deploy/Dockerfile.agent
          outputs: type=image,name=${{ env.REGISTRY }}/${{ steps.release.outputs.owner }}/deepsonar-base,push-by-digest=true,name-canonical=true,push=true
          platforms: linux/amd64,linux/arm64
          build-args: TOOLSET=base
          labels: ${{ steps.meta.outputs.labels }}
          annotations: ${{ steps.meta.outputs.annotations }}
          sbom: true
          provenance: mode=max
          # Registry cache 扛大层；GHA 作补充命中。buildcache 标签仅 CI 用，不进市场清单。
          cache-from: |
            type=registry,ref=${{ env.REGISTRY }}/${{ steps.release.outputs.owner }}/deepsonar-base:buildcache
            type=gha,scope=base
          cache-to: |
            type=registry,ref=${{ env.REGISTRY }}/${{ steps.release.outputs.owner }}/deepsonar-base:buildcache,mode=max
            type=gha,mode=max,scope=base
      - id: image
        name: Final digest + pin src
        shell: bash
        env:
          IMAGE_NAME: ${{ env.REGISTRY }}/${{ steps.release.outputs.owner }}/deepsonar-base
          FINGERPRINT: ${{ steps.fingerprint.outputs.fingerprint }}
          SRC_TAG: ${{ steps.fingerprint.outputs.src_tag }}
          SKIP: ${{ steps.resolve.outputs.skip }}
          REUSE_DIGEST: ${{ steps.resolve.outputs.digest }}
          BUILD_DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          set -euo pipefail
          if [[ "$SKIP" == "true" ]]; then
            digest="$REUSE_DIGEST"
          else
            digest="$BUILD_DIGEST"
            DIGEST="$digest" bash agent-harness/resolve-image-src-cache.sh pin
          fi
          [[ "$digest" =~ ^sha256:[0-9a-f]{64}$ ]]
          printf 'digest=%s\n' "$digest" >> "$GITHUB_OUTPUT"
      - name: 按 Registry 发布标签
        id: publish
        env:
          IMAGE_NAME: ${{ env.REGISTRY }}/${{ steps.release.outputs.owner }}/deepsonar-base
          SOURCE_DIGEST: ${{ steps.image.outputs.digest }}
          GHCR_TAGS: ${{ steps.meta.outputs.tags }}
          ACR_TAGS: ${{ steps.acr-meta.outputs.tags }}
          DOCKERHUB_TAGS: ${{ steps.dockerhub-meta.outputs.tags }}
          ACR_CONFIGURED: ${{ steps.acr-config.outputs.configured }}
          PLATFORMS: linux/amd64,linux/arm64
        run: |
          set -euo pipefail
          retry_imagetools_create() {
            local attempt=1 max_attempts=4 delay_seconds=5
            while true; do
              if GODEBUG=http2client=0 timeout --foreground --signal=TERM --kill-after=1m 20m docker buildx imagetools create "$@"; then return 0; fi
              if (( attempt >= max_attempts )); then
                echo "imagetools create 在 ${max_attempts} 次尝试后仍失败。" >&2
                echo 'CHANNEL_PUBLISH_FAILED=true' >> "$GITHUB_ENV"
                return 1
              fi
              echo "imagetools create 第 ${attempt} 次失败，${delay_seconds} 秒后重试。" >&2
              sleep "$delay_seconds"
              attempt=$((attempt + 1))
              delay_seconds=$((delay_seconds * 2))
            done
          }
          publish_tags() {
            local use_retry="$1" tags="$2"
            shift 2
            local sources=("$@")
            local tag_args=()
            while IFS= read -r tag; do
              [[ -n "$tag" ]] || continue
              tag_args+=(-t "$tag")
            done <<< "$tags"
            [[ ${#tag_args[@]} -gt 0 ]]
            if [[ "$use_retry" == "true" ]]; then
              retry_imagetools_create --prefer-index=false "${tag_args[@]}" "${sources[@]}"
            else
              docker buildx imagetools create --prefer-index=false "${tag_args[@]}" "${sources[@]}"
            fi
          }
          source_ref="${IMAGE_NAME}@${SOURCE_DIGEST}"
          selected_sources_text="$(bash agent-harness/select-runtime-platform-sources.sh "$source_ref" "$PLATFORMS")"
          mapfile -t selected_sources <<< "$selected_sources_text"
          [[ ${#selected_sources[@]} -gt 0 ]]
          publish_tags false "$GHCR_TAGS" "${selected_sources[@]}"
          canonical_tag="$(printf '%s\n' "$GHCR_TAGS" | sed -n '1p')"
          clean_digest="$(docker buildx imagetools inspect "$canonical_tag" --format '{{.Manifest.Digest}}')"
          [[ "$clean_digest" =~ ^sha256:[0-9a-f]{64}$ ]]
          printf 'digest=%s\n' "$clean_digest" >> "$GITHUB_OUTPUT"
          clean_source="${IMAGE_NAME}@${clean_digest}"
          if [[ "$ACR_CONFIGURED" == "true" ]]; then publish_tags true "$ACR_TAGS" "$clean_source"; fi
          if [[ -n "${DOCKERHUB_TAGS:-}" ]] && ! publish_tags true "$DOCKERHUB_TAGS" "$clean_source"; then
            echo "::warning::Docker Hub 标签发布失败；记录步骤将把本次 release 标记为失败。"
            echo "Docker Hub 标签复制重试耗尽；record-runtime-image-digest 将拒绝生成未验证清单。" >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi
      - name: 保存 base manifest digest
        env:
          IMAGE_KEY: deepsonar-base
          DIGEST: ${{ steps.publish.outputs.digest }}
          PLATFORMS: linux/amd64,linux/arm64
          GHCR_REF: ghcr.io/${{ steps.release.outputs.owner }}/deepsonar-base
          ACR_CONFIGURED: ${{ steps.acr-config.outputs.configured }}
          ACR_TAGS: ${{ steps.acr-meta.outputs.tags }}
          DOCKERHUB_TAGS: ${{ steps.dockerhub-meta.outputs.tags }}
          DOCKERHUB_CONFIGURED: ${{ steps.dockerhub-meta.outputs.tags != '' }}
          DOCKERHUB_UNAVAILABLE_REASON: credentials_missing_or_not_published
          ACR_UNAVAILABLE_REASON: credentials_missing
          VERSION: ${{ steps.release.outputs.version }}
        run: |
          set -euo pipefail
          node agent-harness/record-runtime-image-digest.mjs release-digests/base.json
      - uses: actions/upload-artifact@v4
        with:
          name: runtime-image-digest-base
          path: release-digests/base.json
          if-no-files-found: error

  images:
    needs: base-image
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - { name: scheduler, dockerfile: deploy/Dockerfile.scheduler, platforms: "linux/amd64", dockerhub_tag: "", title: "DeepSonar Scheduler", description: "DeepSonar 调度器与唯一副作用执行服务。" }
          - { name: web, dockerfile: deploy/Dockerfile.web, platforms: "linux/amd64", dockerhub_tag: "", title: "DeepSonar Web", description: "DeepSonar Loop Graph 工程平台 Web 控制台。" }
          - { name: image-admission, dockerfile: deploy/Dockerfile.image-admission, platforms: "linux/amd64", dockerhub_tag: "", title: "DeepSonar Image Admission", description: "DeepSonar 第三方运行镜像准入与安全扫描 Worker。" }
          - { name: assets-helper, dockerfile: deploy/Dockerfile.assets-helper, platforms: "linux/amd64", dockerhub_tag: "", title: "DeepSonar Assets Helper", description: "DeepSonar 共享资产只读卷写入 helper（busybox 根文件系统的官方再发布）。" }
          - { name: silo, dockerfile: deploy/Dockerfile.silo, platforms: "linux/amd64", dockerhub_tag: "", title: "DeepSonar Silo", description: "DeepSonar 共享资产 S3 服务（官方再发布的 PGSTY Silo）。" }
          - { name: audit, dockerfile: deploy/Dockerfile.agent, platforms: "linux/amd64,linux/arm64", dockerhub_tag: "audit", title: "DeepSonar Audit", description: "DeepSonar Audit 的官方审计运行时。" }
          # kali-minimal 体量大，amd64+arm64 同作业并行导出易 ENOSPC；独立 job 顺序构建
    env:
      DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
      DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
      ALIYUN_REGISTRY: ${{ secrets.ALIYUN_REGISTRY }}
      ALIYUN_REGISTRY_NAMESPACE: ${{ secrets.ALIYUN_REGISTRY_NAMESPACE }}
      ALIYUN_REGISTRY_USERNAME: ${{ secrets.ALIYUN_REGISTRY_USERNAME }}
      ALIYUN_REGISTRY_PASSWORD: ${{ secrets.ALIYUN_REGISTRY_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.base-image.outputs.checkout_ref }}
      - id: release
        name: 解析 registry 命名空间
        shell: bash
        run: |
          set -euo pipefail
          version="${{ needs.base-image.outputs.version }}"
          owner="${GITHUB_REPOSITORY_OWNER,,}"
          [[ -n "$version" ]]
          [[ -n "$owner" ]]
          printf 'version=%s\n' "$version" >> "$GITHUB_OUTPUT"
          printf 'owner=%s\n' "$owner" >> "$GITHUB_OUTPUT"
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - name: 预检锁文件
        run: |
          set -euo pipefail
          pnpm install --frozen-lockfile
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: 检查 ACR 配置
        id: acr-config
        shell: bash
        run: |
          set -euo pipefail
          if [[ -n "$ALIYUN_REGISTRY" && -n "$ALIYUN_REGISTRY_NAMESPACE" && -n "$ALIYUN_REGISTRY_USERNAME" && -n "$ALIYUN_REGISTRY_PASSWORD" ]]; then
            echo 'configured=true' >> "$GITHUB_OUTPUT"
          else
            echo 'configured=false' >> "$GITHUB_OUTPUT"
            echo 'ACR 凭据未完整配置，将只发布 GHCR/Docker Hub。' >> "$GITHUB_STEP_SUMMARY"
          fi
      - name: 登录 Docker Hub
        if: ${{ matrix.dockerhub_tag != '' && env.DOCKERHUB_USERNAME != '' && env.DOCKERHUB_TOKEN != '' }}
        uses: docker/login-action@v3
        with:
          registry: docker.io
          username: ${{ env.DOCKERHUB_USERNAME }}
          password: ${{ env.DOCKERHUB_TOKEN }}
      - name: Docker Hub 凭据未配置
        if: ${{ matrix.dockerhub_tag != '' && (env.DOCKERHUB_USERNAME == '' || env.DOCKERHUB_TOKEN == '') }}
        run: |
          set -euo pipefail
          echo 'Docker Hub 凭据未配置，将跳过 Docker Hub。' >> "$GITHUB_STEP_SUMMARY"
      - name: 登录阿里云 ACR
        if: ${{ steps.acr-config.outputs.configured == 'true' }}
        uses: docker/login-action@v3
        with:
          registry: ${{ env.ALIYUN_REGISTRY }}
          username: ${{ env.ALIYUN_REGISTRY_USERNAME }}
          password: ${{ env.ALIYUN_REGISTRY_PASSWORD }}
      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ steps.release.outputs.owner }}/deepsonar-${{ matrix.name }}
          labels: |
            org.opencontainers.image.title=${{ matrix.title }}
            org.opencontainers.image.description=${{ matrix.description }}
            org.opencontainers.image.licenses=LicenseRef-DeepSonar-Proprietary
            org.opencontainers.image.documentation=https://github.com/SummerSec/DeepSonar
          annotations: |
            org.opencontainers.image.title=${{ matrix.title }}
            org.opencontainers.image.description=${{ matrix.description }}
            org.opencontainers.image.licenses=LicenseRef-DeepSonar-Proprietary
            org.opencontainers.image.documentation=https://github.com/SummerSec/DeepSonar
          tags: |
            type=semver,pattern={{version}}
            type=sha,prefix=
        env:
          DOCKER_METADATA_ANNOTATIONS_LEVELS: ${{ matrix.name == 'audit' && 'manifest,index' || 'manifest' }}
      - id: dockerhub-meta
        if: ${{ matrix.dockerhub_tag != '' && env.DOCKERHUB_USERNAME != '' && env.DOCKERHUB_TOKEN != '' }}
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.DOCKERHUB_IMAGE }}
          flavor: latest=false
          tags: |
            type=semver,pattern=${{ matrix.dockerhub_tag }}-{{version}}
            type=sha,prefix=${{ matrix.dockerhub_tag }}-sha-
      - id: acr-meta
        if: ${{ steps.acr-config.outputs.configured == 'true' }}
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.ALIYUN_REGISTRY }}/${{ env.ALIYUN_REGISTRY_NAMESPACE }}/deepsonar-${{ matrix.name }}
          flavor: latest=false
          tags: |
            type=semver,pattern={{version}}
            type=sha,prefix=sha-
      - id: fingerprint
        name: Build fingerprint
        shell: bash
        run: node agent-harness/image-build-fingerprint.mjs --preset deepsonar-${{ matrix.name }}
      - id: resolve
        name: Resolve src cache
        shell: bash
        env:
          IMAGE_NAME: ${{ env.REGISTRY }}/${{ steps.release.outputs.owner }}/deepsonar-${{ matrix.name }}
          FINGERPRINT: ${{ steps.fingerprint.outputs.fingerprint }}
          SRC_TAG: ${{ steps.fingerprint.outputs.src_tag }}
        run: bash agent-harness/resolve-image-src-cache.sh resolve
      - id: build
        if: ${{ steps.resolve.outputs.skip != 'true' }}
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          outputs: type=image,name=${{ env.REGISTRY }}/${{ steps.release.outputs.owner }}/deepsonar-${{ matrix.name }},push-by-digest=true,name-canonical=true,push=true
          platforms: ${{ matrix.platforms }}
          build-args: ${{ matrix.name == 'audit' && 'TOOLSET=audit' || '' }}
          labels: ${{ steps.meta.outputs.labels }}
          annotations: ${{ steps.meta.outputs.annotations }}
          sbom: true
          provenance: mode=max
          cache-from: |
            type=registry,ref=${{ env.REGISTRY }}/${{ steps.release.outputs.owner }}/deepsonar-${{ matrix.name }}:buildcache
            type=gha,scope=${{ matrix.name }}
          cache-to: |
            type=registry,ref=${{ env.REGISTRY }}/${{ steps.release.outputs.owner }}/deepsonar-${{ matrix.name }}:buildcache,mode=max
            type=gha,mode=max,scope=${{ matrix.name }}
      - id: image
        name: Final digest + pin src
        shell: bash
        env:
          IMAGE_NAME: ${{ env.REGISTRY }}/${{ steps.release.outputs.owner }}/deepsonar-${{ matrix.name }}
          FINGERPRINT: ${{ steps.fingerprint.outputs.fingerprint }}
          SRC_TAG: ${{ steps.fingerprint.outputs.src_tag }}
          SKIP: ${{ steps.resolve.outputs.skip }}
          REUSE_DIGEST: ${{ steps.resolve.outputs.digest }}
          BUILD_DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          set -euo pipefail
          if [[ "$SKIP" == "true" ]]; then
            digest="$REUSE_DIGEST"
          else
            digest="$BUILD_DIGEST"
            DIGEST="$digest" bash agent-harness/resolve-image-src-cache.sh pin
          fi
          [[ "$digest" =~ ^sha256:[0-9a-f]{64}$ ]]
          printf 'digest=%s\n' "$digest" >> "$GITHUB_OUTPUT"
      - name: 按 Registry 发布标签
        id: publish
        env:
          IMAGE_NAME: ${{ env.REGISTRY }}/${{ steps.release.outputs.owner }}/deepsonar-${{ matrix.name }}
          SOURCE_DIGEST: ${{ steps.image.outputs.digest }}
          GHCR_TAGS: ${{ steps.meta.outputs.tags }}
          ACR_TAGS: ${{ steps.acr-meta.outputs.tags }}
          DOCKERHUB_TAGS: ${{ steps.dockerhub-meta.outputs.tags }}
          ACR_CONFIGURED: ${{ steps.acr-config.outputs.configured }}
          PLATFORMS: ${{ matrix.platforms }}
        run: |
          set -euo pipefail
          retry_imagetools_create() {
            local attempt=1 max_attempts=4 delay_seconds=5
            while true; do
              if GODEBUG=http2client=0 timeout --foreground --signal=TERM --kill-after=1m 20m docker buildx imagetools create "$@"; then return 0; fi
              if (( attempt >= max_attempts )); then
                echo "imagetools create 在 ${max_attempts} 次尝试后仍失败。" >&2
                echo 'CHANNEL_PUBLISH_FAILED=true' >> "$GITHUB_ENV"
                return 1
              fi
              echo "imagetools create 第 ${attempt} 次失败，${delay_seconds} 秒后重试。" >&2
              sleep "$delay_seconds"
              attempt=$((attempt + 1))
              delay_seconds=$((delay_seconds * 2))
            done
          }
          publish_tags() {
            local use_retry="$1" tags="$2"
            shift 2
            local sources=("$@")
            local tag_args=()
            while IFS= read -r tag; do
              [[ -n "$tag" ]] || continue
              tag_args+=(-t "$tag")
            done <<< "$tags"
            [[ ${#tag_args[@]} -gt 0 ]]
            if [[ "$use_retry" == "true" ]]; then
              retry_imagetools_create --prefer-index=false "${tag_args[@]}" "${sources[@]}"
            else
              docker buildx imagetools create --prefer-index=false "${tag_args[@]}" "${sources[@]}"
            fi
          }
          source_ref="${IMAGE_NAME}@${SOURCE_DIGEST}"
          selected_sources_text="$(bash agent-harness/select-runtime-platform-sources.sh "$source_ref" "$PLATFORMS")"
          mapfile -t selected_sources <<< "$selected_sources_text"
          [[ ${#selected_sources[@]} -gt 0 ]]
          publish_tags false "$GHCR_TAGS" "${selected_sources[@]}"
          canonical_tag="$(printf '%s\n' "$GHCR_TAGS" | sed -n '1p')"
          clean_digest="$(docker buildx imagetools inspect "$canonical_tag" --format '{{.Manifest.Digest}}')"
          [[ "$clean_digest" =~ ^sha256:[0-9a-f]{64}$ ]]
          printf 'digest=%s\n' "$clean_digest" >> "$GITHUB_OUTPUT"
          clean_source="${IMAGE_NAME}@${clean_digest}"
          if [[ "$ACR_CONFIGURED" == "true" ]]; then publish_tags true "$ACR_TAGS" "$clean_source"; fi
          if [[ -n "${DOCKERHUB_TAGS:-}" ]] && ! publish_tags true "$DOCKERHUB_TAGS" "$clean_source"; then
            echo "::warning::Docker Hub 标签发布失败；记录步骤将把本次 release 标记为失败。"
            echo "Docker Hub 标签复制重试耗尽；record-runtime-image-digest 将拒绝生成未验证清单。" >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi
      - name: 保存运行时 manifest digest
        env:
          IMAGE_KEY: deepsonar-${{ matrix.name }}
          DIGEST: ${{ steps.publish.outputs.digest }}
          PLATFORMS: ${{ matrix.platforms }}
          GHCR_REF: ghcr.io/${{ steps.release.outputs.owner }}/deepsonar-${{ matrix.name }}
          ACR_CONFIGURED: ${{ steps.acr-config.outputs.configured }}
          ACR_TAGS: ${{ steps.acr-meta.outputs.tags }}
          DOCKERHUB_TAGS: ${{ steps.dockerhub-meta.outputs.tags }}
          DOCKERHUB_CONFIGURED: ${{ steps.dockerhub-meta.outputs.tags != '' }}
          DOCKERHUB_UNAVAILABLE_REASON: credentials_missing_or_not_published
          ACR_UNAVAILABLE_REASON: credentials_missing
          VERSION: ${{ needs.base-image.outputs.version }}
        run: |
          set -euo pipefail
          VERSION="${VERSION#v}" node agent-harness/record-runtime-image-digest.mjs "release-digests/${{ matrix.name }}.json"
      - uses: actions/upload-artifact@v4
        with:
          name: runtime-image-digest-${{ matrix.name }}
          path: release-digests/${{ matrix.name }}.json
          if-no-files-found: error

  # Chrome Audit/Test 按架构原生构建。Chrome Fuzz arm64 使用固定的 x86_64
  # Clang 交叉编译，QEMU 只组装目标运行时；arm64 fuzz 冒烟在下方独立原生门禁执行。
  chrome-image-builds:
    needs: base-image
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 240
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: chrome-audit
            toolset: chrome-audit
            config: agent-harness/chrome-audit-runtime.json
            dockerfile: deploy/Dockerfile.agent-chrome-audit
            platform: linux/amd64
            arch: amd64
            runner: ubuntu-latest
            title: DeepSonar Chrome Audit
            description: Project-opt-in Chrome/C++ static-analysis runtime with partial clone, Semgrep, Clang/LLVM and binutils.
          - name: chrome-audit
            toolset: chrome-audit
            config: agent-harness/chrome-audit-runtime.json
            dockerfile: deploy/Dockerfile.agent-chrome-audit
            platform: linux/arm64
            arch: arm64
            runner: ubuntu-24.04-arm
            title: DeepSonar Chrome Audit
            description: Project-opt-in Chrome/C++ static-analysis runtime with partial clone, Semgrep, Clang/LLVM and binutils.
          - name: chrome-test
            toolset: chrome-test
            config: agent-harness/chrome-test-runtime.json
            dockerfile: deploy/Dockerfile.agent-chrome-test
            platform: linux/amd64
            arch: amd64
            runner: ubuntu-latest
            title: DeepSonar Chrome Test
            description: Project-opt-in pinned Chromium headless/CDP runtime with a governed no-sandbox wrapper and Playwright path.
          - name: chrome-test
            toolset: chrome-test
            config: agent-harness/chrome-test-runtime.json
            dockerfile: deploy/Dockerfile.agent-chrome-test
            platform: linux/arm64
            arch: arm64
            runner: ubuntu-24.04-arm
            title: DeepSonar Chrome Test
            description: Project-opt-in pinned Chromium headless/CDP runtime with a governed no-sandbox wrapper and Playwright path.
          - name: chrome-fuzz
            toolset: chrome-fuzz
            config: agent-harness/chrome-fuzz-runtime.json
            dockerfile: deploy/Dockerfile.agent-chrome-fuzz
            platform: linux/amd64
            arch: amd64
            runner: ubuntu-latest
            title: DeepSonar Chrome Fuzz
            description: Project-opt-in V8 fuzz runtime built from pinned source with real d8, compiler-rt, libFuzzer and AFL++.
          - name: chrome-fuzz
            toolset: chrome-fuzz
            config: agent-harness/chrome-fuzz-runtime.json
            dockerfile: deploy/Dockerfile.agent-chrome-fuzz
            platform: linux/arm64
            arch: arm64
            runner: ubuntu-latest
            title: DeepSonar Chrome Fuzz
            description: Project-opt-in V8 fuzz runtime built from pinned source with real d8, compiler-rt, libFuzzer and AFL++.
    env:
      DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
      DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
      ALIYUN_REGISTRY: ${{ secrets.ALIYUN_REGISTRY }}
      ALIYUN_REGISTRY_NAMESPACE: ${{ secrets.ALIYUN_REGISTRY_NAMESPACE }}
      ALIYUN_REGISTRY_USERNAME: ${{ secrets.ALIYUN_REGISTRY_USERNAME }}
      ALIYUN_REGISTRY_PASSWORD: ${{ secrets.ALIYUN_REGISTRY_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.base-image.outputs.checkout_ref }}
      - id: release
        name: Resolve registry namespace
        shell: bash
        run: |
          set -euo pipefail
          version="${{ needs.base-image.outputs.version }}"
          owner="${GITHUB_REPOSITORY_OWNER,,}"
          [[ -n "$version" ]]
          [[ -n "$owner" ]]
          printf 'version=%s\n' "$version" >> "$GITHUB_OUTPUT"
          printf 'owner=%s\n' "$owner" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-qemu-action@v3
        if: ${{ matrix.name == 'chrome-fuzz' && matrix.arch == 'arm64' }}
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Check ACR configuration
        id: acr-config
        shell: bash
        run: |
          set -euo pipefail
          if [[ -n "$ALIYUN_REGISTRY" && -n "$ALIYUN_REGISTRY_NAMESPACE" && -n "$ALIYUN_REGISTRY_USERNAME" && -n "$ALIYUN_REGISTRY_PASSWORD" ]]; then
            echo 'configured=true' >> "$GITHUB_OUTPUT"
          else
            echo 'configured=false' >> "$GITHUB_OUTPUT"
            echo 'ACR credentials are incomplete; the release will record ACR as unavailable.' >> "$GITHUB_STEP_SUMMARY"
          fi
      - name: Login Docker Hub
        if: ${{ env.DOCKERHUB_USERNAME != '' && env.DOCKERHUB_TOKEN != '' }}
        uses: docker/login-action@v3
        with:
          registry: docker.io
          username: ${{ env.DOCKERHUB_USERNAME }}
          password: ${{ env.DOCKERHUB_TOKEN }}
      - name: Login Aliyun ACR
        if: ${{ steps.acr-config.outputs.configured == 'true' }}
        uses: docker/login-action@v3
        with:
          registry: ${{ env.ALIYUN_REGISTRY }}
          username: ${{ env.ALIYUN_REGISTRY_USERNAME }}
          password: ${{ env.ALIYUN_REGISTRY_PASSWORD }}
      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ steps.release.outputs.owner }}/deepsonar-${{ matrix.name }}
          labels: |
            org.opencontainers.image.title=${{ matrix.title }}
            org.opencontainers.image.description=${{ matrix.description }}
            org.opencontainers.image.licenses=LicenseRef-DeepSonar-Proprietary
            org.opencontainers.image.documentation=https://github.com/SummerSec/DeepSonar/blob/main/docs/RELEASE_RUNTIME_IMAGES.md
          annotations: |
            org.opencontainers.image.title=${{ matrix.title }}
            org.opencontainers.image.description=${{ matrix.description }}
            org.opencontainers.image.licenses=LicenseRef-DeepSonar-Proprietary
            org.opencontainers.image.documentation=https://github.com/SummerSec/DeepSonar/blob/main/docs/RELEASE_RUNTIME_IMAGES.md
          tags: |
            type=semver,pattern={{version}}
            type=sha,prefix=
        env:
          DOCKER_METADATA_ANNOTATIONS_LEVELS: manifest,index
      - id: dockerhub-meta
        if: ${{ env.DOCKERHUB_USERNAME != '' && env.DOCKERHUB_TOKEN != '' }}
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.DOCKERHUB_IMAGE }}
          flavor: latest=false
          tags: |
            type=semver,pattern=${{ matrix.name }}-{{version}}
            type=sha,prefix=${{ matrix.name }}-sha-
      - id: acr-meta
        if: ${{ steps.acr-config.outputs.configured == 'true' }}
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.ALIYUN_REGISTRY }}/${{ env.ALIYUN_REGISTRY_NAMESPACE }}/deepsonar-${{ matrix.name }}
          flavor: latest=false
          tags: |
            type=semver,pattern={{version}}
            type=sha,prefix=sha-
      - id: fingerprint
        name: Build fingerprint
        shell: bash
        run: |
          set -euo pipefail
          node agent-harness/image-build-fingerprint.mjs \
            --preset "deepsonar-${{ matrix.toolset }}" \
            --platforms "${{ matrix.platform }}" \
            --build-arg "BASE_IMAGE=ghcr.io/${{ steps.release.outputs.owner }}/deepsonar-base@${{ needs.base-image.outputs.digest }}"
      - id: resolve
        name: Resolve src cache
        shell: bash
        env:
          IMAGE_NAME: ${{ env.REGISTRY }}/${{ steps.release.outputs.owner }}/deepsonar-${{ matrix.name }}
          FINGERPRINT: ${{ steps.fingerprint.outputs.fingerprint }}
          SRC_TAG: ${{ steps.fingerprint.outputs.src_tag }}
        run: bash agent-harness/resolve-image-src-cache.sh resolve
      - name: Record reused Chrome image
        if: ${{ steps.resolve.outputs.skip == 'true' }}
        run: |
          set -euo pipefail
          echo "${{ matrix.name }} build unchanged: reused immutable src cache; release still republishes and inspects every configured channel" >> "$GITHUB_STEP_SUMMARY"
      - id: build
        if: ${{ steps.resolve.outputs.skip != 'true' }}
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          outputs: type=image,name=${{ env.REGISTRY }}/${{ steps.release.outputs.owner }}/deepsonar-${{ matrix.name }},push-by-digest=true,name-canonical=true,push=true
          platforms: ${{ matrix.platform }}
          build-args: BASE_IMAGE=ghcr.io/${{ steps.release.outputs.owner }}/deepsonar-base@${{ needs.base-image.outputs.digest }}
          labels: ${{ steps.meta.outputs.labels }}
          annotations: ${{ steps.meta.outputs.annotations }}
          sbom: true
          provenance: mode=max
          cache-from: |
            type=registry,ref=${{ env.REGISTRY }}/${{ steps.release.outputs.owner }}/deepsonar-${{ matrix.name }}:buildcache-${{ matrix.arch }}
            type=gha,scope=${{ matrix.name }}-${{ matrix.arch }}
          cache-to: |
            type=registry,ref=${{ env.REGISTRY }}/${{ steps.release.outputs.owner }}/deepsonar-${{ matrix.name }}:buildcache-${{ matrix.arch }},mode=max
            type=gha,mode=max,scope=${{ matrix.name }}-${{ matrix.arch }}
      - id: image
        name: Final digest and pin src
        shell: bash
        env:
          IMAGE_NAME: ${{ env.REGISTRY }}/${{ steps.release.outputs.owner }}/deepsonar-${{ matrix.name }}
          FINGERPRINT: ${{ steps.fingerprint.outputs.fingerprint }}
          SRC_TAG: ${{ steps.fingerprint.outputs.src_tag }}
          SKIP: ${{ steps.resolve.outputs.skip }}
          REUSE_DIGEST: ${{ steps.resolve.outputs.digest }}
          BUILD_DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          set -euo pipefail
          if [[ "$SKIP" == "true" ]]; then
            digest="$REUSE_DIGEST"
          else
            digest="$BUILD_DIGEST"
            DIGEST="$digest" bash agent-harness/resolve-image-src-cache.sh pin
          fi
          [[ "$digest" =~ ^sha256:[0-9a-f]{64}$ ]]
          printf 'digest=%s\n' "$digest" >> "$GITHUB_OUTPUT"
      - name: Smoke native Chrome child from immutable digest
        if: ${{ matrix.name != 'chrome-fuzz' || matrix.arch != 'arm64' }}
        env:
          IMAGE_NAME: ${{ env.REGISTRY }}/${{ steps.release.outputs.owner }}/deepsonar-${{ matrix.name }}
          DIGEST: ${{ steps.image.outputs.digest }}
        run: |
          set -euo pipefail
          image_ref="${IMAGE_NAME}@${DIGEST}"
          [[ "$DIGEST" =~ ^sha256:[0-9a-f]{64}$ ]]
          docker pull --platform "${{ matrix.platform }}" "$image_ref"
          node agent-harness/test-chrome-runtime.mjs "$image_ref" "${{ matrix.toolset }}" "${{ matrix.config }}" "${{ matrix.platform }}"
      - name: Save native Chrome child digest
        env:
          DIGEST: ${{ steps.image.outputs.digest }}
        run: |
          set -euo pipefail
          mkdir -p chrome-arch
          [[ "$DIGEST" =~ ^sha256:[0-9a-f]{64}$ ]]
          node -e 'const fs=require("node:fs"); const digest=process.env.DIGEST; fs.writeFileSync("chrome-arch/${{ matrix.name }}-${{ matrix.arch }}.json", JSON.stringify({image_key:"deepsonar-${{ matrix.name }}",platform:"${{ matrix.platform }}",digest})+"\n")'
      - uses: actions/upload-artifact@v4
        with:
          name: chrome-arch-${{ matrix.name }}-${{ matrix.arch }}
          path: chrome-arch/${{ matrix.name }}-${{ matrix.arch }}.json
          if-no-files-found: error

  # QEMU 可以组装交叉构建的 fuzz 镜像，但不是 ASan 插桩 V8 冒烟的可靠运行环境。
  # 在原生环境校验不可变子镜像。
  chrome-fuzz-arm64-smoke:
    needs: [base-image, chrome-image-builds]
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 30
    permissions:
      contents: read
      packages: read
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.base-image.outputs.checkout_ref }}
      - id: release
        name: 解析 registry 命名空间
        shell: bash
        run: |
          set -euo pipefail
          owner="${GITHUB_REPOSITORY_OWNER,,}"
          [[ -n "$owner" ]]
          printf 'owner=%s\n' "$owner" >> "$GITHUB_OUTPUT"
      - uses: actions/download-artifact@v4
        with:
          name: chrome-arch-chrome-fuzz-arm64
          path: chrome-arch
      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: 原生执行 Chrome Fuzz 不可变 digest 冒烟
        env:
          IMAGE_NAME: ${{ env.REGISTRY }}/${{ steps.release.outputs.owner }}/deepsonar-chrome-fuzz
        run: |
          set -euo pipefail
          digest="$(jq -r '.digest' chrome-arch/chrome-fuzz-arm64.json)"
          [[ "$digest" =~ ^sha256:[0-9a-f]{64}$ ]]
          image_ref="${IMAGE_NAME}@${digest}"
          docker pull --platform linux/arm64 "$image_ref"
          node agent-harness/test-chrome-runtime.mjs "$image_ref" chrome-fuzz agent-harness/chrome-fuzz-runtime.json linux/arm64

  # 汇总 Audit/Test 的原生子镜像与 Fuzz 的交叉构建子镜像（其 arm64 已通过上方
  # 原生冒烟门禁），发布各配置 registry 的 canonical index 并记录 inspect 证据。
  chrome-images:
    needs: [base-image, chrome-image-builds, chrome-fuzz-arm64-smoke]
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: chrome-audit
            platforms: linux/amd64,linux/arm64
            title: DeepSonar Chrome Audit
            description: Project-opt-in Chrome/C++ static-analysis runtime with partial clone, Semgrep, Clang/LLVM and binutils.
          - name: chrome-test
            platforms: linux/amd64,linux/arm64
            title: DeepSonar Chrome Test
            description: Project-opt-in pinned Chromium headless/CDP runtime with a governed no-sandbox wrapper and Playwright path.
          - name: chrome-fuzz
            platforms: linux/amd64,linux/arm64
            title: DeepSonar Chrome Fuzz
            description: Project-opt-in V8 fuzz runtime built from pinned source with real d8, compiler-rt, libFuzzer and AFL++.
    env:
      DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
      DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
      ALIYUN_REGISTRY: ${{ secrets.ALIYUN_REGISTRY }}
      ALIYUN_REGISTRY_NAMESPACE: ${{ secrets.ALIYUN_REGISTRY_NAMESPACE }}
      ALIYUN_REGISTRY_USERNAME: ${{ secrets.ALIYUN_REGISTRY_USERNAME }}
      ALIYUN_REGISTRY_PASSWORD: ${{ secrets.ALIYUN_REGISTRY_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.base-image.outputs.checkout_ref }}
      - id: release
        name: Resolve registry namespace
        shell: bash
        run: |
          set -euo pipefail
          version="${{ needs.base-image.outputs.version }}"
          owner="${GITHUB_REPOSITORY_OWNER,,}"
          [[ -n "$version" && -n "$owner" ]]
          printf 'version=%s\n' "$version" >> "$GITHUB_OUTPUT"
          printf 'owner=%s\n' "$owner" >> "$GITHUB_OUTPUT"
      - uses: actions/download-artifact@v4
        with:
          pattern: chrome-arch-${{ matrix.name }}-*
          path: chrome-arch
          merge-multiple: true
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Check ACR configuration
        id: acr-config
        shell: bash
        run: |
          set -euo pipefail
          if [[ -n "$ALIYUN_REGISTRY" && -n "$ALIYUN_REGISTRY_NAMESPACE" && -n "$ALIYUN_REGISTRY_USERNAME" && -n "$ALIYUN_REGISTRY_PASSWORD" ]]; then
            echo 'configured=true' >> "$GITHUB_OUTPUT"
          else
            echo 'configured=false' >> "$GITHUB_OUTPUT"
            echo 'ACR credentials are incomplete; the release will record ACR as unavailable.' >> "$GITHUB_STEP_SUMMARY"
          fi
      - name: Login Docker Hub
        if: ${{ env.DOCKERHUB_USERNAME != '' && env.DOCKERHUB_TOKEN != '' }}
        uses: docker/login-action@v3
        with:
          registry: docker.io
          username: ${{ env.DOCKERHUB_USERNAME }}
          password: ${{ env.DOCKERHUB_TOKEN }}
      - name: Login Aliyun ACR
        if: ${{ steps.acr-config.outputs.configured == 'true' }}
        uses: docker/login-action@v3
        with:
          registry: ${{ env.ALIYUN_REGISTRY }}
          username: ${{ env.ALIYUN_REGISTRY_USERNAME }}
          password: ${{ env.ALIYUN_REGISTRY_PASSWORD }}
      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ steps.release.outputs.owner }}/deepsonar-${{ matrix.name }}
          labels: |
            org.opencontainers.image.title=${{ matrix.title }}
            org.opencontainers.image.description=${{ matrix.description }}
            org.opencontainers.image.licenses=LicenseRef-DeepSonar-Proprietary
            org.opencontainers.image.documentation=https://github.com/SummerSec/DeepSonar/blob/main/docs/RELEASE_RUNTIME_IMAGES.md
          annotations: |
            org.opencontainers.image.title=${{ matrix.title }}
            org.opencontainers.image.description=${{ matrix.description }}
            org.opencontainers.image.licenses=LicenseRef-DeepSonar-Proprietary
            org.opencontainers.image.documentation=https://github.com/SummerSec/DeepSonar/blob/main/docs/RELEASE_RUNTIME_IMAGES.md
          tags: |
            type=semver,pattern={{version}}
            type=sha,prefix=
        env:
          DOCKER_METADATA_ANNOTATIONS_LEVELS: manifest,index
      - id: dockerhub-meta
        if: ${{ env.DOCKERHUB_USERNAME != '' && env.DOCKERHUB_TOKEN != '' }}
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.DOCKERHUB_IMAGE }}
          flavor: latest=false
          tags: |
            type=semver,pattern=${{ matrix.name }}-{{version}}
            type=sha,prefix=${{ matrix.name }}-sha-
      - id: acr-meta
        if: ${{ steps.acr-config.outputs.configured == 'true' }}
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.ALIYUN_REGISTRY }}/${{ env.ALIYUN_REGISTRY_NAMESPACE }}/deepsonar-${{ matrix.name }}
          flavor: latest=false
          tags: |
            type=semver,pattern={{version}}
            type=sha,prefix=sha-
      - id: image
        name: Assemble and publish Chrome multi-arch index
        env:
          IMAGE_NAME: ${{ env.REGISTRY }}/${{ steps.release.outputs.owner }}/deepsonar-${{ matrix.name }}
          GHCR_TAGS: ${{ steps.meta.outputs.tags }}
          ACR_TAGS: ${{ steps.acr-meta.outputs.tags }}
          DOCKERHUB_TAGS: ${{ steps.dockerhub-meta.outputs.tags }}
          ACR_CONFIGURED: ${{ steps.acr-config.outputs.configured }}
        shell: bash
        run: |
          set -euo pipefail
          amd64_digest="$(jq -r '.digest' "chrome-arch/${{ matrix.name }}-amd64.json")"
          arm64_digest="$(jq -r '.digest' "chrome-arch/${{ matrix.name }}-arm64.json")"
          [[ "$amd64_digest" =~ ^sha256:[0-9a-f]{64}$ ]]
          [[ "$arm64_digest" =~ ^sha256:[0-9a-f]{64}$ ]]
          amd64_source="${IMAGE_NAME}@${amd64_digest}"
          arm64_source="${IMAGE_NAME}@${arm64_digest}"
          mapfile -t amd64_sources < <(bash agent-harness/select-runtime-platform-sources.sh "$amd64_source" "linux/amd64")
          mapfile -t arm64_sources < <(bash agent-harness/select-runtime-platform-sources.sh "$arm64_source" "linux/arm64")
          [[ ${#amd64_sources[@]} -eq 1 ]]
          [[ ${#arm64_sources[@]} -eq 1 ]]
          source_refs=("${amd64_sources[0]}" "${arm64_sources[0]}")
          annotation_args=(
            --annotation "index:org.opencontainers.image.title=${{ matrix.title }}"
            --annotation "index:org.opencontainers.image.description=${{ matrix.description }}"
            --annotation "index:org.opencontainers.image.source=https://github.com/SummerSec/DeepSonar"
            --annotation "index:org.opencontainers.image.documentation=https://github.com/SummerSec/DeepSonar/blob/main/docs/RELEASE_RUNTIME_IMAGES.md"
            --annotation "index:org.opencontainers.image.licenses=LicenseRef-DeepSonar-Proprietary"
          )
          retry_imagetools_create() {
            local attempt=1 max_attempts=4 delay_seconds=5
            while true; do
              if GODEBUG=http2client=0 timeout --foreground --signal=TERM --kill-after=1m 20m docker buildx imagetools create "$@"; then return 0; fi
              if (( attempt >= max_attempts )); then
                echo 'CHANNEL_PUBLISH_FAILED=true' >> "$GITHUB_ENV"
                return 1
              fi
              sleep "$delay_seconds"
              attempt=$((attempt + 1))
              delay_seconds=$((delay_seconds * 2))
            done
          }
          tag_args() {
            local tags="$1"; local -n output=$2; output=()
            while IFS= read -r tag; do [[ -n "$tag" ]] && output+=(-t "$tag"); done <<< "$tags"
            [[ ${#output[@]} -gt 0 ]]
          }
          tag_args "$GHCR_TAGS" ghcr_tag_args
          docker buildx imagetools create "${annotation_args[@]}" "${ghcr_tag_args[@]}" "${source_refs[@]}"
          primary="$(printf '%s\n' "$GHCR_TAGS" | sed '/^$/d' | head -n1)"
          digest="$(docker buildx imagetools inspect "$primary" | sed -nE 's/^[[:space:]]*Digest:[[:space:]]*(sha256:[0-9a-f]{64}).*/\1/p' | head -n1)"
          [[ "$digest" =~ ^sha256:[0-9a-f]{64}$ ]]
          clean_source="${IMAGE_NAME}@${digest}"
          if [[ "$ACR_CONFIGURED" == "true" ]]; then
            tag_args "$ACR_TAGS" acr_tag_args
            retry_imagetools_create "${annotation_args[@]}" "${acr_tag_args[@]}" "$clean_source"
          fi
          if [[ -n "${DOCKERHUB_TAGS:-}" ]]; then
            tag_args "$DOCKERHUB_TAGS" dockerhub_tag_args
            if ! retry_imagetools_create "${annotation_args[@]}" "${dockerhub_tag_args[@]}" "$clean_source"; then
              echo '::warning::Docker Hub tag publication failed; refusing an unchecked Chrome release record'
              exit 1
            fi
          fi
          printf 'digest=%s\n' "$digest" >> "$GITHUB_OUTPUT"
      - name: Save Chrome manifest digest
        env:
          IMAGE_KEY: deepsonar-${{ matrix.name }}
          DIGEST: ${{ steps.image.outputs.digest }}
          PLATFORMS: ${{ matrix.platforms }}
          GHCR_REF: ghcr.io/${{ steps.release.outputs.owner }}/deepsonar-${{ matrix.name }}
          ACR_CONFIGURED: ${{ steps.acr-config.outputs.configured }}
          ACR_TAGS: ${{ steps.acr-meta.outputs.tags }}
          DOCKERHUB_TAGS: ${{ steps.dockerhub-meta.outputs.tags }}
          DOCKERHUB_CONFIGURED: ${{ steps.dockerhub-meta.outputs.tags != '' }}
          DOCKERHUB_UNAVAILABLE_REASON: credentials_missing_or_not_published
          ACR_UNAVAILABLE_REASON: credentials_missing
          VERSION: ${{ needs.base-image.outputs.version }}
        run: |
          set -euo pipefail
          VERSION="${VERSION#v}" node agent-harness/record-runtime-image-digest.mjs "release-digests/${{ matrix.name }}.json"
      - uses: actions/upload-artifact@v4
        with:
          name: runtime-image-digest-${{ matrix.name }}
          path: release-digests/${{ matrix.name }}.json
          if-no-files-found: error

  kali-minimal:
    needs: base-image
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
      DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
      ALIYUN_REGISTRY: ${{ secrets.ALIYUN_REGISTRY }}
      ALIYUN_REGISTRY_NAMESPACE: ${{ secrets.ALIYUN_REGISTRY_NAMESPACE }}
      ALIYUN_REGISTRY_USERNAME: ${{ secrets.ALIYUN_REGISTRY_USERNAME }}
      ALIYUN_REGISTRY_PASSWORD: ${{ secrets.ALIYUN_REGISTRY_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.base-image.outputs.checkout_ref }}
      - id: release
        name: 解析 registry 命名空间
        shell: bash
        run: |
          set -euo pipefail
          version="${{ needs.base-image.outputs.version }}"
          owner="${GITHUB_REPOSITORY_OWNER,,}"
          [[ -n "$version" ]]
          [[ -n "$owner" ]]
          printf 'version=%s\n' "$version" >> "$GITHUB_OUTPUT"
          printf 'owner=%s\n' "$owner" >> "$GITHUB_OUTPUT"
          printf 'image_name=ghcr.io/%s/deepsonar-kali-minimal\n' "$owner" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: 检查 ACR 配置
        id: acr-config
        shell: bash
        run: |
          set -euo pipefail
          if [[ -n "$ALIYUN_REGISTRY" && -n "$ALIYUN_REGISTRY_NAMESPACE" && -n "$ALIYUN_REGISTRY_USERNAME" && -n "$ALIYUN_REGISTRY_PASSWORD" ]]; then
            echo 'configured=true' >> "$GITHUB_OUTPUT"
          else
            echo 'configured=false' >> "$GITHUB_OUTPUT"
            echo 'ACR 凭据未完整配置，将只发布 GHCR/Docker Hub。' >> "$GITHUB_STEP_SUMMARY"
          fi
      - name: 登录 Docker Hub
        if: ${{ env.DOCKERHUB_USERNAME != '' && env.DOCKERHUB_TOKEN != '' }}
        uses: docker/login-action@v3
        with:
          registry: docker.io
          username: ${{ env.DOCKERHUB_USERNAME }}
          password: ${{ env.DOCKERHUB_TOKEN }}
      - name: 登录阿里云 ACR
        if: ${{ steps.acr-config.outputs.configured == 'true' }}
        uses: docker/login-action@v3
        with:
          registry: ${{ env.ALIYUN_REGISTRY }}
          username: ${{ env.ALIYUN_REGISTRY_USERNAME }}
          password: ${{ env.ALIYUN_REGISTRY_PASSWORD }}
      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ steps.release.outputs.image_name }}
          labels: |
            org.opencontainers.image.title=DeepSonar Kali Test
            org.opencontainers.image.description=DeepSonar Test 默认使用的精简 Kali 多语言工具链；不安装 Kali metapackage 或 GUI。
            org.opencontainers.image.licenses=LicenseRef-DeepSonar-Proprietary
            org.opencontainers.image.documentation=https://github.com/SummerSec/DeepSonar/blob/main/docs/RELEASE_RUNTIME_IMAGES.md
          annotations: |
            org.opencontainers.image.title=DeepSonar Kali Test
            org.opencontainers.image.description=DeepSonar Test 默认使用的精简 Kali 多语言工具链；不安装 Kali metapackage 或 GUI。
            org.opencontainers.image.licenses=LicenseRef-DeepSonar-Proprietary
            org.opencontainers.image.documentation=https://github.com/SummerSec/DeepSonar/blob/main/docs/RELEASE_RUNTIME_IMAGES.md
          tags: |
            type=semver,pattern={{version}}
            type=sha,prefix=
        env:
          DOCKER_METADATA_ANNOTATIONS_LEVELS: manifest
      - id: dockerhub-meta
        if: ${{ env.DOCKERHUB_USERNAME != '' && env.DOCKERHUB_TOKEN != '' }}
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.DOCKERHUB_IMAGE }}
          flavor: latest=false
          tags: |
            type=semver,pattern=kali-minimal-{{version}}
            type=sha,prefix=kali-minimal-sha-
      - id: acr-meta
        if: ${{ steps.acr-config.outputs.configured == 'true' }}
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.ALIYUN_REGISTRY }}/${{ env.ALIYUN_REGISTRY_NAMESPACE }}/deepsonar-kali-minimal
          flavor: latest=false
          tags: |
            type=semver,pattern={{version}}
            type=sha,prefix=sha-
      - id: fingerprint
        name: Build fingerprint
        shell: bash
        run: node agent-harness/image-build-fingerprint.mjs --preset deepsonar-kali-minimal
      - id: resolve
        name: Resolve src cache
        shell: bash
        env:
          IMAGE_NAME: ${{ steps.release.outputs.image_name }}
          FINGERPRINT: ${{ steps.fingerprint.outputs.fingerprint }}
          SRC_TAG: ${{ steps.fingerprint.outputs.src_tag }}
        run: bash agent-harness/resolve-image-src-cache.sh resolve
      - name: Free disk for Kali multi-arch build
        if: ${{ steps.resolve.outputs.skip != 'true' }}
        run: |
          set -euo pipefail
          sudo rm -rf \
            /usr/local/lib/android \
            /usr/share/dotnet \
            /opt/ghc \
            /usr/local/share/boost \
            /usr/share/swift \
            /usr/local/.ghcup \
            /opt/hostedtoolcache/CodeQL \
            /opt/hostedtoolcache/go \
            /opt/hostedtoolcache/Java_Temurin-Hotspot_jdk \
            "$AGENT_TOOLSDIRECTORY" 2>/dev/null || true
          sudo docker system prune -af || true
          df -h /
      - id: build-amd64
        if: ${{ steps.resolve.outputs.skip != 'true' }}
        name: Build linux/amd64 (push by digest)
        uses: docker/build-push-action@v6
        with:
          context: .
          file: deploy/Dockerfile.agent-kali-minimal
          platforms: linux/amd64
          outputs: type=image,name=${{ steps.release.outputs.image_name }},push-by-digest=true,name-canonical=true,push=true
          labels: ${{ steps.meta.outputs.labels }}
          annotations: ${{ steps.meta.outputs.annotations }}
          provenance: false
          sbom: false
          cache-from: |
            type=registry,ref=${{ steps.release.outputs.image_name }}:buildcache-amd64
            type=gha,scope=kali-minimal-amd64
          cache-to: |
            type=registry,ref=${{ steps.release.outputs.image_name }}:buildcache-amd64,mode=max
            type=gha,mode=max,scope=kali-minimal-amd64
      - name: Reclaim disk before arm64
        if: ${{ steps.resolve.outputs.skip != 'true' }}
        run: |
          set -euo pipefail
          docker builder prune -af || true
          docker system prune -af || true
          sudo rm -rf /tmp/* || true
          df -h /
      - id: build-arm64
        if: ${{ steps.resolve.outputs.skip != 'true' }}
        name: Build linux/arm64 (push by digest)
        uses: docker/build-push-action@v6
        with:
          context: .
          file: deploy/Dockerfile.agent-kali-minimal
          platforms: linux/arm64
          outputs: type=image,name=${{ steps.release.outputs.image_name }},push-by-digest=true,name-canonical=true,push=true
          labels: ${{ steps.meta.outputs.labels }}
          annotations: ${{ steps.meta.outputs.annotations }}
          provenance: false
          sbom: false
          cache-from: |
            type=registry,ref=${{ steps.release.outputs.image_name }}:buildcache-arm64
            type=gha,scope=kali-minimal-arm64
          cache-to: |
            type=registry,ref=${{ steps.release.outputs.image_name }}:buildcache-arm64,mode=max
            type=gha,mode=max,scope=kali-minimal-arm64
      - name: Create multi-arch tags
        id: merge
        env:
          IMAGE_NAME: ${{ steps.release.outputs.image_name }}
          SKIP: ${{ steps.resolve.outputs.skip }}
          REUSE_DIGEST: ${{ steps.resolve.outputs.digest }}
          FINGERPRINT: ${{ steps.fingerprint.outputs.fingerprint }}
          SRC_TAG: ${{ steps.fingerprint.outputs.src_tag }}
          AMD64_DIGEST: ${{ steps.build-amd64.outputs.digest }}
          ARM64_DIGEST: ${{ steps.build-arm64.outputs.digest }}
          GHCR_TAGS: ${{ steps.meta.outputs.tags }}
          DOCKERHUB_TAGS: ${{ steps.dockerhub-meta.outputs.tags }}
          ACR_TAGS: ${{ steps.acr-meta.outputs.tags }}
          ACR_CONFIGURED: ${{ steps.acr-config.outputs.configured }}
        run: |
          set -euo pipefail
          retry_imagetools_create() {
            local attempt=1
            local max_attempts=4
            local delay_seconds=5
            while true; do
              if GODEBUG=http2client=0 timeout --foreground --signal=TERM --kill-after=1m 20m docker buildx imagetools create "$@"; then
                return 0
              fi
              if (( attempt >= max_attempts )); then
                echo "imagetools create 在 ${max_attempts} 次尝试后仍失败。" >&2
                echo 'CHANNEL_PUBLISH_FAILED=true' >> "$GITHUB_ENV"
                return 1
              fi
              echo "imagetools create 第 ${attempt} 次失败，${delay_seconds} 秒后重试。" >&2
              sleep "$delay_seconds"
              attempt=$((attempt + 1))
              delay_seconds=$((delay_seconds * 2))
            done
          }
          publish_from_source() {
            local source="$1"
            annotation_args=(
              --annotation "index:org.opencontainers.image.title=DeepSonar Kali Test"
              --annotation "index:org.opencontainers.image.description=DeepSonar Test 默认使用的精简 Kali 多语言工具链；不安装 Kali metapackage 或 GUI。"
              --annotation "index:org.opencontainers.image.source=https://github.com/SummerSec/DeepSonar"
              --annotation "index:org.opencontainers.image.documentation=https://github.com/SummerSec/DeepSonar/blob/main/docs/RELEASE_RUNTIME_IMAGES.md"
              --annotation "index:org.opencontainers.image.licenses=LicenseRef-DeepSonar-Proprietary"
            )
            if [[ "$ACR_CONFIGURED" == "true" ]]; then
              acr_tag_args=()
              while IFS= read -r tag; do
                [[ -n "$tag" ]] || continue
                acr_tag_args+=(-t "$tag")
              done <<< "${ACR_TAGS:-}"
              [[ ${#acr_tag_args[@]} -gt 0 ]]
              retry_imagetools_create "${annotation_args[@]}" "${acr_tag_args[@]}" "$source"
            fi
            ghcr_tag_args=()
            while IFS= read -r tag; do
              [[ -n "$tag" ]] || continue
              ghcr_tag_args+=(-t "$tag")
            done <<< "$GHCR_TAGS"
            [[ ${#ghcr_tag_args[@]} -gt 0 ]]
            docker buildx imagetools create "${annotation_args[@]}" "${ghcr_tag_args[@]}" "$source"
            primary="$(printf '%s\n' "$GHCR_TAGS" | sed '/^$/d' | head -n1)"
            digest="$(docker buildx imagetools inspect "$primary" \
              | sed -nE 's/^[[:space:]]*Digest:[[:space:]]*(sha256:[0-9a-f]{64}).*/\1/p' \
              | head -n1)"
            [[ "$digest" =~ ^sha256:[0-9a-f]{64}$ ]]
            immutable_primary="${primary}@${digest}"
            if [[ -n "${DOCKERHUB_TAGS:-}" ]]; then
              dockerhub_tag_args=()
              while IFS= read -r tag; do
                [[ -n "$tag" ]] || continue
                dockerhub_tag_args+=(-t "$tag")
              done <<< "$DOCKERHUB_TAGS"
              [[ ${#dockerhub_tag_args[@]} -gt 0 ]]
              if ! retry_imagetools_create "${annotation_args[@]}" "${dockerhub_tag_args[@]}" "$immutable_primary"; then
                echo "::warning::Docker Hub 标签发布失败；记录步骤将把本次 release 标记为失败。"
                echo "Docker Hub 标签复制重试耗尽；record-runtime-image-digest 将拒绝生成未验证清单。" >> "$GITHUB_STEP_SUMMARY"
                exit 1
              fi
            fi
            printf 'digest=%s\n' "$digest" >> "$GITHUB_OUTPUT"
            {
              printf 'primary=%s\n' "$primary"
              printf 'digest=%s\n' "$digest"
            } >> "$GITHUB_STEP_SUMMARY"
          }

          if [[ "$SKIP" == "true" ]]; then
            echo "Kali build unchanged; retag ${REUSE_DIGEST} across registries" >> "$GITHUB_STEP_SUMMARY"
            publish_from_source "${IMAGE_NAME}@${REUSE_DIGEST}"
          else
            source_refs=(
              "${IMAGE_NAME}@${AMD64_DIGEST}"
              "${IMAGE_NAME}@${ARM64_DIGEST}"
            )
            annotation_args=(
              --annotation "index:org.opencontainers.image.title=DeepSonar Kali Test"
              --annotation "index:org.opencontainers.image.description=DeepSonar Test 默认使用的精简 Kali 多语言工具链；不安装 Kali metapackage 或 GUI。"
              --annotation "index:org.opencontainers.image.source=https://github.com/SummerSec/DeepSonar"
              --annotation "index:org.opencontainers.image.documentation=https://github.com/SummerSec/DeepSonar/blob/main/docs/RELEASE_RUNTIME_IMAGES.md"
              --annotation "index:org.opencontainers.image.licenses=LicenseRef-DeepSonar-Proprietary"
            )
            if [[ "$ACR_CONFIGURED" == "true" ]]; then
              acr_tag_args=()
              while IFS= read -r tag; do
                [[ -n "$tag" ]] || continue
                acr_tag_args+=(-t "$tag")
              done <<< "${ACR_TAGS:-}"
              [[ ${#acr_tag_args[@]} -gt 0 ]]
              retry_imagetools_create "${annotation_args[@]}" "${acr_tag_args[@]}" "${source_refs[@]}"
            fi
            ghcr_tag_args=()
            while IFS= read -r tag; do
              [[ -n "$tag" ]] || continue
              ghcr_tag_args+=(-t "$tag")
            done <<< "$GHCR_TAGS"
            [[ ${#ghcr_tag_args[@]} -gt 0 ]]
            docker buildx imagetools create "${annotation_args[@]}" "${ghcr_tag_args[@]}" "${source_refs[@]}"
            # 取 GHCR 首个标签的 multi-arch index digest
            primary="$(printf '%s\n' "$GHCR_TAGS" | sed '/^$/d' | head -n1)"
            # Inspect the GHCR destination before copying to another registry.
            # The Docker Hub source must be immutable; a mutable tag could move
            # between the GHCR publish and the cross-registry copy.
            digest="$(docker buildx imagetools inspect "$primary" \
              | sed -nE 's/^[[:space:]]*Digest:[[:space:]]*(sha256:[0-9a-f]{64}).*/\1/p' \
              | head -n1)"
            [[ "$digest" =~ ^sha256:[0-9a-f]{64}$ ]]
            immutable_primary="${primary}@${digest}"
            if [[ -n "${DOCKERHUB_TAGS:-}" ]]; then
              dockerhub_tag_args=()
              while IFS= read -r tag; do
                [[ -n "$tag" ]] || continue
                dockerhub_tag_args+=(-t "$tag")
              done <<< "$DOCKERHUB_TAGS"
              [[ ${#dockerhub_tag_args[@]} -gt 0 ]]
              if ! retry_imagetools_create "${annotation_args[@]}" "${dockerhub_tag_args[@]}" "$immutable_primary"; then
                echo "::warning::Docker Hub 标签发布失败；记录步骤将把本次 release 标记为失败。"
                echo "Docker Hub 标签复制重试耗尽；record-runtime-image-digest 将拒绝生成未验证清单。" >> "$GITHUB_STEP_SUMMARY"
                exit 1
              fi
            fi
            DIGEST="$digest" bash agent-harness/resolve-image-src-cache.sh pin
            printf 'digest=%s\n' "$digest" >> "$GITHUB_OUTPUT"
            {
              printf 'primary=%s\n' "$primary"
              printf 'digest=%s\n' "$digest"
            } >> "$GITHUB_STEP_SUMMARY"
          fi
      - name: 保存运行时 manifest digest
        env:
          IMAGE_KEY: deepsonar-kali-minimal
          DIGEST: ${{ steps.merge.outputs.digest }}
          PLATFORMS: linux/amd64,linux/arm64
          GHCR_REF: ghcr.io/${{ steps.release.outputs.owner }}/deepsonar-kali-minimal
          ACR_CONFIGURED: ${{ steps.acr-config.outputs.configured }}
          ACR_TAGS: ${{ steps.acr-meta.outputs.tags }}
          DOCKERHUB_TAGS: ${{ steps.dockerhub-meta.outputs.tags }}
          DOCKERHUB_CONFIGURED: ${{ steps.dockerhub-meta.outputs.tags != '' }}
          DOCKERHUB_UNAVAILABLE_REASON: credentials_missing_or_not_published
          ACR_UNAVAILABLE_REASON: credentials_missing
          VERSION: ${{ needs.base-image.outputs.version }}
        run: |
          set -euo pipefail
          VERSION="${VERSION#v}" node agent-harness/record-runtime-image-digest.mjs release-digests/kali-minimal.json
      - uses: actions/upload-artifact@v4
        with:
          name: runtime-image-digest-kali-minimal
          path: release-digests/kali-minimal.json
          if-no-files-found: error

  openharmony-test:
    needs: base-image
    runs-on: ubuntu-latest
    env:
      DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
      DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
      ALIYUN_REGISTRY: ${{ secrets.ALIYUN_REGISTRY }}
      ALIYUN_REGISTRY_NAMESPACE: ${{ secrets.ALIYUN_REGISTRY_NAMESPACE }}
      ALIYUN_REGISTRY_USERNAME: ${{ secrets.ALIYUN_REGISTRY_USERNAME }}
      ALIYUN_REGISTRY_PASSWORD: ${{ secrets.ALIYUN_REGISTRY_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.base-image.outputs.checkout_ref }}
      - id: release
        name: 解析 registry 命名空间
