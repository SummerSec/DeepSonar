            org.opencontainers.image.licenses=LicenseRef-DeepSonar-Proprietary
            org.opencontainers.image.documentation=https://github.com/SummerSec/DeepSonar/blob/main/docs/RELEASE_RUNTIME_IMAGES.md
          annotations: |
            org.opencontainers.image.title=DeepSonar OpenHarmony Audit
            org.opencontainers.image.description=OpenHarmony 高危静态审计环境：Clang/clang-tidy/cppcheck/sparse 与 ASan/UBSan 工具链；不含全量源码或固件。
            org.opencontainers.image.licenses=LicenseRef-DeepSonar-Proprietary
            org.opencontainers.image.documentation=https://github.com/SummerSec/DeepSonar/blob/main/docs/RELEASE_RUNTIME_IMAGES.md
          tags: |
            type=semver,pattern={{version}}
            type=sha,prefix=
        env:
          DOCKER_METADATA_ANNOTATIONS_LEVELS: manifest,index
      - id: acr-meta
        if: ${{ steps.acr-config.outputs.configured == 'true' }}
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.ALIYUN_REGISTRY }}/${{ env.ALIYUN_REGISTRY_NAMESPACE }}/deepsonar-openharmony-audit
          flavor: latest=false
          tags: |
            type=semver,pattern={{version}}
