            type=sha,prefix=openharmony-audit-sha-
      - id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          file: deploy/Dockerfile.agent-openharmony-audit
          outputs: type=image,name=${{ env.REGISTRY }}/${{ steps.release.outputs.owner }}/deepsonar-openharmony-audit,push-by-digest=true,name-canonical=true,push=true
          platforms: linux/amd64,linux/arm64
          build-args: BASE_IMAGE=${{ env.REGISTRY }}/${{ steps.release.outputs.owner }}/deepsonar-base:${{ steps.release.outputs.version }}
          labels: ${{ steps.meta.outputs.labels }}
