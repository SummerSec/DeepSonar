        env:
          IMAGE_KEY: deepsonar-openharmony-test
          DIGEST: ${{ steps.publish.outputs.digest }}
          PLATFORMS: linux/amd64,linux/arm64
          GHCR_REF: ghcr.io/${{ steps.release.outputs.owner }}/deepsonar-openharmony-test
          ACR_CONFIGURED: ${{ steps.acr-config.outputs.configured }}
          ACR_TAGS: ${{ steps.acr-meta.outputs.tags }}
          DOCKERHUB_TAGS: ${{ steps.dockerhub-meta.outputs.tags }}
          DOCKERHUB_CONFIGURED: ${{ steps.dockerhub-meta.outputs.tags != '' }}
