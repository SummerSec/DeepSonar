name: release

# v* tag 发布调度器、前端、准入服务和官方运行时镜像。
on:
  push:
    tags: ["v*"]

permissions:
  contents: write
  packages: write

env:
  REGISTRY: ghcr.io
  DOCKERHUB_IMAGE: docker.io/sumsec/deepsonar

jobs:
  base-image:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.release.outputs.version }}
      owner: ${{ steps.release.outputs.owner }}
    env:
      DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
      DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
      ALIYUN_REGISTRY: ${{ secrets.ALIYUN_REGISTRY }}
      ALIYUN_REGISTRY_NAMESPACE: ${{ secrets.ALIYUN_REGISTRY_NAMESPACE }}
      ALIYUN_REGISTRY_USERNAME: ${{ secrets.ALIYUN_REGISTRY_USERNAME }}
      ALIYUN_REGISTRY_PASSWORD: ${{ secrets.ALIYUN_REGISTRY_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
      - id: release
        name: 解析发布版本
        shell: bash
        run: |
          set -euo pipefail
          version="${GITHUB_REF_NAME#v}"
          owner="${GITHUB_REPOSITORY_OWNER,,}"
          [[ "$version" != "$GITHUB_REF_NAME" && -n "$version" ]]
          [[ -n "$owner" ]]
          printf 'version=%s\n' "$version" >> "$GITHUB_OUTPUT"
          printf 'owner=%s\n' "$owner" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: 检查 ACR 配置
        id: acr-config
        shell: bash
        run: |
          set -euo pipefail
          if [[ -n "$ALIYUN_REGISTRY" && -n "$ALIYUN_REGISTRY_NAMESPACE" && -n "$ALIYUN_REGISTRY_USERNAME" && -n "$ALIYUN_REGISTRY_PASSWORD" ]]; then
            echo 'configured=true' >> "$GITHUB_OUTPUT"
          else
            echo 'configured=false' >> "$GITHUB_OUTPUT"
            echo 'ACR 凭据未完整配置，将只发布 GHCR/Docker Hub。' >> "$GITHUB_STEP_SUMMARY"
          fi
      - name: 登录 Docker Hub
        if: ${{ env.DOCKERHUB_USERNAME != '' && env.DOCKERHUB_TOKEN != '' }}
        uses: docker/login-action@v3
        with:
          registry: docker.io
          username: ${{ env.DOCKERHUB_USERNAME }}
          password: ${{ env.DOCKERHUB_TOKEN }}
      - name: Docker Hub 凭据未配置
        if: ${{ env.DOCKERHUB_USERNAME == '' || env.DOCKERHUB_TOKEN == '' }}
        run: |
          set -euo pipefail
          echo 'Docker Hub 凭据未配置，将跳过 Docker Hub。' >> "$GITHUB_STEP_SUMMARY"
      - name: 登录阿里云 ACR
        if: ${{ steps.acr-config.outputs.configured == 'true' }}
        uses: docker/login-action@v3
        with:
          registry: ${{ env.ALIYUN_REGISTRY }}
          username: ${{ env.ALIYUN_REGISTRY_USERNAME }}
          password: ${{ env.ALIYUN_REGISTRY_PASSWORD }}
      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ steps.release.outputs.owner }}/deepsonar-base
          labels: |
            org.opencontainers.image.title=DeepSonar Base
            org.opencontainers.image.description=Explore、Analyze、Code、Hub、Verify 与系统沙箱使用的 DeepSonar 官方最小运行时。
            org.opencontainers.image.licenses=MIT
            org.opencontainers.image.documentation=https://github.com/SummerSec/DeepSonar/blob/main/docs/RELEASE_RUNTIME_IMAGES.md
          annotations: |
            org.opencontainers.image.title=DeepSonar Base
            org.opencontainers.image.description=Explore、Analyze、Code、Hub、Verify 与系统沙箱使用的 DeepSonar 官方最小运行时。
            org.opencontainers.image.licenses=MIT
            org.opencontainers.image.documentation=https://github.com/SummerSec/DeepSonar/blob/main/docs/RELEASE_RUNTIME_IMAGES.md
          tags: |
            type=semver,pattern={{version}}
            type=sha,prefix=
        env:
          DOCKER_METADATA_ANNOTATIONS_LEVELS: manifest,index
      - id: dockerhub-meta
        if: ${{ env.DOCKERHUB_USERNAME != '' && env.DOCKERHUB_TOKEN != '' }}
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.DOCKERHUB_IMAGE }}
          flavor: latest=false
          tags: |
            type=semver,pattern=base-{{version}}
            type=sha,prefix=base-sha-
      - id: acr-meta
        if: ${{ steps.acr-config.outputs.configured == 'true' }}
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.ALIYUN_REGISTRY }}/${{ env.ALIYUN_REGISTRY_NAMESPACE }}/deepsonar-base
          flavor: latest=false
          tags: |
            type=semver,pattern={{version}}
            type=sha,prefix=sha-
      - id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          file: deploy/Dockerfile.agent
          push: true
          tags: |
            ${{ steps.meta.outputs.tags }}
            ${{ steps.dockerhub-meta.outputs.tags }}
            ${{ steps.acr-meta.outputs.tags }}
          platforms: linux/amd64,linux/arm64
          build-args: TOOLSET=base
          labels: ${{ steps.meta.outputs.labels }}
          annotations: ${{ steps.meta.outputs.annotations }}
          sbom: true
          provenance: mode=max
          cache-from: type=gha,scope=base
          cache-to: type=gha,mode=max,scope=base
      - name: 保存 base manifest digest
        env:
          IMAGE_KEY: deepsonar-base
          DIGEST: ${{ steps.build.outputs.digest }}
          PLATFORMS: linux/amd64,linux/arm64
          GHCR_REF: ghcr.io/${{ steps.release.outputs.owner }}/deepsonar-base
          ACR_REF: ${{ env.ALIYUN_REGISTRY }}/${{ env.ALIYUN_REGISTRY_NAMESPACE }}/deepsonar-base
          ACR_CONFIGURED: ${{ steps.acr-config.outputs.configured }}
          VERSION: ${{ steps.release.outputs.version }}
        run: |
          set -euo pipefail
          node agent-harness/record-runtime-image-digest.mjs release-digests/base.json
      - uses: actions/upload-artifact@v4
        with:
          name: runtime-image-digest-base
          path: release-digests/base.json
          if-no-files-found: error

  images:
    needs: base-image
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - { name: scheduler, dockerfile: deploy/Dockerfile.scheduler, platforms: "linux/amd64", dockerhub_tag: "", title: "DeepSonar Scheduler", description: "DeepSonar 调度器与唯一副作用执行服务。" }
          - { name: web, dockerfile: deploy/Dockerfile.web, platforms: "linux/amd64", dockerhub_tag: "", title: "DeepSonar Web", description: "DeepSonar Loop Graph 工程平台 Web 控制台。" }
          - { name: image-admission, dockerfile: deploy/Dockerfile.image-admission, platforms: "linux/amd64", dockerhub_tag: "", title: "DeepSonar Image Admission", description: "DeepSonar 第三方运行镜像准入与安全扫描 Worker。" }
          - { name: audit, dockerfile: deploy/Dockerfile.agent, platforms: "linux/amd64,linux/arm64", dockerhub_tag: "audit", title: "DeepSonar Audit", description: "DeepSonar Audit 的官方审计运行时。" }
          # kali-minimal 体量大，amd64+arm64 同作业并行导出易 ENOSPC；独立 job 顺序构建
    env:
      DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
      DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
      ALIYUN_REGISTRY: ${{ secrets.ALIYUN_REGISTRY }}
      ALIYUN_REGISTRY_NAMESPACE: ${{ secrets.ALIYUN_REGISTRY_NAMESPACE }}
      ALIYUN_REGISTRY_USERNAME: ${{ secrets.ALIYUN_REGISTRY_USERNAME }}
      ALIYUN_REGISTRY_PASSWORD: ${{ secrets.ALIYUN_REGISTRY_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - name: 预检锁文件
        run: |
          set -euo pipefail
          pnpm install --frozen-lockfile
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: 检查 ACR 配置
        id: acr-config
        shell: bash
        run: |
          set -euo pipefail
          if [[ -n "$ALIYUN_REGISTRY" && -n "$ALIYUN_REGISTRY_NAMESPACE" && -n "$ALIYUN_REGISTRY_USERNAME" && -n "$ALIYUN_REGISTRY_PASSWORD" ]]; then
            echo 'configured=true' >> "$GITHUB_OUTPUT"
          else
            echo 'configured=false' >> "$GITHUB_OUTPUT"
            echo 'ACR 凭据未完整配置，将只发布 GHCR/Docker Hub。' >> "$GITHUB_STEP_SUMMARY"
          fi
      - name: 登录 Docker Hub
        if: ${{ matrix.dockerhub_tag != '' && env.DOCKERHUB_USERNAME != '' && env.DOCKERHUB_TOKEN != '' }}
        uses: docker/login-action@v3
        with:
          registry: docker.io
          username: ${{ env.DOCKERHUB_USERNAME }}
          password: ${{ env.DOCKERHUB_TOKEN }}
      - name: Docker Hub 凭据未配置
        if: ${{ matrix.dockerhub_tag != '' && (env.DOCKERHUB_USERNAME == '' || env.DOCKERHUB_TOKEN == '') }}
        run: |
          set -euo pipefail
          echo 'Docker Hub 凭据未配置，将跳过 Docker Hub。' >> "$GITHUB_STEP_SUMMARY"
      - name: 登录阿里云 ACR
        if: ${{ steps.acr-config.outputs.configured == 'true' }}
        uses: docker/login-action@v3
        with:
          registry: ${{ env.ALIYUN_REGISTRY }}
          username: ${{ env.ALIYUN_REGISTRY_USERNAME }}
          password: ${{ env.ALIYUN_REGISTRY_PASSWORD }}
      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ needs.base-image.outputs.owner }}/deepsonar-${{ matrix.name }}
          labels: |
            org.opencontainers.image.title=${{ matrix.title }}
            org.opencontainers.image.description=${{ matrix.description }}
            org.opencontainers.image.licenses=MIT
            org.opencontainers.image.documentation=https://github.com/SummerSec/DeepSonar
          annotations: |
            org.opencontainers.image.title=${{ matrix.title }}
            org.opencontainers.image.description=${{ matrix.description }}
            org.opencontainers.image.licenses=MIT
            org.opencontainers.image.documentation=https://github.com/SummerSec/DeepSonar
          tags: |
            type=semver,pattern={{version}}
            type=sha,prefix=
        env:
          DOCKER_METADATA_ANNOTATIONS_LEVELS: ${{ matrix.name == 'audit' && 'manifest,index' || 'manifest' }}
      - id: dockerhub-meta
        if: ${{ matrix.dockerhub_tag != '' && env.DOCKERHUB_USERNAME != '' && env.DOCKERHUB_TOKEN != '' }}
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.DOCKERHUB_IMAGE }}
          flavor: latest=false
          tags: |
            type=semver,pattern=${{ matrix.dockerhub_tag }}-{{version}}
            type=sha,prefix=${{ matrix.dockerhub_tag }}-sha-
      - id: acr-meta
        if: ${{ steps.acr-config.outputs.configured == 'true' }}
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.ALIYUN_REGISTRY }}/${{ env.ALIYUN_REGISTRY_NAMESPACE }}/deepsonar-${{ matrix.name }}
          flavor: latest=false
          tags: |
            type=semver,pattern={{version}}
            type=sha,prefix=sha-
      - id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          push: true
          tags: |
            ${{ steps.meta.outputs.tags }}
            ${{ steps.dockerhub-meta.outputs.tags }}
            ${{ steps.acr-meta.outputs.tags }}
          platforms: ${{ matrix.platforms }}
          build-args: ${{ matrix.name == 'audit' && 'TOOLSET=audit' || '' }}
          labels: ${{ steps.meta.outputs.labels }}
          annotations: ${{ steps.meta.outputs.annotations }}
          sbom: true
          provenance: mode=max
          cache-from: type=gha,scope=${{ matrix.name }}
          cache-to: type=gha,mode=max,scope=${{ matrix.name }}
      - name: 保存运行时 manifest digest
        if: ${{ matrix.dockerhub_tag != '' }}
        env:
          IMAGE_KEY: deepsonar-${{ matrix.name }}
          DIGEST: ${{ steps.build.outputs.digest }}
          PLATFORMS: ${{ matrix.platforms }}
          GHCR_REF: ghcr.io/${{ needs.base-image.outputs.owner }}/deepsonar-${{ matrix.name }}
          ACR_REF: ${{ env.ALIYUN_REGISTRY }}/${{ env.ALIYUN_REGISTRY_NAMESPACE }}/deepsonar-${{ matrix.name }}
          ACR_CONFIGURED: ${{ steps.acr-config.outputs.configured }}
          VERSION: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          VERSION="${VERSION#v}" node agent-harness/record-runtime-image-digest.mjs "release-digests/${{ matrix.name }}.json"
      - uses: actions/upload-artifact@v4
        if: ${{ matrix.dockerhub_tag != '' }}
        with:
          name: runtime-image-digest-${{ matrix.name }}
          path: release-digests/${{ matrix.name }}.json
          if-no-files-found: error

  # Kali 工具链镜像很大：同作业并行构建 amd64+arm64 并 COPY 根文件系统时极易 ENOSPC。
  # 按平台顺序 push-by-digest，再 imagetools 合成多架构标签。
  kali-minimal:
    needs: base-image
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
      DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
      ALIYUN_REGISTRY: ${{ secrets.ALIYUN_REGISTRY }}
      ALIYUN_REGISTRY_NAMESPACE: ${{ secrets.ALIYUN_REGISTRY_NAMESPACE }}
      ALIYUN_REGISTRY_USERNAME: ${{ secrets.ALIYUN_REGISTRY_USERNAME }}
      ALIYUN_REGISTRY_PASSWORD: ${{ secrets.ALIYUN_REGISTRY_PASSWORD }}
      IMAGE_NAME: ghcr.io/${{ needs.base-image.outputs.owner }}/deepsonar-kali-minimal
    steps:
      - uses: actions/checkout@v4
      - name: Free disk for Kali multi-arch
        run: |
          set -euo pipefail
          sudo rm -rf \
            /usr/local/lib/android \
            /usr/share/dotnet \
            /opt/ghc \
            /usr/local/share/boost \
            /usr/share/swift \
            /usr/local/.ghcup \
            /opt/hostedtoolcache/CodeQL \
            /opt/hostedtoolcache/go \
            /opt/hostedtoolcache/Java_Temurin-Hotspot_jdk \
            "$AGENT_TOOLSDIRECTORY" 2>/dev/null || true
          sudo docker system prune -af || true
          df -h /
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: 检查 ACR 配置
        id: acr-config
        shell: bash
        run: |
          set -euo pipefail
          if [[ -n "$ALIYUN_REGISTRY" && -n "$ALIYUN_REGISTRY_NAMESPACE" && -n "$ALIYUN_REGISTRY_USERNAME" && -n "$ALIYUN_REGISTRY_PASSWORD" ]]; then
            echo 'configured=true' >> "$GITHUB_OUTPUT"
          else
            echo 'configured=false' >> "$GITHUB_OUTPUT"
            echo 'ACR 凭据未完整配置，将只发布 GHCR/Docker Hub。' >> "$GITHUB_STEP_SUMMARY"
          fi
      - name: 登录 Docker Hub
        if: ${{ env.DOCKERHUB_USERNAME != '' && env.DOCKERHUB_TOKEN != '' }}
        uses: docker/login-action@v3
        with:
          registry: docker.io
          username: ${{ env.DOCKERHUB_USERNAME }}
          password: ${{ env.DOCKERHUB_TOKEN }}
      - name: 登录阿里云 ACR
        if: ${{ steps.acr-config.outputs.configured == 'true' }}
        uses: docker/login-action@v3
        with:
          registry: ${{ env.ALIYUN_REGISTRY }}
          username: ${{ env.ALIYUN_REGISTRY_USERNAME }}
          password: ${{ env.ALIYUN_REGISTRY_PASSWORD }}
      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE_NAME }}
          labels: |
            org.opencontainers.image.title=DeepSonar Kali Test
            org.opencontainers.image.description=DeepSonar Test 默认使用的精简 Kali 多语言工具链；不安装 Kali metapackage 或 GUI。
            org.opencontainers.image.licenses=MIT
            org.opencontainers.image.documentation=https://github.com/SummerSec/DeepSonar/blob/main/docs/RELEASE_RUNTIME_IMAGES.md
          annotations: |
            org.opencontainers.image.title=DeepSonar Kali Test
            org.opencontainers.image.description=DeepSonar Test 默认使用的精简 Kali 多语言工具链；不安装 Kali metapackage 或 GUI。
            org.opencontainers.image.licenses=MIT
            org.opencontainers.image.documentation=https://github.com/SummerSec/DeepSonar/blob/main/docs/RELEASE_RUNTIME_IMAGES.md
          tags: |
            type=semver,pattern={{version}}
            type=sha,prefix=
        env:
          DOCKER_METADATA_ANNOTATIONS_LEVELS: manifest
      - id: dockerhub-meta
        if: ${{ env.DOCKERHUB_USERNAME != '' && env.DOCKERHUB_TOKEN != '' }}
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.DOCKERHUB_IMAGE }}
          flavor: latest=false
          tags: |
            type=semver,pattern=kali-minimal-{{version}}
            type=sha,prefix=kali-minimal-sha-
      - id: acr-meta
        if: ${{ steps.acr-config.outputs.configured == 'true' }}
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.ALIYUN_REGISTRY }}/${{ env.ALIYUN_REGISTRY_NAMESPACE }}/deepsonar-kali-minimal
          flavor: latest=false
          tags: |
            type=semver,pattern={{version}}
            type=sha,prefix=sha-
      - id: build-amd64
        name: Build linux/amd64 (push by digest)
        uses: docker/build-push-action@v6
        with:
          context: .
          file: deploy/Dockerfile.agent-kali-minimal
          platforms: linux/amd64
          outputs: type=image,name=${{ env.IMAGE_NAME }},push-by-digest=true,name-canonical=true,push=true
          labels: ${{ steps.meta.outputs.labels }}
          annotations: ${{ steps.meta.outputs.annotations }}
          provenance: false
          sbom: false
          cache-from: type=gha,scope=kali-minimal-amd64
          cache-to: type=gha,mode=max,scope=kali-minimal-amd64
      - name: Reclaim disk before arm64
        run: |
          set -euo pipefail
          docker builder prune -af || true
          docker system prune -af || true
          sudo rm -rf /tmp/* || true
          df -h /
      - id: build-arm64
        name: Build linux/arm64 (push by digest)
        uses: docker/build-push-action@v6
        with:
          context: .
          file: deploy/Dockerfile.agent-kali-minimal
          platforms: linux/arm64
          outputs: type=image,name=${{ env.IMAGE_NAME }},push-by-digest=true,name-canonical=true,push=true
          labels: ${{ steps.meta.outputs.labels }}
          annotations: ${{ steps.meta.outputs.annotations }}
          provenance: false
          sbom: false
          cache-from: type=gha,scope=kali-minimal-arm64
          cache-to: type=gha,mode=max,scope=kali-minimal-arm64
      - name: Create multi-arch tags
        id: merge
        env:
          AMD64_DIGEST: ${{ steps.build-amd64.outputs.digest }}
          ARM64_DIGEST: ${{ steps.build-arm64.outputs.digest }}
          GHCR_TAGS: ${{ steps.meta.outputs.tags }}
          DOCKERHUB_TAGS: ${{ steps.dockerhub-meta.outputs.tags }}
          ACR_TAGS: ${{ steps.acr-meta.outputs.tags }}
        run: |
          set -euo pipefail
          source_refs=(
            "${IMAGE_NAME}@${AMD64_DIGEST}"
            "${IMAGE_NAME}@${ARM64_DIGEST}"
          )
          tag_args=()
          while IFS= read -r tag; do
            [[ -n "$tag" ]] || continue
            tag_args+=(-t "$tag")
          done <<< "$(printf '%s\n%s\n%s\n' "$GHCR_TAGS" "${DOCKERHUB_TAGS:-}" "${ACR_TAGS:-}")"
          [[ ${#tag_args[@]} -gt 0 ]]
          docker buildx imagetools create \
            --annotation "index:org.opencontainers.image.title=DeepSonar Kali Test" \
            --annotation "index:org.opencontainers.image.description=DeepSonar Test 默认使用的精简 Kali 多语言工具链；不安装 Kali metapackage 或 GUI。" \
            --annotation "index:org.opencontainers.image.source=https://github.com/SummerSec/DeepSonar" \
            --annotation "index:org.opencontainers.image.documentation=https://github.com/SummerSec/DeepSonar/blob/main/docs/RELEASE_RUNTIME_IMAGES.md" \
            --annotation "index:org.opencontainers.image.licenses=MIT" \
            "${tag_args[@]}" "${source_refs[@]}"
          # 取 GHCR 首个标签的 multi-arch index digest
          primary="$(printf '%s\n' "$GHCR_TAGS" | sed '/^$/d' | head -n1)"
          digest="$(docker buildx imagetools inspect --raw "$primary" | node -e '
            let s=""; process.stdin.on("data", d => s += d);
            process.stdin.on("end", () => {
              const crypto = require("node:crypto");
              const digest = "sha256:" + crypto.createHash("sha256").update(s).digest("hex");
              if (!/^sha256:[0-9a-f]{64}$/.test(digest)) process.exit(2);
              process.stdout.write(digest);
            });
          ')"
          printf 'digest=%s\n' "$digest" >> "$GITHUB_OUTPUT"
          {
            printf 'primary=%s\n' "$primary"
            printf 'digest=%s\n' "$digest"
          } >> "$GITHUB_STEP_SUMMARY"
      - name: 保存运行时 manifest digest
        env:
          IMAGE_KEY: deepsonar-kali-minimal
          DIGEST: ${{ steps.merge.outputs.digest }}
          PLATFORMS: linux/amd64,linux/arm64
          GHCR_REF: ghcr.io/${{ needs.base-image.outputs.owner }}/deepsonar-kali-minimal
          ACR_REF: ${{ env.ALIYUN_REGISTRY }}/${{ env.ALIYUN_REGISTRY_NAMESPACE }}/deepsonar-kali-minimal
          ACR_CONFIGURED: ${{ steps.acr-config.outputs.configured }}
          VERSION: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          VERSION="${VERSION#v}" node agent-harness/record-runtime-image-digest.mjs release-digests/kali-minimal.json
      - uses: actions/upload-artifact@v4
        with:
          name: runtime-image-digest-kali-minimal
          path: release-digests/kali-minimal.json
          if-no-files-found: error

  openharmony-test:
    needs: base-image
    runs-on: ubuntu-latest
    env:
      DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
      DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
      ALIYUN_REGISTRY: ${{ secrets.ALIYUN_REGISTRY }}
      ALIYUN_REGISTRY_NAMESPACE: ${{ secrets.ALIYUN_REGISTRY_NAMESPACE }}
      ALIYUN_REGISTRY_USERNAME: ${{ secrets.ALIYUN_REGISTRY_USERNAME }}
      ALIYUN_REGISTRY_PASSWORD: ${{ secrets.ALIYUN_REGISTRY_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: 检查 ACR 配置
        id: acr-config
        shell: bash
        run: |
          set -euo pipefail
          if [[ -n "$ALIYUN_REGISTRY" && -n "$ALIYUN_REGISTRY_NAMESPACE" && -n "$ALIYUN_REGISTRY_USERNAME" && -n "$ALIYUN_REGISTRY_PASSWORD" ]]; then
            echo 'configured=true' >> "$GITHUB_OUTPUT"
          else
            echo 'configured=false' >> "$GITHUB_OUTPUT"
            echo 'ACR 凭据未完整配置，将只发布 GHCR。' >> "$GITHUB_STEP_SUMMARY"
          fi
      - name: 登录 Docker Hub
        if: ${{ env.DOCKERHUB_USERNAME != '' && env.DOCKERHUB_TOKEN != '' }}
        uses: docker/login-action@v3
        with:
          registry: docker.io
          username: ${{ env.DOCKERHUB_USERNAME }}
          password: ${{ env.DOCKERHUB_TOKEN }}
      - name: Docker Hub 凭据未配置
        if: ${{ env.DOCKERHUB_USERNAME == '' || env.DOCKERHUB_TOKEN == '' }}
        run: |
          set -euo pipefail
          echo 'Docker Hub 凭据未配置，将跳过 Docker Hub。' >> "$GITHUB_STEP_SUMMARY"
      - name: 登录阿里云 ACR
        if: ${{ steps.acr-config.outputs.configured == 'true' }}
        uses: docker/login-action@v3
        with:
          registry: ${{ env.ALIYUN_REGISTRY }}
          username: ${{ env.ALIYUN_REGISTRY_USERNAME }}
          password: ${{ env.ALIYUN_REGISTRY_PASSWORD }}
      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ needs.base-image.outputs.owner }}/deepsonar-openharmony-test
          labels: |
            org.opencontainers.image.title=DeepSonar OpenHarmony Test
            org.opencontainers.image.description=OpenHarmony 官方源码同步与构建验证环境；不包含全量源码或特定开发板固件。
            org.opencontainers.image.licenses=MIT
            org.opencontainers.image.documentation=https://github.com/SummerSec/DeepSonar/blob/main/docs/RELEASE_RUNTIME_IMAGES.md
          annotations: |
            org.opencontainers.image.title=DeepSonar OpenHarmony Test
            org.opencontainers.image.description=OpenHarmony 官方源码同步与构建验证环境；不包含全量源码或特定开发板固件。
            org.opencontainers.image.licenses=MIT
            org.opencontainers.image.documentation=https://github.com/SummerSec/DeepSonar/blob/main/docs/RELEASE_RUNTIME_IMAGES.md
          tags: |
            type=semver,pattern={{version}}
            type=sha,prefix=
        env:
          DOCKER_METADATA_ANNOTATIONS_LEVELS: manifest,index
      - id: acr-meta
        if: ${{ steps.acr-config.outputs.configured == 'true' }}
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.ALIYUN_REGISTRY }}/${{ env.ALIYUN_REGISTRY_NAMESPACE }}/deepsonar-openharmony-test
          flavor: latest=false
          tags: |
            type=semver,pattern={{version}}
            type=sha,prefix=sha-
      - id: dockerhub-meta
        if: ${{ env.DOCKERHUB_USERNAME != '' && env.DOCKERHUB_TOKEN != '' }}
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.DOCKERHUB_IMAGE }}
          flavor: latest=false
          tags: |
            type=semver,pattern=openharmony-test-{{version}}
            type=sha,prefix=openharmony-test-sha-
      - id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          file: deploy/Dockerfile.agent-openharmony
          push: true
          tags: |
            ${{ steps.meta.outputs.tags }}
            ${{ steps.acr-meta.outputs.tags }}
            ${{ steps.dockerhub-meta.outputs.tags }}
          platforms: linux/amd64,linux/arm64
          build-args: BASE_IMAGE=${{ env.REGISTRY }}/${{ needs.base-image.outputs.owner }}/deepsonar-base:${{ needs.base-image.outputs.version }}
          labels: ${{ steps.meta.outputs.labels }}
          annotations: ${{ steps.meta.outputs.annotations }}
          sbom: true
          provenance: mode=max
          cache-from: type=gha,scope=openharmony-test
          cache-to: type=gha,mode=max,scope=openharmony-test
      - name: 保存 OpenHarmony manifest digest
        env:
          IMAGE_KEY: deepsonar-openharmony-test
          DIGEST: ${{ steps.build.outputs.digest }}
          PLATFORMS: linux/amd64,linux/arm64
          GHCR_REF: ghcr.io/${{ needs.base-image.outputs.owner }}/deepsonar-openharmony-test
          ACR_REF: ${{ env.ALIYUN_REGISTRY }}/${{ env.ALIYUN_REGISTRY_NAMESPACE }}/deepsonar-openharmony-test
          ACR_CONFIGURED: ${{ steps.acr-config.outputs.configured }}
          VERSION: ${{ needs.base-image.outputs.version }}
        run: |
          set -euo pipefail
          node agent-harness/record-runtime-image-digest.mjs release-digests/openharmony-test.json
      - uses: actions/upload-artifact@v4
        with:
          name: runtime-image-digest-openharmony-test
          path: release-digests/openharmony-test.json
          if-no-files-found: error

  release:
    needs: [base-image, images, kali-minimal, openharmony-test]
    runs-on: ubuntu-latest
    env:
      ALIYUN_REGISTRY: ${{ secrets.ALIYUN_REGISTRY }}
      ALIYUN_REGISTRY_NAMESPACE: ${{ secrets.ALIYUN_REGISTRY_NAMESPACE }}
      ALIYUN_REGISTRY_USERNAME: ${{ secrets.ALIYUN_REGISTRY_USERNAME }}
      ALIYUN_REGISTRY_PASSWORD: ${{ secrets.ALIYUN_REGISTRY_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: runtime-image-digest-*
          path: release-digests
          merge-multiple: true
      - name: 生成 runtime 镜像清单
        env:
          VERSION: ${{ needs.base-image.outputs.version }}
          OWNER: ${{ needs.base-image.outputs.owner }}
        run: |
          set -euo pipefail
          node agent-harness/generate-runtime-image-registry.mjs release-digests deploy/runtime-image-registry.json
      - name: 校验发布清单
        run: |
          set -euo pipefail
          node agent-harness/generate-runtime-image-registry.mjs --check deploy/runtime-image-registry.json
      - uses: actions/upload-artifact@v4
        with:
          name: runtime-image-registry
          path: deploy/runtime-image-registry.json
          if-no-files-found: error
      - name: 打包 Management Skill
        shell: bash
        run: |
          set -euo pipefail
          VERSION="${GITHUB_REF_NAME#v}"
          tar -czf "deepsonar-management-skill-${VERSION}.tar.gz" -C skills deepsonar-management
      - name: 发布 Release 与附件
        uses: softprops/action-gh-release@v2
        with:
          files: |
            deepsonar-management-skill-*.tar.gz
            deploy/runtime-image-registry.json
          generate_release_notes: true
