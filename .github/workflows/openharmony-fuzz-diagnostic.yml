name: OpenHarmony Fuzz pinned release diagnosis

on:
  push:
    branches: [agent/v063-oh-fuzz-diagnostic]
    paths: [.github/workflows/openharmony-fuzz-diagnostic.yml]

permissions:
  contents: read
  packages: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        compiler: [clang-14, clang-19]
    env:
      DIAGNOSTIC_COMPILER: ${{ matrix.compiler }}
      RELEASE_SOURCE: fdb55a01b1e02b5b9078586923a8d506ce5bb096
      RELEASE_BASE: ghcr.io/summersec/deepsonar-base@sha256:29f7d8b63d4a323295ba204d83e682a43698d648b965899287b818547a7b5220
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fdb55a01b1e02b5b9078586923a8d506ce5bb096
          persist-credentials: false
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Record fixed source and read-only host facts
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/oh-diagnostic"
          test "$(git rev-parse HEAD)" = "$RELEASE_SOURCE"
          {
            printf 'source=%s\nbase=%s\n' "$RELEASE_SOURCE" "$RELEASE_BASE"
            git status --porcelain
            uname -a
            if ! sudo sysctl vm.mmap_rnd_bits vm.mmap_rnd_compat_bits; then
              printf 'ASLR host facts unavailable; sanitizer result remains authoritative.\n'
            fi
            docker version
          } > "$RUNNER_TEMP/oh-diagnostic/host.txt" 2>&1
      - name: Prepare diagnostic-only pre-smoke image definition
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import os
          from pathlib import Path
          source = Path('deploy/Dockerfile.agent-openharmony-fuzz').read_text()
          boundary = 'RUN /opt/deepsonar/bin/openharmony-env.sh --check'
          prefix, rest = source.split(boundary, 1)
          manifest = next(line for line in rest.splitlines() if line.startswith("  && node -e "))
          assert manifest.endswith(' \\')
          # Deliberately stop before the crashing command to retain a debug image.
          # This derivative is never published and is not a release smoke pass.
          definition = prefix + boundary.rstrip('\n') + ' \\\n' + manifest[:-2] + '\n'
          if os.environ['DIAGNOSTIC_COMPILER'] == 'clang-19':
              definition += '''RUN apt-get update && apt-get install -y --no-install-recommends clang-19=1:19.1.7-3~deb12u1 libclang-rt-19-dev=1:19.1.7-3~deb12u1
          '''
          target = Path(os.environ['RUNNER_TEMP']) / 'oh-diagnostic' / 'Dockerfile'
          target.write_text(definition)
          PY
          docker buildx build --progress=plain --platform linux/amd64 \
            --build-arg "BASE_IMAGE=$RELEASE_BASE" \
            --file "$RUNNER_TEMP/oh-diagnostic/Dockerfile" \
            --load --tag deepsonar-oh-fuzz-diagnostic:local . \
            2>&1 | tee "$RUNNER_TEMP/oh-diagnostic/build.log"
      - name: Run fixed twenty-launch sample and retain crash diagnostics
        shell: bash
        run: |
          set -euo pipefail
          cat > "$RUNNER_TEMP/oh-diagnostic/probe.sh" <<'SH'
          #!/usr/bin/env bash
          set -uo pipefail
          exec > >(tee /evidence/probe.log) 2>&1
          uname -a
          printf 'mmap_rnd_bits='; cat /proc/sys/vm/mmap_rnd_bits
          "$DIAGNOSTIC_COMPILER" --version
          "$DIAGNOSTIC_COMPILER" -print-resource-dir
          dpkg-query -W clang-14 libclang-rt-14-dev libasan8 libubsan1 libc6 libc6-dev
          if [[ "$DIAGNOSTIC_COMPILER" == clang-19 ]]; then dpkg-query -W clang-19 libclang-rt-19-dev; fi
          sha256sum /opt/deepsonar/bin/openharmony-fuzz-env.sh
          printf 'int LLVMFuzzerTestOneInput(const unsigned char *d, unsigned long n){(void)d;(void)n;return 0;}\n' \
            | "$DIAGNOSTIC_COMPILER" -x c - -O1 -g -fno-omit-frame-pointer -fsanitize=fuzzer,address,undefined \
              -o /tmp/deepsonar-libfuzzer-smoke || exit 1
          readelf -h /tmp/deepsonar-libfuzzer-smoke
          ldd /tmp/deepsonar-libfuzzer-smoke
          failures=0
          : > /evidence/launch-status.tsv
          for index in $(seq 1 20); do
            ASAN_OPTIONS=detect_leaks=0 UBSAN_OPTIONS=halt_on_error=1 \
              /tmp/deepsonar-libfuzzer-smoke -runs=1 > "/evidence/launch-${index}.log" 2>&1
            status=$?
            printf '%s\t%s\n' "$index" "$status" | tee -a /evidence/launch-status.tsv
            if [[ "$status" -ne 0 ]]; then failures=$((failures + 1)); fi
          done
          printf 'fixed_sample_size=20 failures=%s\n' "$failures"
          if [[ "$failures" -ne 0 ]]; then
            ASAN_OPTIONS=detect_leaks=0:verbosity=2 UBSAN_OPTIONS=halt_on_error=1 \
              /tmp/deepsonar-libfuzzer-smoke -runs=1 > /evidence/verbose.log 2>&1
            printf 'verbose_exit=%s\n' "$?"
            # Keep ASLR enabled: never mask the observed failure with setarch/sysctl.
            ASAN_OPTIONS=detect_leaks=0 UBSAN_OPTIONS=halt_on_error=1 \
              gdb --batch -ex 'set disable-randomization off' -ex run \
                -ex 'thread apply all bt' -ex 'info proc mappings' \
                --args /tmp/deepsonar-libfuzzer-smoke -runs=1 > /evidence/gdb.log 2>&1
            printf 'gdb_exit=%s\n' "$?"
            exit 1
          fi
          printf 'Not reproduced in this diagnostic sample; not a release acceptance.\n'
          SH
          docker run --rm --network none --memory 4g --pids-limit 256 \
            --env DIAGNOSTIC_COMPILER \
            --mount "type=bind,src=$RUNNER_TEMP/oh-diagnostic,dst=/evidence" \
            deepsonar-oh-fuzz-diagnostic:local bash /evidence/probe.sh
      - name: Preserve diagnosis even when the original command fails
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: openharmony-fuzz-pinned-diagnostic-${{ matrix.compiler }}
          path: ${{ runner.temp }}/oh-diagnostic
          if-no-files-found: error
          retention-days: 14
