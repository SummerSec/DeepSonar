# Recovery executes reviewed control code, never rebuilds or signs images.
name: Release resume
on:
  workflow_dispatch:
    inputs:
      version:
        description: "Release version (X.Y.Z)"
        required: true
      source_run_id:
        description: "Original release.yml run (attempt 1, retained payload and signatures)"
        required: true
      stages:
        description: "Which stage(s) to resume"
        required: true
        default: both
        type: choice
        options: [both, writeback, publish]
permissions:
  contents: write
  actions: read
  checks: read
  pull-requests: write
# Serialize with the original publisher, including different versions' writebacks.
concurrency:
  group: release-runtime-images-${{ github.repository }}
  cancel-in-progress: false
jobs:
  resume:
    strategy:
      fail-fast: false
      matrix:
        stage: ${{ fromJSON(inputs.stages == 'both' && '["writeback","publish"]' || format('["{0}"]', inputs.stages)) }}
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      VERSION: ${{ inputs.version }}
      SOURCE_RUN_ID: ${{ inputs.source_run_id }}
      STAGES: ${{ inputs.stages }}
      DEFAULT_BRANCH: main
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - name: Reject dispatch outside the default branch before checkout
        run: |
          set -euo pipefail
          [[ "$GITHUB_REPOSITORY" == 'SummerSec/DeepSonar' ]]
          [[ "$GITHUB_REF" == 'refs/heads/main' ]]
          [[ "$GITHUB_WORKFLOW_REF" == 'SummerSec/DeepSonar/.github/workflows/release-resume.yml@refs/heads/main' ]]
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          fetch-tags: true
          ref: ${{ github.sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Verify source run, immutable tag, artifact archives and signature receipt
        run: node agent-harness/release-resume.mjs
      - name: 回写 bundled 清单（P3）
        if: matrix.stage == 'writeback'
        run: |
          node agent-harness/platform-signature-publication.mjs gate frozen-release signature-evidence
          bash agent-harness/release-writeback.sh frozen-release
      - name: 创建 Release（P4）
        if: matrix.stage == 'publish'
        run: bash agent-harness/release-publish.sh frozen-release signature-evidence
