name: reverse-runtime

on:
  # #836: Draft/Ready is the developer switch. GitHub's default pull_request
  # activity types are only opened/synchronize/reopened, so a same-SHA Draft ->
  # Ready transition would otherwise never re-plan or run this matrix.
  pull_request:
    paths:
      - "agent-harness/base-cli-lifecycle.json"
      - "agent-harness/base-cli-install.mjs"
      - "agent-harness/base-cli-install.test.mjs"
      - "deploy/Dockerfile.agent*"
      - "deploy/reverse-*.sh"
      - "agent-harness/reverse-*"
      # #992: the plan cannot enforce required suites unless the workflow starts.
      - "agent-harness/ci-run-plan.mjs"
      - "agent-harness/ci-run-cost.mjs"
      - "agent-harness/classify-ci-changes.mjs"
      - "agent-harness/path-match.mjs"
      - "agent-harness/claude-request-budget-cli.test.ts"
      - "agent-harness/tsconfig.claude-budget.json"
      - "agent-harness/run-claude-budget-isolated.mjs"
      - "agent-harness/rea-runtime/**"
      - "agent-harness/opensandbox/*rea*"
      - "agent-harness/opensandbox/*om-provider-headers*"
      - "agent-harness/pi-observational-memory-governed.ts"
      - "apps/scheduler/src/gateway*.ts"
      - "apps/scheduler/src/provider-custom-headers.ts"
      - "apps/scheduler/src/provider-settings.ts"
      - "apps/scheduler/src/pi-extensions.ts"
      - "deploy/docker-compose.opensandbox.yml"
      - "deploy/opensandbox/**"
      - "agent-harness/test-reverse-*"
      - "agent-harness/fixtures/reverse-sample/**"
      - "agent-harness/runtime-images.json"
      - "agent-harness/dsh-runtime/**"
      - "agent-harness/base-cli-runtime/**"
      - "agent-harness/pi-extensions-base-runtime/**"
      - "agent-harness/base-apt-runtime.json"
      - "agent-harness/base-apt-inputs.mjs"
      - "agent-harness/base-apt-inputs.test.mjs"
      - "agent-harness/dsh-request-budget-install.mjs"
      - "pnpm-workspace.yaml"
      - "tsconfig.base.json"
      - "agent-harness/write-tool-manifest.mjs"
      - "agent-harness/runtime-manuals/**"
      - "agent-harness/materialize-runtime-manuals.mjs"
      - "agent-harness/test-runtime-manuals-runtime.mjs"
      - "agent-harness/image-build-fingerprint.mjs"
      - "apps/scheduler/src/domains/cli-capability/**"
      - "apps/scheduler/src/dispatcher*.ts"
      - "apps/scheduler/src/executor-real*.ts"
      - "apps/scheduler/src/domains/platform-api/**"
      - "apps/scheduler/src/domains/event-ingestion/**"
      - "apps/scheduler/src/domains/shared-assets/**"
      - "apps/scheduler/src/domains/role-runtime-snapshot/**"
      - "skills/deepsonar-rea-cli/**"
      - "packages/runtime-sandbox/**"
      - "package.json"
      - "pnpm-lock.yaml"
      - ".dockerignore"
      - ".github/ci/prepare-hosted-runner-disk.mjs"
      - ".github/ci/prepare-hosted-runner-disk.test.mjs"
      - ".github/workflows/reverse-runtime.yml"
      - ".github/workflows/release.yml"
    types: [opened, reopened, synchronize, ready_for_review, converted_to_draft]
  push:
    branches: [main]
    paths:
      - "agent-harness/base-cli-lifecycle.json"
      - "agent-harness/base-cli-install.mjs"
      - "agent-harness/base-cli-install.test.mjs"
      - "deploy/Dockerfile.agent*"
      - "deploy/reverse-*.sh"
      - "agent-harness/reverse-*"
      # #992: the plan cannot enforce required suites unless the workflow starts.
      - "agent-harness/ci-run-plan.mjs"
      - "agent-harness/ci-run-cost.mjs"
      - "agent-harness/classify-ci-changes.mjs"
      - "agent-harness/path-match.mjs"
      - "agent-harness/claude-request-budget-cli.test.ts"
      - "agent-harness/tsconfig.claude-budget.json"
      - "agent-harness/run-claude-budget-isolated.mjs"
      - "agent-harness/rea-runtime/**"
      - "agent-harness/opensandbox/*rea*"
      - "agent-harness/opensandbox/*om-provider-headers*"
      - "agent-harness/pi-observational-memory-governed.ts"
      - "apps/scheduler/src/gateway*.ts"
      - "apps/scheduler/src/provider-custom-headers.ts"
      - "apps/scheduler/src/provider-settings.ts"
      - "apps/scheduler/src/pi-extensions.ts"
      - "deploy/docker-compose.opensandbox.yml"
      - "deploy/opensandbox/**"
      - "agent-harness/test-reverse-*"
      - "agent-harness/fixtures/reverse-sample/**"
      - "agent-harness/runtime-images.json"
      - "agent-harness/dsh-runtime/**"
      - "agent-harness/base-cli-runtime/**"
      - "agent-harness/pi-extensions-base-runtime/**"
      - "agent-harness/base-apt-runtime.json"
      - "agent-harness/base-apt-inputs.mjs"
      - "agent-harness/base-apt-inputs.test.mjs"
      - "agent-harness/dsh-request-budget-install.mjs"
      - "pnpm-workspace.yaml"
      - "tsconfig.base.json"
      - "agent-harness/write-tool-manifest.mjs"
      - "agent-harness/runtime-manuals/**"
      - "agent-harness/materialize-runtime-manuals.mjs"
      - "agent-harness/test-runtime-manuals-runtime.mjs"
      - "agent-harness/image-build-fingerprint.mjs"
      - "apps/scheduler/src/domains/cli-capability/**"
      - "apps/scheduler/src/dispatcher*.ts"
      - "apps/scheduler/src/executor-real*.ts"
      - "apps/scheduler/src/domains/platform-api/**"
      - "apps/scheduler/src/domains/event-ingestion/**"
      - "apps/scheduler/src/domains/shared-assets/**"
      - "apps/scheduler/src/domains/role-runtime-snapshot/**"
      - "skills/deepsonar-rea-cli/**"
      - "packages/runtime-sandbox/**"
      - "package.json"
      - "pnpm-lock.yaml"
      - ".dockerignore"
      - ".github/ci/prepare-hosted-runner-disk.mjs"
      - ".github/ci/prepare-hosted-runner-disk.test.mjs"
      - ".github/workflows/reverse-runtime.yml"
      - ".github/workflows/release.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: reverse-runtime-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  # #836: same run plan as ci.yml (one shared script, not five copies). A Draft
  # PR gets its fast checks from ci.yml, so specialists only start their heavy
  # matrices for the ready-for-review candidate, push@main, or a manual run.
  plan:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      mode: ${{ steps.plan.outputs.mode }}
      reasons: ${{ steps.plan.outputs.reasons }}
      plan_status: ${{ steps.plan.outputs.plan_status }}
      # #976: comma-separated Reverse-family suites this run must execute
      # (reverse / claude / pi-om). Empty means the plan proved none apply.
      reverse_suites: ${{ steps.plan.outputs.reverse_suites }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - id: plan
        env:
          EVENT_NAME: ${{ github.event_name }}
          PR_BASE: ${{ github.event.pull_request.base.sha }}
          PR_HEAD: ${{ github.event.pull_request.head.sha }}
          PR_DRAFT: ${{ github.event.pull_request.draft }}
          CI_PR_MODE: ${{ vars.CI_PR_MODE }}
        run: |
          node agent-harness/ci-run-plan.mjs \
            --event-name "$EVENT_NAME" \
            --base "${PR_BASE:-}" \
            --head "${PR_HEAD:-}" \
            --draft "${PR_DRAFT:-false}" \
            --ci-pr-mode "${CI_PR_MODE:-}" \
            --root .

  # #975: build the current checkout's base once per architecture and share it
  # with the three heavy jobs through a run-scoped artifact. Off by default: it
  # only runs when REVERSE_BASE_REUSE=on, so the unchanged default path keeps
  # building the base independently in every job. No registry, no `latest`; the
  # image is identified by immutable SHA/arch/platform/toolset labels that each
  # consumer re-verifies after `docker load`.
  reverse-base:
    needs: plan
    if: always() && !cancelled() && needs.plan.outputs.mode == 'ready-full' && vars.REVERSE_BASE_REUSE == 'on' && needs.plan.outputs.reverse_suites != ''
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            platform: linux/amd64
            runner: ubuntu-24.04
          - arch: arm64
            platform: linux/arm64
            runner: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v4
      - name: Prepare hosted runner disk for shared base
        run: node .github/ci/prepare-hosted-runner-disk.mjs
      - id: identity
        name: Resolve immutable base identity
        run: |
          node agent-harness/reverse-base-identity.mjs \
            --sha "${{ github.sha }}" --arch "${{ matrix.arch }}" --platform "${{ matrix.platform }}"
      - name: Build current native base once per architecture
        env:
          # JSON array from the identity step; parsed into a bash array below so
          # no label value is ever re-split or shell-evaluated.
          LABEL_ARGS_JSON: ${{ steps.identity.outputs.label_args }}
        run: |
          set -euo pipefail
          mapfile -t label_args < <(node -e 'for (const arg of JSON.parse(process.argv[1])) console.log(arg)' "$LABEL_ARGS_JSON")
          if [ "${#label_args[@]}" -eq 0 ]; then
            echo "empty base identity label args; refusing to build an unlabelled base" >&2
            exit 1
          fi
          docker buildx build --builder default --load --platform "${{ matrix.platform }}" \
            --build-arg TOOLSET=base "${label_args[@]}" \
            --tag "deepsonar-base:reverse-ci-${{ matrix.arch }}" --file deploy/Dockerfile.agent .
          docker image inspect --format '{{json .Config.Labels}}' "deepsonar-base:reverse-ci-${{ matrix.arch }}" > "$RUNNER_TEMP/base-labels.json"
          node agent-harness/reverse-base-identity.mjs --verify \
            --labels-json-file "$RUNNER_TEMP/base-labels.json" \
            --sha "${{ github.sha }}" --arch "${{ matrix.arch }}" --platform "${{ matrix.platform }}"
          docker save "deepsonar-base:reverse-ci-${{ matrix.arch }}" | gzip -1 > "$RUNNER_TEMP/${{ steps.identity.outputs.save_file }}"
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.identity.outputs.artifact_name }}
          path: ${{ runner.temp }}/${{ steps.identity.outputs.save_file }}
          if-no-files-found: error
          retention-days: 1

  reverse-runtime-images:
    needs: [plan, reverse-base]
    if: always() && !cancelled() && needs.plan.outputs.mode == 'ready-full' && contains(format(',{0},', needs.plan.outputs.reverse_suites), ',reverse,')
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            platform: linux/amd64
            runner: ubuntu-24.04
          - arch: arm64
            platform: linux/arm64
            runner: ubuntu-24.04-arm
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: deepsonar
          POSTGRES_PASSWORD: deepsonar-ci-pass
          POSTGRES_DB: deepsonar
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U deepsonar -d deepsonar"
          --health-interval 5s --health-timeout 3s --health-retries 20
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      # docker save stages an uncompressed export in Docker data before gzip
      # measures the real archive. Reserve space before dependencies and builds.
      - name: Prepare hosted runner disk for Reverse runtime
        run: node .github/ci/prepare-hosted-runner-disk.mjs
      - name: Install Job integration dependencies
        run: |
          pnpm install --frozen-lockfile
          pnpm --filter @deepsonar/shared-types build
          pnpm --filter @deepsonar/runtime-manual-contract build
          pnpm --filter @deepsonar/runtime-sandbox build
      - name: Install native sample compilers
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends gcc gcc-mingw-w64-x86-64
      - name: Runtime definition gates
        run: node agent-harness/test-reverse-runtime.mjs
      # Use the local Docker builder so the second build consumes precisely the
      # base built from this checkout. PRs do not receive registry credentials,
      # write source caches, publish tags, or use QEMU for native acceptance.
      # #975: when REVERSE_BASE_REUSE=on the base arrives as a run artifact and
      # the local build below is skipped; otherwise this stays byte-for-byte the
      # original per-job build.
      - uses: actions/download-artifact@v4
        if: ${{ vars.REVERSE_BASE_REUSE == 'on' }}
        with:
          name: reverse-base-${{ matrix.arch }}
          path: ${{ runner.temp }}/reverse-base
      - name: Load and verify shared base
        if: ${{ vars.REVERSE_BASE_REUSE == 'on' }}
        run: |
          set -euo pipefail
          gzip -dc "$RUNNER_TEMP/reverse-base/reverse-base-${{ matrix.arch }}.tar.gz" | docker load
          docker image inspect --format '{{json .Config.Labels}}' "deepsonar-base:reverse-ci-${{ matrix.arch }}" > "$RUNNER_TEMP/base-labels.json"
          node agent-harness/reverse-base-identity.mjs --verify \
            --labels-json-file "$RUNNER_TEMP/base-labels.json" \
            --sha "${{ github.sha }}" --arch "${{ matrix.arch }}" --platform "${{ matrix.platform }}"
          docker tag "deepsonar-base:reverse-ci-${{ matrix.arch }}" deepsonar-base:reverse-ci
      - name: Build current native base
        if: ${{ vars.REVERSE_BASE_REUSE != 'on' }}
        run: |
          set -euo pipefail
          docker buildx build --builder default --load --platform "${{ matrix.platform }}" \
            --build-arg TOOLSET=base --tag deepsonar-base:reverse-ci --file deploy/Dockerfile.agent .
      - name: Build native Reverse runtime
        run: |
          set -euo pipefail
          docker buildx build --builder default --load --platform "${{ matrix.platform }}" \
            --build-arg BASE_IMAGE=deepsonar-base:reverse-ci \
            --tag deepsonar-reverse:native-ci --file deploy/Dockerfile.agent-reverse .
      - name: Offline runtime manual contract
        run: node agent-harness/test-runtime-manuals-runtime.mjs deepsonar-reverse:native-ci --image-key deepsonar-reverse --platform "${{ matrix.platform }}"
      - name: Real native REA samples and resource measurements
        run: node agent-harness/reverse-native-smoke.mjs --image deepsonar-reverse:native-ci --arch "${{ matrix.arch }}" --evidence-dir "reverse-evidence/${{ matrix.arch }}"
      - name: Pre-pull the pinned sandbox egress sidecar
        run: |
          set -euo pipefail
          # OpenSandbox pulls this image lazily while creating a sandbox; a slow
          # or rate-limited pull then surfaces only as
          # "Egress sidecar container failed to start (DOCKER::SANDBOX_START_FAILED)".
          # Pull it here with bounded retries so the real acceptance run neither
          # races a cold pull nor hides an unavailable image behind sandbox 500s.
          if ! image="$(grep -oE 'docker\.io/opensandbox/egress@sha256:[0-9a-f]{64}' deploy/opensandbox/config.toml | head -1)" || [ -z "$image" ]; then
            echo "pinned egress sidecar image not found in deploy/opensandbox/config.toml" >&2
            exit 1
          fi
          echo "egress sidecar image: $image"
          for attempt in 1 2 3 4; do
            if docker pull "$image"; then exit 0; fi
            if [ "$attempt" -lt 4 ]; then
              echo "egress sidecar pull attempt $attempt failed; retrying" >&2
              sleep $((attempt * 10))
            fi
          done
          echo "pinned egress sidecar image could not be pulled: $image" >&2
          exit 1
      - name: Start pinned OpenSandbox for real Job acceptance
        env:
          OPEN_SANDBOX_API_KEY: reverse-ci-ephemeral-fixture-key
        run: |
          set -euo pipefail
          docker compose -f deploy/docker-compose.opensandbox.yml up -d
          for attempt in $(seq 1 60); do
            if curl -fsS http://127.0.0.1:18081/health; then exit 0; fi
            sleep 2
          done
          echo "Pinned OpenSandbox server did not become healthy" >&2
          exit 1
      - name: Real dispatched REA Job, Evidence, Fact and independent Verify
        env:
          TEST_DATABASE_URL: postgres://deepsonar:deepsonar-ci-pass@127.0.0.1:5432/postgres
          OPEN_SANDBOX_API_KEY: reverse-ci-ephemeral-fixture-key
          OPEN_SANDBOX_DOMAIN: 127.0.0.1:18081
          REA_JOB_REPORT_DIR: ${{ github.workspace }}/reverse-job-evidence/${{ matrix.arch }}
        run: |
          set -euo pipefail
          export REA_JOB_IMAGE="$(docker image inspect --format '{{.Id}}' deepsonar-reverse:native-ci)"
          pnpm ci:integration:rea-job
      - uses: actions/upload-artifact@v4
        if: ${{ always() }}
        with:
          name: reverse-native-evidence-${{ matrix.arch }}
          path: reverse-evidence/${{ matrix.arch }}
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        if: ${{ always() }}
        with:
          name: reverse-job-evidence-${{ matrix.arch }}
          path: reverse-job-evidence/${{ matrix.arch }}
          if-no-files-found: error
      - name: Clean real Job acceptance services
        if: ${{ always() }}
        env:
          OPEN_SANDBOX_API_KEY: reverse-ci-ephemeral-fixture-key
        run: |
          docker compose -f deploy/docker-compose.opensandbox.yml down -v

  claude-budget-acceptance:
    needs: [plan, reverse-base]
    if: always() && !cancelled() && needs.plan.outputs.mode == 'ready-full' && contains(format(',{0},', needs.plan.outputs.reverse_suites), ',claude,')
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            platform: linux/amd64
            runner: ubuntu-24.04
          - arch: arm64
            platform: linux/arm64
            runner: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      # Each independent matrix builds the exact checkout on its native host.
      - name: Prepare hosted runner disk for native base
        run: node .github/ci/prepare-hosted-runner-disk.mjs
      - name: Install Job integration dependencies
        run: |
          pnpm install --frozen-lockfile
          pnpm --filter @deepsonar/shared-types build
          pnpm --filter @deepsonar/runtime-manual-contract build
          pnpm --filter @deepsonar/runtime-sandbox build
      # #975: shared-base path, gated by REVERSE_BASE_REUSE; when off the
      # original local build below runs unchanged.
      - uses: actions/download-artifact@v4
        if: ${{ vars.REVERSE_BASE_REUSE == 'on' }}
        with:
          name: reverse-base-${{ matrix.arch }}
          path: ${{ runner.temp }}/reverse-base
      - name: Load and verify shared base
        if: ${{ vars.REVERSE_BASE_REUSE == 'on' }}
        run: |
          set -euo pipefail
          gzip -dc "$RUNNER_TEMP/reverse-base/reverse-base-${{ matrix.arch }}.tar.gz" | docker load
          docker image inspect --format '{{json .Config.Labels}}' "deepsonar-base:reverse-ci-${{ matrix.arch }}" > "$RUNNER_TEMP/base-labels.json"
          node agent-harness/reverse-base-identity.mjs --verify \
            --labels-json-file "$RUNNER_TEMP/base-labels.json" \
            --sha "${{ github.sha }}" --arch "${{ matrix.arch }}" --platform "${{ matrix.platform }}"
          docker tag "deepsonar-base:reverse-ci-${{ matrix.arch }}" deepsonar-base:reverse-ci
      - name: Build current native base
        if: ${{ vars.REVERSE_BASE_REUSE != 'on' }}
        run: |
          set -euo pipefail
          docker buildx build --builder default --load --platform "${{ matrix.platform }}" \
            --build-arg TOOLSET=base --tag deepsonar-base:reverse-ci --file deploy/Dockerfile.agent .
      - name: Locked Claude CLI static budget acceptance (synthetic upstream only)
        id: acceptance
        env:
          CLAUDE_BUDGET_IMAGE: deepsonar-base:reverse-ci
        run: pnpm ci:integration:claude-request-budget
      - name: Report Claude acceptance
        if: ${{ always() }}
        env:
          ACCEPTANCE_RESULT: ${{ steps.acceptance.outcome }}
        run: |
          echo "### Claude native budget acceptance (${{ matrix.arch }})" >> "$GITHUB_STEP_SUMMARY"
          echo "Result: ${ACCEPTANCE_RESULT}; network-none container, synthetic upstream only." >> "$GITHUB_STEP_SUMMARY"

  pi-om-acceptance:
    needs: [plan, reverse-base]
    if: always() && !cancelled() && needs.plan.outputs.mode == 'ready-full' && contains(format(',{0},', needs.plan.outputs.reverse_suites), ',pi-om,')
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            platform: linux/amd64
            runner: ubuntu-24.04
          - arch: arm64
            platform: linux/arm64
            runner: ubuntu-24.04-arm
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: deepsonar
          POSTGRES_PASSWORD: deepsonar-ci-pass
          POSTGRES_DB: deepsonar
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U deepsonar -d deepsonar"
          --health-interval 5s --health-timeout 3s --health-retries 20
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      # Each independent matrix builds the exact checkout on its native host.
      - name: Prepare hosted runner disk for native base
        run: node .github/ci/prepare-hosted-runner-disk.mjs
      - name: Install Job integration dependencies
        run: |
          pnpm install --frozen-lockfile
          pnpm --filter @deepsonar/shared-types build
          pnpm --filter @deepsonar/runtime-manual-contract build
          pnpm --filter @deepsonar/runtime-sandbox build
      # #975: shared-base path, gated by REVERSE_BASE_REUSE; when off the
      # original local build below runs unchanged.
      - uses: actions/download-artifact@v4
        if: ${{ vars.REVERSE_BASE_REUSE == 'on' }}
        with:
          name: reverse-base-${{ matrix.arch }}
          path: ${{ runner.temp }}/reverse-base
      - name: Load and verify shared base
        if: ${{ vars.REVERSE_BASE_REUSE == 'on' }}
        run: |
          set -euo pipefail
          gzip -dc "$RUNNER_TEMP/reverse-base/reverse-base-${{ matrix.arch }}.tar.gz" | docker load
          docker image inspect --format '{{json .Config.Labels}}' "deepsonar-base:reverse-ci-${{ matrix.arch }}" > "$RUNNER_TEMP/base-labels.json"
          node agent-harness/reverse-base-identity.mjs --verify \
            --labels-json-file "$RUNNER_TEMP/base-labels.json" \
            --sha "${{ github.sha }}" --arch "${{ matrix.arch }}" --platform "${{ matrix.platform }}"
          docker tag "deepsonar-base:reverse-ci-${{ matrix.arch }}" deepsonar-base:reverse-ci
      - name: Build current native base
        if: ${{ vars.REVERSE_BASE_REUSE != 'on' }}
        run: |
          set -euo pipefail
          docker buildx build --builder default --load --platform "${{ matrix.platform }}" \
            --build-arg TOOLSET=base --tag deepsonar-base:reverse-ci --file deploy/Dockerfile.agent .
      - name: Start pinned OpenSandbox for real Job acceptance
        env:
          OPEN_SANDBOX_API_KEY: reverse-ci-ephemeral-fixture-key
        run: |
          set -euo pipefail
          docker compose -f deploy/docker-compose.opensandbox.yml up -d
          for attempt in $(seq 1 60); do
            if curl -fsS http://127.0.0.1:18081/health; then exit 0; fi
            sleep 2
          done
          echo "Pinned OpenSandbox server did not become healthy" >&2
          exit 1
      - name: Prepare immutable loopback image for OM Job creation
        run: |
          set -euo pipefail
          docker run -d --name om-provider-registry -p 127.0.0.1:15000:5000 \
            registry@sha256:a3d8aaa63ed8681a604f1dea0aa03f100d5895b6a58ace528858a7b332415373
          node agent-harness/opensandbox/om-provider-headers-image.mjs
      - name: Created and dispatched Pi OM provider headers (synthetic upstream only)
        id: acceptance
        env:
          TEST_DATABASE_URL: postgres://deepsonar:deepsonar-ci-pass@127.0.0.1:5432/postgres
          OPEN_SANDBOX_API_KEY: reverse-ci-ephemeral-fixture-key
          OPEN_SANDBOX_DOMAIN: 127.0.0.1:18081
          OM_PROVIDER_HEADERS_REPORT_DIR: ${{ github.workspace }}/om-provider-headers-evidence/${{ matrix.arch }}
        run: |
          set -euo pipefail
          pnpm ci:integration:om-provider-headers
      - name: Report Pi OM acceptance
        if: ${{ always() }}
        env:
          ACCEPTANCE_RESULT: ${{ steps.acceptance.outcome }}
        run: |
          echo "### Pi/OM created Job acceptance (${{ matrix.arch }})" >> "$GITHUB_STEP_SUMMARY"
          echo "Result: ${ACCEPTANCE_RESULT}; isolated database, loopback synthetic upstream." >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        if: ${{ always() }}
        with:
          name: om-provider-headers-evidence-${{ matrix.arch }}
          path: om-provider-headers-evidence/${{ matrix.arch }}
          if-no-files-found: error
      - name: Clean real Job acceptance services
        if: ${{ always() }}
        env:
          OPEN_SANDBOX_API_KEY: reverse-ci-ephemeral-fixture-key
        run: |
          trap 'docker rm -fv om-provider-registry || true' EXIT
          docker compose -f deploy/docker-compose.opensandbox.yml down -v

  reverse-runtime-acceptance:
    # Read-only job metadata; no package writes, artifacts from other runs or secrets.
    permissions:
      contents: read
      actions: read
    needs: [plan, reverse-runtime-images, claude-budget-acceptance, pi-om-acceptance]
    if: always() && (needs.plan.result != 'success' || needs.plan.outputs.mode == 'ready-full')
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Require every planned native acceptance matrix
        env:
          PLAN_RESULT: ${{ needs.plan.result }}
          PLAN_STATUS: ${{ needs.plan.outputs.plan_status }}
          PLANNED_SUITES: ${{ needs.plan.outputs.reverse_suites }}
          REVERSE_RESULT: ${{ needs.reverse-runtime-images.result }}
          CLAUDE_RESULT: ${{ needs.claude-budget-acceptance.result }}
          PI_OM_RESULT: ${{ needs.pi-om-acceptance.result }}
        run: |
          set -euo pipefail
          fail() { echo "::error::$1"; exit 1; }

          printf '### Native runtime acceptance\n\n| Check | Result |\n| --- | --- |\n| Plan | %s |\n| Reverse/REA | %s |\n| Claude | %s |\n| Pi/OM | %s |\n' \
            "$PLAN_RESULT" "$REVERSE_RESULT" "$CLAUDE_RESULT" "$PI_OM_RESULT" >> "$GITHUB_STEP_SUMMARY"

          [ "$PLAN_RESULT" = success ] || fail "reverse run plan did not succeed: $PLAN_RESULT"
          [ "$PLAN_STATUS" = ok ] || fail "reverse run plan status is not ok: ${PLAN_STATUS:-<empty>}"

          # #976: 只有计划中的专项才允许运行。计划外的 skipped 才是合法跳过；
          # 失败/取消/超时永远不能放行，计划内缺跑同样拒绝。不能只看聚合结果。
          KNOWN_SUITES="reverse claude pi-om"
          KNOWN_RESULTS="success failure cancelled skipped timed_out action_required neutral"
          for suite in ${PLANNED_SUITES//,/ }; do
            case " $KNOWN_SUITES " in
              *" $suite "*) ;;
              *) fail "unknown suite in the run plan: $suite" ;;
            esac
          done

          check_suite() {
            local name="$1" planned="$2" result="$3"
            case " $KNOWN_RESULTS " in
              *" $result "*) ;;
              *) fail "unknown result value for $name: ${result:-<empty>}" ;;
            esac
            case "$result" in
              failure|cancelled|timed_out|action_required) fail "$name did not complete cleanly: $result" ;;
            esac
            if [ "$planned" = "true" ]; then
              [ "$result" = success ] || fail "$name is required by the run plan but got: $result"
            else
              [ "$result" = skipped ] || fail "$name ran even though the run plan skipped it: $result"
            fi
          }

          planned() {
            case ",$PLANNED_SUITES," in
              *",$1,"*) printf 'true' ;;
              *) printf 'false' ;;
            esac
          }

          # base 复用开启时由各消费者在 load 后校验 SHA/架构/平台/工具集标签，缺失或不匹配即该 job 失败，这里的逐项 success 已覆盖。
          check_suite reverse/REA "$(planned reverse)" "$REVERSE_RESULT"
          check_suite claude "$(planned claude)" "$CLAUDE_RESULT"
          check_suite pi-om "$(planned pi-om)" "$PI_OM_RESULT"

          echo "reverse acceptance: planned=[$PLANNED_SUITES]; every planned suite succeeded, every unplanned suite stayed skipped"
      - uses: actions/checkout@v4
        if: always()
        with:
          persist-credentials: false
      - name: Explain actual job queue and execution costs
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          node agent-harness/ci-run-cost.mjs \
            --repository "$GITHUB_REPOSITORY" --run "$GITHUB_RUN_ID" --attempt "$GITHUB_RUN_ATTEMPT" \
            --summary "$GITHUB_STEP_SUMMARY"
