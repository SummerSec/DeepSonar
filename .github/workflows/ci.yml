name: ci

# P0 门禁：typecheck + build + dist 启动 + fake 模式业务冒烟
# - Job 控制 API-only 契约（无服务）
# - roles / hub-loop / local-project API
# - auth（独立 3101 进程，AUTH_REQUIRED=true）
#
# 触发策略（避免每个 push 都跑全量）：
# - pull_request：开/更新 PR 时跑（功能分支日常推送不单独跑）
# - push@main：合并进主干后再跑一遍；纯文档改动跳过
# - workflow_dispatch：手动补跑
on:
  pull_request:
    # Draft/Ready is the developer switch (#836): the plan job reads the current
    # PR state, so a Draft->Ready transition on the same SHA re-plans.
    types: [opened, reopened, synchronize, ready_for_review, converted_to_draft]
  push:
    branches: [main]
    paths-ignore:
      - "**/*.md"
      - "docs/**"
      - "skills/**"
      - "LICENSE"
      - "THIRD_PARTY_NOTICES.md"
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  DATABASE_URL: postgres://deepsonar:deepsonar-ci-pass@127.0.0.1:5432/deepsonar
  DEEPSONAR_BASE: http://127.0.0.1:3100
  AGENT_MODE: fake
  DEEPSONAR_HUB_ENABLED: "false"

permissions:
  contents: read
  packages: read

jobs:
  # 变更分类：只有「所有改动都在安全文本白名单内」才判为 docs_only。
  # 混合改动、删除/重命名、未知路径、分类失败、非 PR 事件（含 workflow_dispatch）一律 full。
  changes:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      docs_only: ${{ steps.plan.outputs.docs_only }}
      mode: ${{ steps.plan.outputs.mode }}
      plan_status: ${{ steps.plan.outputs.plan_status }}
      required_suites: ${{ steps.plan.outputs.required_suites }}
      fast_suites: ${{ steps.plan.outputs.fast_suites }}
      reasons: ${{ steps.plan.outputs.reasons }}
      # #961: Chrome Fuzz ARM 构建/冒烟是否属于本次必跑集合（plan 判定，跳过必须可解释）
      chrome_fuzz_arm: ${{ steps.plan.outputs.chrome_fuzz_arm }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - id: classify
        env:
          EVENT_NAME: ${{ github.event_name }}
          PR_BASE: ${{ github.event.pull_request.base.sha }}
          PR_HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          node agent-harness/classify-ci-changes.mjs \
            --event-name "$EVENT_NAME" \
            --base "${PR_BASE:-}" \
            --head "${PR_HEAD:-}"

      # #836: one plan per run — docs | draft-fast | ready-full, plus the
      # specialist suites the full tier must verify. CI_PR_MODE only enables the
      # tier when it is exactly `tiered`; unset/invalid/full restores the legacy
      # full PR acceptance.
      - id: plan
        env:
          EVENT_NAME: ${{ github.event_name }}
          PR_BASE: ${{ github.event.pull_request.base.sha }}
          PR_HEAD: ${{ github.event.pull_request.head.sha }}
          PR_DRAFT: ${{ github.event.pull_request.draft }}
          CI_PR_MODE: ${{ vars.CI_PR_MODE }}
        run: |
          node agent-harness/ci-run-plan.mjs \
            --event-name "$EVENT_NAME" \
            --base "${PR_BASE:-}" \
            --head "${PR_HEAD:-}" \
            --draft "${PR_DRAFT:-false}" \
            --ci-pr-mode "${CI_PR_MODE:-}" \
            --root .

  # 文档保鲜在所有 PR 上运行（含纯代码 PR）：删脚本、schema 版本变化同样会破坏文档。
  # 需要完整 checkout（读取 package.json、schema-version、Git symlink 元数据），但不启动数据库。
  docs-freshness:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # #971/#972/#973/#974/#975/#976：纯 Node 契约回归，无数据库、无 pnpm 依赖，与清盘安全单测同批。
      # 每个新测试的入口必须在此显式列出，否则加了文件也不会被门禁执行。
      - name: perf(ci) contract regressions and hosted runner disk safety
        run: |
          node --test \
            .github/ci/prepare-hosted-runner-disk.test.mjs \
            apps/scheduler/src/integration-pool-teardown.test.mjs \
            agent-harness/runtime-image-cache-policy.test.mjs \
            agent-harness/gate-shards.test.mjs \
            agent-harness/reverse-base-identity.test.mjs \
            agent-harness/reverse-suite-plan.test.mjs

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Tracked diff and runtime manual reproducibility
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail
          base="${BASE_SHA:-$(git rev-parse HEAD^)}"
          # Preserve this repository's existing mixed LF/CRLF files without allowing trailing spaces.
          git -c core.whitespace=trailing-space,space-before-tab,cr-at-eol diff --check "$base" "$HEAD_SHA"
          node agent-harness/runtime-manuals/generate-catalog.mjs
          git diff --exit-code -- agent-harness/runtime-manuals/catalog.json

      - name: Release recovery behavior and original signature identity
        run: |
          node --test agent-harness/release-resume.test.mjs agent-harness/platform-signature-publication.test.mjs agent-harness/egress-prepull.test.mjs
          node agent-harness/test-release-stages.mjs
          node agent-harness/test-release-writeback-order.mjs

      - name: CI routing and failure propagation regression
        run: pnpm ci:unit:ci-routing

      - name: OM fixture completion receipt regression
        run: python3 agent-harness/opensandbox/om-provider-headers-completion.test.py

      - name: Docs freshness guard (version literals, pnpm scripts, links, removed mechanisms)
        run: pnpm ci:unit:docs-freshness

      # #893 follow-up: the management Skill ships an executable CLI whose tests were
      # never wired anywhere, so the only untested asset in the repo was the one humans
      # are told to run.
      - name: Management Skill CLI contract
        run: pnpm ci:unit:management-skill

      - name: Changelog validator and current release section
        run: |
          pnpm ci:unit:changelog
          node --input-type=module <<'NODE'
          import { readFileSync } from "node:fs";
          import { validateChangelog } from "./agent-harness/validate-changelog.mjs";
          const source = readFileSync("CHANGELOG.md", "utf8");
          const [version, previousVersion] = [...source.matchAll(/^## \[(\d+\.\d+\.\d+)\]/gm)].map(match => match[1]);
          const result = validateChangelog({ source, version, previousVersion, tag: `v${version}` });
          console.log(`Validated v${version} against v${result.previousVersion}: ${result.compareUrl}`);
          NODE

  windows-upgrade-backend:
    runs-on: windows-latest
    needs: changes
    if: always() && !cancelled() && needs.changes.outputs.mode == 'ready-full'
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Native Windows upgrade locking and private durable files
        run: node --test deploy/platform-upgrade-lock.test.mjs deploy/platform-upgrade-windows.test.mjs deploy/platform-upgrade-filesystem.test.mjs deploy/platform-upgrade-preflight-windows.test.mjs

  # #835 item 1: a real process is SIGKILLed mid-completion and a fresh process must
  # replay the durable receipt. Kept out of `gate` so it has its own time budget.
  crash-recovery:
    runs-on: ubuntu-24.04
    needs: changes
    if: always() && !cancelled() && needs.changes.outputs.mode == 'ready-full'
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: deepsonar
          POSTGRES_PASSWORD: deepsonar-ci-pass
          POSTGRES_DB: deepsonar
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U deepsonar -d deepsonar"
          --health-interval 5s --health-timeout 3s --health-retries 20
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm -r build
      - name: Kill a real Scheduler process and replay from a fresh one
        env:
          TEST_DATABASE_URL: ${{ env.DATABASE_URL }}
        run: pnpm ci:integration:crash-recovery

  # #835 item 2: Find-ing lexical retrieval under a synthetic backlog, measured from the
  # PostgreSQL side (pg_stat_database deltas + EXPLAIN BUFFERS), not client RSS.
  lexical-pressure:
    runs-on: ubuntu-24.04
    needs: changes
    if: always() && !cancelled() && needs.changes.outputs.mode == 'ready-full'
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: deepsonar
          POSTGRES_PASSWORD: deepsonar-ci-pass
          POSTGRES_DB: deepsonar
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U deepsonar -d deepsonar"
          --health-interval 5s --health-timeout 3s --health-retries 20
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm -r build
      - name: Synthetic backlog with server-side metrics
        env:
          TEST_DATABASE_URL: ${{ env.DATABASE_URL }}
          LEXICAL_PRESSURE_SIZES: "1000,10000"
          LEXICAL_PRESSURE_ARTIFACT_DIR: ${{ github.workspace }}/artifacts/lexical-pressure
        run: pnpm ci:integration:lexical-pressure
      - uses: actions/upload-artifact@v4
        if: ${{ always() }}
        with:
          name: lexical-pressure-metrics
          path: artifacts/lexical-pressure
          if-no-files-found: warn

  # #835 item 3: bounded multi-round / multi-session growth of the real OM
  # plugin inside the built image. Measures on-disk bytes per round and proves a
  # resumed process still recalls pre-restart sources without deleting history.
  pi-om-growth:
    runs-on: ubuntu-24.04
    needs: changes
    if: always() && !cancelled() && needs.changes.outputs.mode == 'ready-full'
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Build base image with the real Pi/OM install
        run: |
          set -euo pipefail
          docker buildx build --builder default --load --platform linux/amd64 \
            --build-arg TOOLSET=base --tag deepsonar-base:ci --file deploy/Dockerfile.agent .
      - name: Multi-round / multi-session growth probe
        run: |
          set -euo pipefail
          mkdir -p artifacts/pi-om-growth
          node agent-harness/test-pi-rpc.mjs --growth | tee artifacts/pi-om-growth/log.txt
          node --input-type=module -e '
            import { readFileSync, writeFileSync } from "node:fs";
            const lines = readFileSync("artifacts/pi-om-growth/log.txt", "utf8").split("\n").reverse();
            const report = lines.find((line) => line.startsWith("{\"image_identity\"") || line.startsWith("{\"pi_om_growth\""));
            if (!report) throw new Error("the growth probe printed no JSON report");
            writeFileSync("artifacts/pi-om-growth/metrics.json", `${JSON.stringify(JSON.parse(report), null, 2)}\n`);
          '
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: pi-om-growth
          path: artifacts/pi-om-growth
          if-no-files-found: warn

  # 有界并发分片 1/4（并发上限为 4）：纯无服务单测/契约/静态检查，不声明 services.postgres；4 片各自独立生命周期、各自 install/build，不复用跨提交结果。
  gate-contract:
    runs-on: ubuntu-24.04
    needs: changes
    if: always() && !cancelled() && needs.changes.outputs.mode == 'ready-full'
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - name: Select PostgreSQL 16 client (matches the service)
        run: |
          if ! test -x /usr/lib/postgresql/16/bin/pg_dump || ! test -x /usr/lib/postgresql/16/bin/pg_restore; then
            sudo apt-get update && sudo apt-get install -y postgresql-client-16
          fi
          dump_version="$(/usr/lib/postgresql/16/bin/pg_dump --version)"
          restore_version="$(/usr/lib/postgresql/16/bin/pg_restore --version)"
          echo "$dump_version"
          echo "$restore_version"
          [[ "$dump_version" == "pg_dump (PostgreSQL) 16."* ]] || exit 1
          [[ "$restore_version" == "pg_restore (PostgreSQL) 16."* ]] || exit 1
          echo "/usr/lib/postgresql/16/bin" >> "$GITHUB_PATH"
      - run: pnpm install --frozen-lockfile
      - run: pnpm -r typecheck
      - run: pnpm -r build
      - name: Runtime image definition consistency
        run: pnpm ci:images
      - name: Runtime image registry contract unit
        run: pnpm ci:unit:runtime-images
      - name: Runtime resource cleanup and disk pressure unit
        run: pnpm ci:unit:runtime-cleanup
      - name: Image admission registry selection unit
        run: pnpm ci:unit:image-admission
      - name: Runtime image destination evidence unit
        run: pnpm ci:unit:runtime-image-record
      - name: Runtime image registry generator compatibility
        run: pnpm ci:unit:runtime-registry
      - name: Locked native SDK and DSH CLI budget regression (synthetic upstream only)
        run: pnpm ci:integration:request-budget-sdk
      - name: Locked Pi provider composition and header regression (synthetic upstream only)
        run: pnpm ci:integration:provider-headers-sdk
      - name: Target image offline upgrade configuration preflight
        run: pnpm ci:unit:platform-upgrade-preflight
      - name: Pinned cosign ephemeral-key verification (no production identity)
        shell: bash
        run: |
          set -euo pipefail
          verifier="$RUNNER_TEMP/deepsonar-test-cosign"
          verifier_sha=424e2c97d0b45fd7a6b608a87f090f35633f4c23ece5f092d48bba11aaf4bbfa
          curl --fail --silent --show-error --location --retry 3 --max-time 180 \
            https://github.com/sigstore/cosign/releases/download/v3.1.4/cosign-linux-amd64 -o "$verifier"
          echo "$verifier_sha  $verifier" | sha256sum --check --strict
          chmod 700 "$verifier"
          DEEPSONAR_TEST_COSIGN="$verifier" DEEPSONAR_TEST_COSIGN_SHA256="$verifier_sha" \
            node --test deploy/platform-upgrade-signature.integration.test.mjs
      - name: Maintenance and managed node upgrade unit
        run: pnpm ci:unit:platform-upgrade-maintenance
      - name: Scheduler startup gate unit
        run: pnpm ci:unit:startup-gate
      - name: Capability Pack contract and discovery unit
        run: pnpm ci:unit:capability-pack
      - name: Project knowledge strict contracts and scope unit
        run: pnpm ci:unit:project-knowledge
      - name: Scheduler public Job role enablement gate
        run: pnpm --filter @deepsonar/scheduler exec tsx --test src/domains/job-control/routes.test.ts
      - name: Scheduler Job lifecycle characterization
        run: pnpm ci:unit:job-lifecycle
      - name: Scheduler orphan recovery evidence unit
        run: pnpm ci:unit:recovery
      - name: Governed completion recovery contracts and unit
        run: pnpm ci:unit:completion-recovery
      - name: Device broker unit
        run: pnpm ci:unit:device-broker
      - name: Device lease contract unit
        run: pnpm ci:unit:device-lease
      - name: Scheduler bounded-context characterization guardrails
        run: pnpm ci:unit:scheduler-characterization
      - name: Test wiring ratchet guard
        run: pnpm ci:unit:ci-test-hook
      - name: File size ratchet guard
        run: pnpm ci:unit:file-size
      - name: Authenticated report download web unit
        run: pnpm ci:unit:web-report-download
      - name: Projects intent launch web unit
        run: pnpm ci:unit:web-quick-start
      - name: Canvas Fact workbench web unit
        run: pnpm ci:unit:web-facts
      - name: Agent Session viewer web unit
        run: pnpm ci:unit:web-session-viewer
      - name: Report download OpenAPI unit
        run: pnpm ci:unit:report-download-openapi
      - name: Finding protocol and CVSS unit
        run: pnpm ci:unit:finding-protocol
      - name: Finding offline evaluation unit
        run: pnpm ci:unit:finding-offline-evaluation
      - name: Finding research ranking unit
        run: pnpm ci:unit:finding-research
      - name: Finding governed quality unit and real module entrypoints
        run: pnpm ci:unit:finding-quality
      - name: Finding durable candidate Web behavior
        run: pnpm ci:unit:finding-candidates-web
      - name: Finding lexical search Web behavior
        run: pnpm ci:unit:finding-lexical-web
      - name: Shared assets contract unit
        run: pnpm ci:unit:shared-assets
      - name: Role color unit and projection tests
        run: pnpm ci:unit:role-colors
      - name: Plan protocol unit
        run: pnpm ci:unit:plan-protocol
      - name: Plan frozen offline replay unit
        run: pnpm ci:unit:plan-replay
      - name: Semantic event rate-limit unit
        run: pnpm ci:unit:event-rate-limit
      - name: Login brute-force rate-limit unit
        run: pnpm ci:unit:login-rate-limit
      - name: Windows deploy.ps1 encoding and pull semantics
        run: pnpm ci:unit:deploy-ps1
      - name: Control-plane multi-arch pins (#598)
        run: pnpm ci:unit:control-plane-platforms
      - name: Hub graph reference unit
        run: pnpm ci:unit:graph-references
      - name: Compose task unit
        run: pnpm ci:unit:compose-tasks
      - name: Task intent edit unit
        run: pnpm ci:unit:task-intent
      - name: Searchable dropdown unit and adoption guard
        run: pnpm ci:unit:searchable-selects
      - name: Verify eligibility unit
        run: pnpm ci:unit:verify-eligibility
      - name: Canvas Fact contract unit
        run: pnpm ci:unit:canvas-facts
      - name: Real executor fact verification unit
        run: pnpm ci:unit:executor-real
      - name: Credential and CLI compatibility unit
        run: pnpm ci:unit:credential-compatibility
      - name: Runtime sandbox semantic tool unit
        run: pnpm ci:unit:runtime-sandbox
      - name: OpenSandbox production compose merge
        run: |
          tmp="$(mktemp -d)"
          trap 'rm -rf "$tmp"' EXIT
          printf '%s\n' \
            "POSTGRES_PASSWORD=ci-opensandbox" \
            "DEEPSONAR_VERSION=0.1.46" \
            "DEEPSONAR_SCHEDULER_IMAGE=ghcr.io/summersec/deepsonar-scheduler@sha256:aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa" \
            "DEEPSONAR_WEB_IMAGE=ghcr.io/summersec/deepsonar-web@sha256:aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa" \
            "DEEPSONAR_IMAGE_ADMISSION_IMAGE=ghcr.io/summersec/deepsonar-image-admission@sha256:aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa" \
            "BLOB_S3_ACCESS_KEY_ID=ci" \
            "BLOB_S3_SECRET_ACCESS_KEY=ci-secret" \
            "OPEN_SANDBOX_API_KEY=ci-opensandbox" \
            > "$tmp/.env"
          rendered="$(docker compose --project-directory "$tmp" --env-file "$tmp/.env" \
            -f deploy/docker-compose.prod.yml \
            -f deploy/docker-compose.real.yml \
            -f deploy/docker-compose.opensandbox.prod.yml \
            config)"
          for service in scheduler web image-admission; do
            printf '%s\n' "$rendered" | grep -Eq "image: ghcr.io/summersec/deepsonar-${service}@sha256:[0-9a-f]{64}$"
          done
          printf '%s\n' "$rendered" | grep -F "SANDBOX_PROVIDER: opensandbox"
          printf '%s\n' "$rendered" | grep -F 'published: "18081"'
          grep -Ev '^DEEPSONAR_(SCHEDULER_IMAGE|WEB_IMAGE|IMAGE_ADMISSION_IMAGE)=' "$tmp/.env" > "$tmp/legacy.env"
          printf '%s\n' 'DEEPSONAR_IMAGE_TAG=0.1.46' >> "$tmp/legacy.env"
          if docker compose --project-directory "$tmp" --env-file "$tmp/legacy.env" -f deploy/docker-compose.prod.yml config > "$tmp/legacy.out" 2>&1; then
            echo 'legacy tag-only environment unexpectedly rendered' >&2
            exit 1
          fi
          grep -E 'required variable DEEPSONAR_(SCHEDULER_IMAGE|WEB_IMAGE|IMAGE_ADMISSION_IMAGE)' "$tmp/legacy.out"
      - name: OpenSandbox host overlay gateway upstream
        run: |
          tmp="$(mktemp -d)"
          trap 'rm -rf "$tmp"' EXIT
          printf '%s\n' \
            "POSTGRES_PASSWORD=ci-opensandbox" \
            "DEEPSONAR_VERSION=0.1.46" \
            "DEEPSONAR_SCHEDULER_IMAGE=ghcr.io/summersec/deepsonar-scheduler@sha256:aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa" \
            "DEEPSONAR_WEB_IMAGE=ghcr.io/summersec/deepsonar-web@sha256:aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa" \
            "DEEPSONAR_IMAGE_ADMISSION_IMAGE=ghcr.io/summersec/deepsonar-image-admission@sha256:aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa" \
            "BLOB_S3_ACCESS_KEY_ID=ci" \
            "BLOB_S3_SECRET_ACCESS_KEY=ci-secret" \
            "DEEPSONAR_ADMIN_TOKEN=ci-admin" \
            "OPEN_SANDBOX_API_KEY=ci-opensandbox" \
            "SCHEDULER_HOST_PORT=14100" \
            > "$tmp/.env"
          rendered="$(docker compose --project-directory deploy --env-file "$tmp/.env" \
            -f deploy/docker-compose.opensandbox.host.yml config)"
          for service in scheduler web; do
            printf '%s\n' "$rendered" | grep -Eq "image: ghcr.io/summersec/deepsonar-${service}@sha256:[0-9a-f]{64}$"
          done
          printf '%s\n' "$rendered" | grep -F "http://host.docker.internal:14100/gateway"
          ! printf '%s\n' "$rendered" | grep -F "http://127.0.0.1:14100/gateway"
          ! printf '%s\n' "$rendered" | grep -F "http://127.0.0.1:13100/gateway"
      - name: Authorization boundary unit
        run: pnpm ci:unit:authz

  # 有界并发分片 2/4（并发上限为 4）：DB 核心集成，services.postgres 与原 gate 完全相同；4 片各自独立生命周期、各自 install/build，不复用跨提交结果。
  gate-db-core:
    runs-on: ubuntu-24.04
    needs: changes
    if: always() && !cancelled() && needs.changes.outputs.mode == 'ready-full'
    timeout-minutes: 40
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: deepsonar
          POSTGRES_PASSWORD: deepsonar-ci-pass
          POSTGRES_DB: deepsonar
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U deepsonar -d deepsonar"
          --health-interval 5s --health-timeout 3s --health-retries 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - name: Select PostgreSQL 16 client (matches the service)
        run: |
          if ! test -x /usr/lib/postgresql/16/bin/pg_dump || ! test -x /usr/lib/postgresql/16/bin/pg_restore; then
            sudo apt-get update && sudo apt-get install -y postgresql-client-16
          fi
          dump_version="$(/usr/lib/postgresql/16/bin/pg_dump --version)"
          restore_version="$(/usr/lib/postgresql/16/bin/pg_restore --version)"
          echo "$dump_version"
          echo "$restore_version"
          [[ "$dump_version" == "pg_dump (PostgreSQL) 16."* ]] || exit 1
          [[ "$restore_version" == "pg_restore (PostgreSQL) 16."* ]] || exit 1
          echo "/usr/lib/postgresql/16/bin" >> "$GITHUB_PATH"
      - run: pnpm install --frozen-lockfile
      - run: pnpm -r typecheck
      - run: pnpm -r build
      - name: Runtime image promotion reconciliation (channel-only v2 fixture)
