  # 有界并发分片 3/4（并发上限为 4）：DB 领域集成与 Docker 只读卷校验，services.postgres 与原 gate 完全相同；4 片各自独立生命周期、各自 install/build，不复用跨提交结果。
  gate-db-domain:
    runs-on: ubuntu-24.04
    needs: changes
    if: always() && !cancelled() && needs.changes.outputs.mode == 'ready-full'
    timeout-minutes: 40
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: deepsonar
          POSTGRES_PASSWORD: deepsonar-ci-pass
          POSTGRES_DB: deepsonar
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U deepsonar -d deepsonar"
          --health-interval 5s --health-timeout 3s --health-retries 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - name: Select PostgreSQL 16 client (matches the service)
        run: |
          if ! test -x /usr/lib/postgresql/16/bin/pg_dump || ! test -x /usr/lib/postgresql/16/bin/pg_restore; then
            sudo apt-get update && sudo apt-get install -y postgresql-client-16
          fi
          dump_version="$(/usr/lib/postgresql/16/bin/pg_dump --version)"
          restore_version="$(/usr/lib/postgresql/16/bin/pg_restore --version)"
          echo "$dump_version"
          echo "$restore_version"
          [[ "$dump_version" == "pg_dump (PostgreSQL) 16."* ]] || exit 1
          [[ "$restore_version" == "pg_restore (PostgreSQL) 16."* ]] || exit 1
          echo "/usr/lib/postgresql/16/bin" >> "$GITHUB_PATH"
      - run: pnpm install --frozen-lockfile
      - run: pnpm -r typecheck
      - run: pnpm -r build
      - name: Authenticated report download Fastify integration
        env:
          TEST_DATABASE_URL: ${{ env.DATABASE_URL }}
        run: pnpm ci:integration:report-download
      - name: Per-Finding report PostgreSQL integration
        env:
          TEST_DATABASE_URL: ${{ env.DATABASE_URL }}
        run: pnpm ci:integration:finding-report
      - name: Finding protocol PostgreSQL integration
        env:
          TEST_DATABASE_URL: ${{ env.DATABASE_URL }}
        run: pnpm ci:integration:finding-protocol
      - name: Finding research PostgreSQL integration
        env:
          TEST_DATABASE_URL: ${{ env.DATABASE_URL }}
        run: pnpm ci:integration:finding-research
      - name: Finding governed quality PostgreSQL and stored-session HTTP integration
        env:
          TEST_DATABASE_URL: ${{ env.DATABASE_URL }}
        run: |
          test -n "$TEST_DATABASE_URL"
          pnpm ci:integration:finding-quality
      - name: Shared assets PostgreSQL and API integration
        env:
          TEST_DATABASE_URL: ${{ env.DATABASE_URL }}
        run: pnpm ci:integration:shared-assets
      - name: Shared assets real Docker read-only volume
        env:
          RUN_DOCKER_SHARED_ASSETS_TEST: "1"
        run: pnpm ci:integration:shared-assets-volume
      - name: Platform API Job capability PostgreSQL integration
        env:
          TEST_DATABASE_URL: ${{ env.DATABASE_URL }}
        run: pnpm ci:integration:platform-api
      - name: Token, job, image, and transfer authorization Postgres integration
        env:
          TEST_DATABASE_URL: ${{ env.DATABASE_URL }}
        run: pnpm ci:integration:authz-boundaries
      - name: Default human admin and account integration
        env:
          TEST_DATABASE_URL: ${{ env.DATABASE_URL }}
        run: pnpm ci:integration:users-auth
      - name: Login brute-force rate-limit Postgres integration
        env:
          TEST_DATABASE_URL: ${{ env.DATABASE_URL }}
        run: pnpm ci:integration:login-rate-limit
      - name: Convergence recovery Postgres integration
        env:
          TEST_DATABASE_URL: ${{ env.DATABASE_URL }}
          DEEPSONAR_HUB_ENABLED: "true"
        run: pnpm ci:integration:convergence-recovery
      - name: Verify eligibility Postgres integration
        env:
          TEST_DATABASE_URL: ${{ env.DATABASE_URL }}
          DEEPSONAR_HUB_ENABLED: "true"
        run: pnpm ci:integration:verify-eligibility
      - name: Job 控制 API-only 契约冒烟
        run: pnpm --filter @deepsonar/scheduler exec tsx ../../agent-harness/test-control-api.ts

  # 有界并发分片 4/4（并发上限为 4）：3100/3101 进程与同库 setval 竞态，e2e 步骤必须同片；services.postgres 与原 gate 完全相同；4 片各自独立生命周期、各自 install/build，不复用跨提交结果。
  gate-e2e:
    runs-on: ubuntu-24.04
    needs: changes
    if: always() && !cancelled() && needs.changes.outputs.mode == 'ready-full'
    timeout-minutes: 40
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: deepsonar
          POSTGRES_PASSWORD: deepsonar-ci-pass
          POSTGRES_DB: deepsonar
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U deepsonar -d deepsonar"
          --health-interval 5s --health-timeout 3s --health-retries 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - name: Select PostgreSQL 16 client (matches the service)
        run: |
          if ! test -x /usr/lib/postgresql/16/bin/pg_dump || ! test -x /usr/lib/postgresql/16/bin/pg_restore; then
            sudo apt-get update && sudo apt-get install -y postgresql-client-16
          fi
          dump_version="$(/usr/lib/postgresql/16/bin/pg_dump --version)"
          restore_version="$(/usr/lib/postgresql/16/bin/pg_restore --version)"
          echo "$dump_version"
          echo "$restore_version"
          [[ "$dump_version" == "pg_dump (PostgreSQL) 16."* ]] || exit 1
          [[ "$restore_version" == "pg_restore (PostgreSQL) 16."* ]] || exit 1
          echo "/usr/lib/postgresql/16/bin" >> "$GITHUB_PATH"
      - run: pnpm install --frozen-lockfile
      - run: pnpm -r typecheck
      - run: pnpm -r build
      - name: Runtime test policy smoke
        run: pnpm ci:smoke:runtime-policy
      - name: Scheduler convergence regression
        run: pnpm ci:smoke:convergence
      - name: Start scheduler (fake, no auth)
        env:
          AGENT_MODE: fake
          SCHEDULER_PORT: "3100"
          SCHEDULER_HOST: "127.0.0.1"
          DEEPSONAR_HUB_ENABLED: "false"
        run: |
          node --import ./apps/scheduler/dist/domains/project-finding-research/quality-source-bootstrap.js apps/scheduler/dist/index.js > /tmp/scheduler-3100.log 2>&1 &
          echo $! > /tmp/scheduler-3100.pid
          for i in $(seq 1 60); do
            curl -sf http://127.0.0.1:3100/health && exit 0
            sleep 1
          done
          echo "scheduler failed to become healthy" >&2
          cat /tmp/scheduler-3100.log >&2
          exit 1
      - name: Roles API smoke
        env:
          DEEPSONAR_EXPECT_HUB_ENABLED: "false"
        run: python agent-harness/test-roles-api.py
      - name: Runtime image marketplace API smoke
        run: python agent-harness/test-runtime-images-api.py
      - name: Hub loop smoke
        env:
          DEEPSONAR_HUB_SMOKE_TIMEOUT: "300"
        run: python agent-harness/test-hub-loop.py
      - name: Local project / task API smoke
        run: python agent-harness/test-local-project-api.py
      - name: Start scheduler (auth required)
        env:
          AGENT_MODE: fake
          SCHEDULER_PORT: "3101"
          SCHEDULER_HOST: "127.0.0.1"
          DEEPSONAR_AUTH_REQUIRED: "true"
          DEEPSONAR_ADMIN_TOKEN: boot-secret
          DEEPSONAR_HUB_ENABLED: "false"
        run: |
          # 3101 启动会 reconcile 序列；3100 若仍在写同一库，setval 会与 INSERT 竞态。
          if [ -f /tmp/scheduler-3100.pid ]; then
            kill "$(cat /tmp/scheduler-3100.pid)" 2>/dev/null || true
            for i in $(seq 1 20); do
              kill -0 "$(cat /tmp/scheduler-3100.pid)" 2>/dev/null || break
              sleep 0.25
            done
          fi
          node --import ./apps/scheduler/dist/domains/project-finding-research/quality-source-bootstrap.js apps/scheduler/dist/index.js > /tmp/scheduler-3101.log 2>&1 &
          echo $! > /tmp/scheduler-3101.pid
          for i in $(seq 1 60); do
            curl -sf http://127.0.0.1:3101/health && exit 0
            sleep 1
          done
          echo "auth scheduler failed to become healthy" >&2
          cat /tmp/scheduler-3101.log >&2
          exit 1
      - name: Auth API smoke
        env:
          DEEPSONAR_BASE: http://127.0.0.1:3101
          DEEPSONAR_ADMIN_TOKEN: boot-secret
        run: python agent-harness/test-auth-api.py
      - name: Dump scheduler logs on failure
        if: failure()
        run: |
          echo "===== scheduler :3100 ====="
          cat /tmp/scheduler-3100.log 2>/dev/null || true
          echo "===== scheduler :3101 ====="
          cat /tmp/scheduler-3101.log 2>/dev/null || true

  runtime-images:
    runs-on: ubuntu-latest
    needs: changes
    if: always() && !cancelled() && needs.changes.outputs.mode == 'ready-full'
    timeout-minutes: 45
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - toolset: base
            dockerfile: deploy/Dockerfile.agent
            build_args: TOOLSET=base
            config: agent-harness/runtime-images.json
          - toolset: audit
            dockerfile: deploy/Dockerfile.agent
            build_args: TOOLSET=audit
            config: agent-harness/runtime-images.json
          - toolset: kali-minimal
            dockerfile: deploy/Dockerfile.agent-kali-minimal
            build_args: ""
            config: agent-harness/kali-minimal-runtime.json
    steps:
      - uses: actions/checkout@v4
      - id: ns
        name: GHCR namespace
        shell: bash
        run: |
          set -euo pipefail
          owner="${GITHUB_REPOSITORY_OWNER,,}"
          printf 'owner=%s\n' "$owner" >> "$GITHUB_OUTPUT"
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: fingerprint
        name: Build fingerprint
        shell: bash
        run: |
          set -euo pipefail
          # 与 release 相同 preset/platforms，便于复用 GHCR src-* 多架构产物；CI 只 pull amd64 做冒烟
          node agent-harness/image-build-fingerprint.mjs --preset "deepsonar-${{ matrix.toolset }}"
      - id: resolve
        name: Resolve src cache
        shell: bash
        env:
          IMAGE_NAME: ghcr.io/${{ steps.ns.outputs.owner }}/deepsonar-${{ matrix.toolset }}
          FINGERPRINT: ${{ steps.fingerprint.outputs.fingerprint }}
          SRC_TAG: ${{ steps.fingerprint.outputs.src_tag }}
        run: bash agent-harness/resolve-image-src-cache.sh resolve
      - name: Record reused image
        if: ${{ steps.resolve.outputs.skip == 'true' }}
        run: |
          set -euo pipefail
          echo "${{ matrix.toolset }} build unchanged: reusing immutable src cache; offline manual validation will run" >> "$GITHUB_STEP_SUMMARY"
      - name: Free disk for Kali toolchain image
        if: ${{ matrix.toolset == 'kali-minimal' && steps.resolve.outputs.skip != 'true' }}
        run: |
          set -euo pipefail
          sudo rm -rf \
            /usr/local/lib/android \
            /usr/share/dotnet \
            /opt/ghc \
            /usr/local/share/boost \
            /usr/share/swift \
            /usr/local/.ghcup \
            /opt/hostedtoolcache/CodeQL \
            /opt/hostedtoolcache/go \
            /opt/hostedtoolcache/Java_Temurin-Hotspot_jdk \
            "$AGENT_TOOLSDIRECTORY" 2>/dev/null || true
          sudo docker system prune -af || true
          docker system df || true
          df -h /
      - name: Set up Buildx for image build
        if: ${{ steps.resolve.outputs.skip != 'true' }}
        uses: docker/setup-buildx-action@v3
      - id: cache_policy
        name: Compute runtime cache policy
        if: ${{ steps.resolve.outputs.skip != 'true' }}
        shell: bash
        env:
          KALI_GHA_MODE: ${{ vars.RUNTIME_CACHE_KALI_GHA }}
        run: |
          node agent-harness/runtime-image-cache-policy.mjs \
            --toolset "${{ matrix.toolset }}" \
            --owner "${{ steps.ns.outputs.owner }}" \
            --src-tag "${{ steps.fingerprint.outputs.src_tag }}" \
            --kali-gha-mode "${KALI_GHA_MODE}" \
            --event-name "${{ github.event_name }}"
      - name: Build official runtime
        if: ${{ steps.resolve.outputs.skip != 'true' }}
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          load: true
          tags: deepsonar-${{ matrix.toolset }}:ci
          build-args: ${{ matrix.build_args }}
          # Registry cache 扛大层；ignore-error 避免 fork PR 无 packages:write 时失败
          # 不 pin 多架构 src-*（CI 仅 amd64，避免覆盖 release 的 multi-arch index）
          cache-from: ${{ steps.cache_policy.outputs.cache_from }}
          cache-to: ${{ steps.cache_policy.outputs.cache_to }}
      - name: Load reused runtime for offline validation
        if: ${{ steps.resolve.outputs.skip == 'true' }}
        env:
          SOURCE_IMAGE: ${{ steps.resolve.outputs.src_ref }}
        run: |
          set -euo pipefail
          test -n "$SOURCE_IMAGE"
          docker pull "$SOURCE_IMAGE"
          docker tag "$SOURCE_IMAGE" "deepsonar-${{ matrix.toolset }}:ci"
          docker image inspect "deepsonar-${{ matrix.toolset }}:ci" >/dev/null
      - name: Offline hardened smoke
        if: ${{ steps.resolve.outputs.skip != 'true' }}
        run: node agent-harness/test-runtime-image.mjs deepsonar-${{ matrix.toolset }}:ci ${{ matrix.toolset }} ${{ matrix.config }}
      - name: Offline runtime manual smoke
        run: node agent-harness/test-runtime-manuals-runtime.mjs deepsonar-${{ matrix.toolset }}:ci ${{ matrix.toolset }} ${{ matrix.config }}
      - name: Pi RPC real Docker smoke
        if: ${{ matrix.toolset == 'base' }}
        run: |
          set -o pipefail
          node agent-harness/test-pi-rpc.mjs deepsonar-base:ci 2>&1 | tee /tmp/pi-rpc-smoke.log || {
            detail="$(tail -c 8000 /tmp/pi-rpc-smoke.log | tr '\n' ' ')"
            echo "::error title=Pi RPC real Docker smoke::${detail}"
            exit 1
          }
      - name: DSH Cordis real Docker boot smoke
        if: ${{ matrix.toolset == 'base' }}
        shell: bash
        run: |
          set -euo pipefail
          node agent-harness/test-dsh-cordis.mjs deepsonar-base:ci \
            2> >(tee /tmp/dsh-cordis-smoke.stderr >&2) || {
            detail="$(tail -c 8192 /tmp/dsh-cordis-smoke.stderr | tr '\n' ' ')"
            echo "::error title=DSH Cordis real Docker boot smoke::${detail}"
            exit 1
          }
      - name: Maven online package smoke
        if: ${{ matrix.toolset == 'kali-minimal' && steps.resolve.outputs.skip != 'true' }}
        run: node agent-harness/test-maven-package.mjs deepsonar-kali-minimal:ci

  # 在 PR/main 门禁保留 V8 arm64 交叉工具链回归。V8 使用固定的 x86_64 Clang
  # 编译，QEMU 只负责组装 arm64 运行时；真实 d8/libFuzzer 冒烟在依赖的 arm64 作业中原生执行。
  chrome-fuzz-arm64-build:
    runs-on: ubuntu-latest
    needs: changes
    # #961: 只有运行计划判定本次改动可能影响 V8 构建时才起这组 ARM 门禁；
    # plan 失败/分类失败/非 PR 事件在模型里一律 fail closed 为 required。
    if: always() && !cancelled() && needs.changes.outputs.mode == 'ready-full' && needs.changes.outputs.chrome_fuzz_arm == 'required'
    timeout-minutes: 240
    permissions:
      contents: read
      packages: write
    outputs:
      owner: ${{ steps.ns.outputs.owner }}
      digest: ${{ steps.image.outputs.digest }}
    steps:
      - uses: actions/checkout@v4
      - id: ns
        name: GHCR namespace
        shell: bash
        run: |
          set -euo pipefail
          owner="${GITHUB_REPOSITORY_OWNER,,}"
          printf 'owner=%s\n' "$owner" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: base-image
        name: Resolve immutable base image digest
        shell: bash
        run: |
          set -euo pipefail
          base_ref=ghcr.io/summersec/deepsonar-base:latest
          digest="$(docker buildx imagetools inspect "$base_ref" --format '{{.Manifest.Digest}}' 2>/dev/null || true)"
          if [[ ! "$digest" =~ ^sha256:[0-9a-f]{64}$ ]]; then
            digest="$(docker buildx imagetools inspect "$base_ref" 2>/dev/null \
              | sed -nE 's/^[[:space:]]*Digest:[[:space:]]*(sha256:[0-9a-f]{64}).*/\1/p' \
              | head -n1)"
          fi
          [[ "$digest" =~ ^sha256:[0-9a-f]{64}$ ]]
          printf 'ref=%s@%s\n' "${base_ref%:*}" "$digest" >> "$GITHUB_OUTPUT"
      - id: fingerprint
        name: Build fingerprint
        shell: bash
        run: |
          set -euo pipefail
          node agent-harness/image-build-fingerprint.mjs \
            --preset deepsonar-chrome-fuzz \
            --platforms linux/arm64 \
            --build-arg "BASE_IMAGE=${{ steps.base-image.outputs.ref }}"
      - id: resolve
        name: Resolve src cache
        shell: bash
        env:
          IMAGE_NAME: ghcr.io/${{ steps.ns.outputs.owner }}/deepsonar-chrome-fuzz
          FINGERPRINT: ${{ steps.fingerprint.outputs.fingerprint }}
          SRC_TAG: ${{ steps.fingerprint.outputs.src_tag }}
        run: bash agent-harness/resolve-image-src-cache.sh resolve
      - name: Prepare hosted runner disk for Chrome Fuzz arm64
        if: ${{ steps.resolve.outputs.skip != 'true' }}
        run: node .github/ci/prepare-hosted-runner-disk.mjs
      - name: Record reused Chrome Fuzz image
        if: ${{ steps.resolve.outputs.skip == 'true' }}
        run: |
          set -euo pipefail
          echo "Chrome Fuzz arm64 build unchanged: reusing immutable src cache" >> "$GITHUB_STEP_SUMMARY"
      - id: build
        name: Build Chrome Fuzz arm64 by digest
        if: ${{ steps.resolve.outputs.skip != 'true' }}
        uses: docker/build-push-action@v6
        with:
          context: .
          file: deploy/Dockerfile.agent-chrome-fuzz
          platforms: linux/arm64
          outputs: type=image,name=ghcr.io/${{ steps.ns.outputs.owner }}/deepsonar-chrome-fuzz,push-by-digest=true,name-canonical=true,push=true
          build-args: BASE_IMAGE=${{ steps.base-image.outputs.ref }}
          provenance: mode=max
          sbom: true
          cache-from: |
            type=registry,ref=ghcr.io/${{ steps.ns.outputs.owner }}/deepsonar-chrome-fuzz:buildcache-arm64
            type=registry,ref=ghcr.io/${{ steps.ns.outputs.owner }}/deepsonar-chrome-fuzz:${{ steps.fingerprint.outputs.src_tag }}
            type=gha,scope=chrome-fuzz-arm64
          cache-to: |
            type=registry,ref=ghcr.io/${{ steps.ns.outputs.owner }}/deepsonar-chrome-fuzz:buildcache-arm64,mode=max,ignore-error=true
            type=gha,mode=max,scope=chrome-fuzz-arm64
      - id: image
        name: Resolve immutable Chrome Fuzz digest and pin src cache
        shell: bash
        env:
          IMAGE_NAME: ghcr.io/${{ steps.ns.outputs.owner }}/deepsonar-chrome-fuzz
          FINGERPRINT: ${{ steps.fingerprint.outputs.fingerprint }}
          SRC_TAG: ${{ steps.fingerprint.outputs.src_tag }}
          SKIP: ${{ steps.resolve.outputs.skip }}
          REUSE_DIGEST: ${{ steps.resolve.outputs.digest }}
          BUILD_DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          set -euo pipefail
          if [[ "$SKIP" == "true" ]]; then
            digest="$REUSE_DIGEST"
          else
            digest="$BUILD_DIGEST"
            DIGEST="$digest" bash agent-harness/resolve-image-src-cache.sh pin
          fi
          [[ "$digest" =~ ^sha256:[0-9a-f]{64}$ ]]
          printf 'digest=%s\n' "$digest" >> "$GITHUB_OUTPUT"
  # QEMU 可以组装交叉构建的镜像，但不是 ASan 插桩 V8 冒烟的可靠执行环境。
  # 该门禁固定使用原生 runner，成功结果才能证明真实 arm64 d8/libFuzzer 运行时可用。
  chrome-fuzz-arm64:
    needs: [changes, chrome-fuzz-arm64-build]
    runs-on: ubuntu-24.04-arm
    if: always() && !cancelled() && needs.changes.outputs.mode == 'ready-full' && needs.changes.outputs.chrome_fuzz_arm == 'required' && needs.chrome-fuzz-arm64-build.result == 'success'
    timeout-minutes: 30
    permissions:
      contents: read
      packages: read
    steps:
      - uses: actions/checkout@v4
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: 原生执行 Chrome Fuzz 不可变 digest 冒烟
        env:
          IMAGE_NAME: ghcr.io/${{ needs.chrome-fuzz-arm64-build.outputs.owner }}/deepsonar-chrome-fuzz
          DIGEST: ${{ needs.chrome-fuzz-arm64-build.outputs.digest }}
        run: |
          set -euo pipefail
          image_ref="${IMAGE_NAME}@${DIGEST}"
          [[ "$DIGEST" =~ ^sha256:[0-9a-f]{64}$ ]]
          docker pull --platform linux/arm64 "$image_ref"
          node agent-harness/test-chrome-runtime.mjs "$image_ref" chrome-fuzz agent-harness/chrome-fuzz-runtime.json linux/arm64

  # #836 Draft 快检：frozen install + workspace typecheck + 命中模块的无服务单测。
  # 不启动 PostgreSQL / 镜像矩阵 / Chrome ARM64 / Windows 专项，不产生 required 汇总。
  draft-fast:
    runs-on: ubuntu-24.04
    needs: changes
    if: always() && !cancelled() && needs.changes.outputs.mode == 'draft-fast'
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Release recovery evidence regressions
        run: node --test agent-harness/release-resume.test.mjs agent-harness/platform-signature-publication.test.mjs agent-harness/egress-prepull.test.mjs

      - name: Workspace typecheck
        run: pnpm -r typecheck

      # Suites import workspace packages through their built dist (for example
      # @deepsonar/shared-types), exactly like the full gate does after build.
      - name: Workspace build
        run: pnpm -r build

      - name: Mapped no-service unit suites
        env:
          FAST_SUITES: ${{ needs.changes.outputs.fast_suites }}
        run: |
          set -euo pipefail
          if [ -z "${FAST_SUITES:-}" ]; then
            echo "no fast suite matched this diff"
            exit 0
          fi
          IFS=',' read -r -a suites <<< "$FAST_SUITES"
          for suite in "${suites[@]}"; do
            [ -n "$suite" ] || continue
            echo "::group::$suite"
            pnpm "$suite"
            echo "::endgroup::"
          done

  # Draft 只发非 required 预览；不允许用同名 ci-summary 冒充可合并。
  ci-preview:
    runs-on: ubuntu-latest
    needs: [changes, draft-fast]
    if: always() && needs.changes.outputs.mode == 'draft-fast'
    timeout-minutes: 5
    steps:
      - name: Draft preview (not a merge gate)
        env:
          PLAN: ${{ needs.changes.result }}
          PLAN_STATUS: ${{ needs.changes.outputs.plan_status }}
          FAST: ${{ needs.draft-fast.result }}
          REASONS: ${{ needs.changes.outputs.reasons }}
          FAST_SUITES: ${{ needs.changes.outputs.fast_suites }}
        run: |
          set -euo pipefail
          echo "plan=$PLAN plan_status=$PLAN_STATUS fast=draft-fast:$FAST"
          echo "reasons=$REASONS"
          echo "fast_suites=${FAST_SUITES:-none}"
          [ "$PLAN" = "success" ] || { echo "::error::run plan did not succeed: $PLAN"; exit 1; }
          [ "$PLAN_STATUS" = "ok" ] || { echo "::error::run plan failed; a Draft still fails closed: $PLAN_STATUS"; exit 1; }
          [ "$FAST" = "success" ] || { echo "::error::draft fast checks did not succeed: $FAST"; exit 1; }
          echo "Draft fast checks passed. Ready for review switches to full acceptance."

  # 稳定的 required 汇总检查：显式核对分类器、文档门禁与应运行的重活结果。
  # 不用 echo success 占位；「跳过」与「失败」必须区分，避免 docs-only 掩盖真实失败。
  ci-summary:
    # Draft runs emit ci-preview instead of ci-summary. Note: GitHub counts a
    # SKIPPED required check as satisfied, so skipping ci-summary does not itself
    # block a Draft merge; blocking Draft merges must come from policy (ruleset /
    # separate required check), not from this workflow's skip.
    if: always() && needs.changes.outputs.mode != 'draft-fast'
    needs: [changes, docs-freshness, windows-upgrade-backend, crash-recovery, lexical-pressure, pi-om-growth, gate-contract, gate-db-core, gate-db-domain, gate-e2e, runtime-images, chrome-fuzz-arm64-build, chrome-fuzz-arm64]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Verify required results
        env:
          CHANGES: ${{ needs.changes.result }}
          MODE: ${{ needs.changes.outputs.mode }}
          PLAN_STATUS: ${{ needs.changes.outputs.plan_status }}
          DOCS_ONLY: ${{ needs.changes.outputs.docs_only }}
          DOCS: ${{ needs.docs-freshness.result }}
          WINDOWS: ${{ needs.windows-upgrade-backend.result }}
          CRASH: ${{ needs.crash-recovery.result }}
          LEXICAL: ${{ needs.lexical-pressure.result }}
          PIOM: ${{ needs.pi-om-growth.result }}
          GATE_CONTRACT: ${{ needs.gate-contract.result }}
          GATE_DB_CORE: ${{ needs.gate-db-core.result }}
          GATE_DB_DOMAIN: ${{ needs.gate-db-domain.result }}
          GATE_E2E: ${{ needs.gate-e2e.result }}
          IMAGES: ${{ needs.runtime-images.result }}
          FUZZ_BUILD: ${{ needs.chrome-fuzz-arm64-build.result }}
          FUZZ: ${{ needs.chrome-fuzz-arm64.result }}
          FUZZ_ARM_REQUIRED: ${{ needs.changes.outputs.chrome_fuzz_arm }}
        run: |
          set -euo pipefail
          fail() { echo "::error::$1"; exit 1; }

          [ "$CHANGES" = "success" ] || fail "changes classifier did not succeed: $CHANGES"
          [[ "$DOCS_ONLY" == "true" || "$DOCS_ONLY" == "false" ]] || fail "missing or invalid classifier output"
          # #836: only the ready-full and docs tiers may report a merge verdict.
          case "$MODE" in
            ready-full|docs) ;;
            *) fail "ci-summary ran outside the ready-full/docs tier: ${MODE:-<empty>}" ;;
          esac
          [ "$PLAN_STATUS" = "ok" ] || fail "run plan did not succeed: ${PLAN_STATUS:-<empty>}"
          if [ "$MODE" = "docs" ] && [ "$DOCS_ONLY" != "true" ]; then fail "docs tier reported docs_only=$DOCS_ONLY"; fi

          [ "$DOCS" = "success" ] || fail "docs-freshness did not succeed: $DOCS"

          check_heavy() {
            local name="$1" result="$2"
            if [ "$DOCS_ONLY" = "true" ]; then
              [ "$result" = "skipped" ] || fail "$name must be skipped for docs-only changes, got: $result"
            else
              [ "$result" = "success" ] || fail "$name did not succeed: $result"
            fi
          }

          # #961: ARM Chrome Fuzz 只在计划判定 required 时必跑。跳过必须来自计划
          # （chrome_fuzz_arm=skipped），失败/取消永远不能放行。
          [[ "$FUZZ_ARM_REQUIRED" == "required" || "$FUZZ_ARM_REQUIRED" == "skipped" ]] || fail "missing or invalid chrome_fuzz_arm output: ${FUZZ_ARM_REQUIRED:-<empty>}"
          check_planned() {
            local name="$1" result="$2"
            case "$result" in
              failure|cancelled) fail "$name did not complete cleanly: $result" ;;
            esac
            if [ "$FUZZ_ARM_REQUIRED" = "required" ]; then
              [ "$result" = "success" ] || fail "$name is required by the run plan but got: $result"
            else
              # 计划判定无需 ARM 时必须是 skipped：真的跑了说明计划与运行不一致，同样 fail closed。
              [ "$result" = "skipped" ] || fail "$name ran even though the run plan skipped it: $result"
            fi
          }

          # 必须逐片 success，不能只靠聚合结果：4 个分片各自是独立门禁。
          # 显式期望矩阵校验：分片缺失/变量为空/结果值未知一律 fail closed。
          EXPECTED_GATE_SHARDS="gate-contract gate-db-core gate-db-domain gate-e2e"
          KNOWN_GATE_RESULTS="success failure cancelled skipped timed_out neutral"
          for shard in $EXPECTED_GATE_SHARDS; do
            case "$shard" in
              gate-contract) shard_result="${GATE_CONTRACT:-}" ;;
              gate-db-core) shard_result="${GATE_DB_CORE:-}" ;;
              gate-db-domain) shard_result="${GATE_DB_DOMAIN:-}" ;;
              gate-e2e) shard_result="${GATE_E2E:-}" ;;
              *) fail "unknown gate shard in expected matrix: $shard" ;;
            esac
            [ -n "$shard_result" ] || fail "missing result for gate shard: $shard"
            case " $KNOWN_GATE_RESULTS " in
              *" $shard_result "*) ;;
              *) fail "unknown result value for gate shard $shard: $shard_result" ;;
            esac
          done

          check_heavy windows-upgrade-backend "$WINDOWS"
          check_heavy crash-recovery "$CRASH"
          check_heavy lexical-pressure "$LEXICAL"
          check_heavy pi-om-growth "$PIOM"
          check_heavy gate-contract "$GATE_CONTRACT"
          check_heavy gate-db-core "$GATE_DB_CORE"
          check_heavy gate-db-domain "$GATE_DB_DOMAIN"
          check_heavy gate-e2e "$GATE_E2E"
          check_heavy runtime-images "$IMAGES"
          check_planned chrome-fuzz-arm64-build "$FUZZ_BUILD"
          check_planned chrome-fuzz-arm64 "$FUZZ"

          if [ "$DOCS_ONLY" = "true" ]; then
            echo "docs-only change: docs-freshness passed; heavy jobs skipped as expected"
          elif [ "$FUZZ_ARM_REQUIRED" = "skipped" ]; then
            echo "full run: docs-freshness and heavy jobs passed; Chrome Fuzz ARM skipped by the run plan (inputs unchanged)"
          else
            echo "full run: docs-freshness and all heavy jobs passed"
          fi
