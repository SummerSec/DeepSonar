name: ci

# P0 门禁：typecheck + build + dist 启动 + fake 模式业务冒烟
# - control MCP 协议（无服务）
# - roles / hub-loop / local-project API
# - auth（独立 3101 进程，AUTH_REQUIRED=true）
#
# 触发策略（避免每个 push 都跑全量）：
# - pull_request：开/更新 PR 时跑（功能分支日常推送不单独跑）
# - push@main：合并进主干后再跑一遍；纯文档改动跳过
# - workflow_dispatch：手动补跑
on:
  pull_request:
  push:
    branches: [main]
    paths-ignore:
      - "**/*.md"
      - "docs/**"
      - "skills/**"
      - "LICENSE"
      - "THIRD_PARTY_NOTICES.md"
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  DATABASE_URL: postgres://deepsonar:deepsonar-ci-pass@127.0.0.1:5432/deepsonar
  DEEPSONAR_BASE: http://127.0.0.1:3100
  AGENT_MODE: fake
  DEEPSONAR_HUB_ENABLED: "false"

permissions:
  contents: read
  packages: read

jobs:
  gate:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: deepsonar
          POSTGRES_PASSWORD: deepsonar-ci-pass
          POSTGRES_DB: deepsonar
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U deepsonar -d deepsonar"
          --health-interval 5s --health-timeout 3s --health-retries 20
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Install PostgreSQL client
        run: sudo apt-get update && sudo apt-get install -y postgresql-client

      - run: pnpm install --frozen-lockfile

      - name: Runtime image definition consistency
        run: pnpm ci:images

      - name: Runtime image registry contract unit
        run: pnpm ci:unit:runtime-images

      - name: Runtime resource cleanup and disk pressure unit
        run: pnpm ci:unit:runtime-cleanup

      - name: Image admission registry selection unit
        run: pnpm ci:unit:image-admission

      - name: Runtime image destination evidence unit
        run: pnpm ci:unit:runtime-image-record

      - name: Runtime image registry generator compatibility
        run: pnpm ci:unit:runtime-registry

      - name: Runtime image promotion reconciliation (channel-only v2 fixture)
        env:
          TEST_DATABASE_URL: ${{ env.DATABASE_URL }}
        run: pnpm ci:integration:runtime-image-promotions

      - run: pnpm -r typecheck

      - run: pnpm -r build

      - name: Scheduler startup gate unit
        run: pnpm ci:unit:startup-gate

      - name: Scheduler public Job role enablement gate
        run: pnpm --filter @deepsonar/scheduler exec tsx --test src/domains/job-control/routes.test.ts

      - name: Scheduler Job lifecycle characterization
        run: pnpm ci:unit:job-lifecycle

      - name: Scheduler Job lifecycle PostgreSQL integration
        env:
          TEST_DATABASE_URL: ${{ env.DATABASE_URL }}
        run: pnpm ci:integration:job-lifecycle

      - name: Scheduler orphan recovery evidence unit
        run: pnpm ci:unit:recovery

      - name: Scheduler orphan recovery PostgreSQL integration
        env:
          TEST_DATABASE_URL: ${{ env.DATABASE_URL }}
          DEEPSONAR_HUB_ENABLED: "true"
        run: pnpm ci:integration:recovery

      - name: Scheduler bounded-context characterization guardrails
        run: pnpm ci:unit:scheduler-characterization

      - name: Authenticated report download web unit
        run: pnpm ci:unit:web-report-download

      - name: Projects intent launch web unit
        run: pnpm ci:unit:web-quick-start

      - name: Canvas Fact workbench web unit
        run: pnpm ci:unit:web-facts

      - name: Agent Session viewer web unit
        run: pnpm ci:unit:web-session-viewer

      - name: Report download OpenAPI unit
        run: pnpm ci:unit:report-download-openapi

      - name: Authenticated report download Fastify integration
        env:
          TEST_DATABASE_URL: ${{ env.DATABASE_URL }}
        run: pnpm ci:integration:report-download

      - name: Per-Finding report PostgreSQL integration
        env:
          TEST_DATABASE_URL: ${{ env.DATABASE_URL }}
        run: pnpm ci:integration:finding-report

      - name: Finding protocol and CVSS unit
        run: pnpm ci:unit:finding-protocol

      - name: Finding protocol PostgreSQL integration
        env:
          TEST_DATABASE_URL: ${{ env.DATABASE_URL }}
        run: pnpm ci:integration:finding-protocol

      - name: Shared assets contract unit
        run: pnpm ci:unit:shared-assets

      - name: Shared assets PostgreSQL and API integration
        env:
          TEST_DATABASE_URL: ${{ env.DATABASE_URL }}
        run: pnpm ci:integration:shared-assets

      - name: Shared assets real Docker read-only volume
        env:
          RUN_DOCKER_SHARED_ASSETS_TEST: "1"
        run: pnpm ci:integration:shared-assets-volume

      - name: Incremental migration chain (fresh, v12 upgrade, rollback/retry, concurrency)
        env:
          TEST_DATABASE_URL: ${{ env.DATABASE_URL }}
        run: pnpm ci:unit:migrations

      - name: Role color unit and projection tests
        run: pnpm ci:unit:role-colors

      - name: Role color Postgres/API integration
        env:
          TEST_DATABASE_URL: ${{ env.DATABASE_URL }}
        run: pnpm ci:integration:role-colors

      - name: Dispatcher claim Postgres integration
        env:
          TEST_DATABASE_URL: ${{ env.DATABASE_URL }}
        run: pnpm ci:integration:dispatch-limits

      - name: Event ingestion Canvas-first Postgres integration
        env:
          TEST_DATABASE_URL: ${{ env.DATABASE_URL }}
        run: pnpm ci:integration:event-ingestion

      - name: Semantic event authorization Postgres integration
        env:
          TEST_DATABASE_URL: ${{ env.DATABASE_URL }}
        run: pnpm ci:integration:event-authorization

      - name: Semantic event rate-limit unit
        run: pnpm ci:unit:event-rate-limit

      - name: Login brute-force rate-limit unit
        run: pnpm ci:unit:login-rate-limit

      - name: Windows deploy.ps1 encoding and pull semantics
        run: pnpm ci:unit:deploy-ps1

      - name: Semantic event rate-limit Postgres integration
        env:
          TEST_DATABASE_URL: ${{ env.DATABASE_URL }}
        run: pnpm ci:integration:event-rate-limit

      - name: Hub graph reference unit
        run: pnpm ci:unit:graph-references

      - name: Hub graph reference Postgres integration
        env:
          TEST_DATABASE_URL: ${{ env.DATABASE_URL }}
        run: pnpm ci:integration:graph-references

      - name: Compose task unit
        run: pnpm ci:unit:compose-tasks

      - name: Searchable dropdown unit and adoption guard
        run: pnpm ci:unit:searchable-selects

      - name: Compose task PostgreSQL integration
        env:
          TEST_DATABASE_URL: ${{ env.DATABASE_URL }}
        run: pnpm ci:integration:compose-tasks

      - name: Canvas lifecycle projection Postgres integration
        env:
          TEST_DATABASE_URL: ${{ env.DATABASE_URL }}
        run: pnpm ci:integration:canvas-lifecycle

      - name: Verify eligibility unit
        run: pnpm ci:unit:verify-eligibility

      - name: Canvas Fact contract unit
        run: pnpm ci:unit:canvas-facts

      - name: Canvas Fact and manual verification PostgreSQL integration
        env:
          TEST_DATABASE_URL: ${{ env.DATABASE_URL }}
        run: pnpm ci:integration:canvas-facts

      - name: Real executor fact verification unit
        run: pnpm ci:unit:executor-real

      - name: Credential and CLI compatibility unit
        run: pnpm ci:unit:credential-compatibility

      - name: Credential delete PostgreSQL integration
        env:
          TEST_DATABASE_URL: ${{ env.DATABASE_URL }}
        run: pnpm ci:integration:credential-delete

      - name: Runtime sandbox semantic tool unit
        run: pnpm ci:unit:runtime-sandbox

      - name: Platform API Job capability PostgreSQL integration
        env:
          TEST_DATABASE_URL: ${{ env.DATABASE_URL }}
        run: pnpm ci:integration:platform-api

      - name: Default human admin and account integration
        env:
          TEST_DATABASE_URL: ${{ env.DATABASE_URL }}
        run: pnpm ci:integration:users-auth

      - name: Login brute-force rate-limit Postgres integration
        env:
          TEST_DATABASE_URL: ${{ env.DATABASE_URL }}
        run: pnpm ci:integration:login-rate-limit

      - name: Convergence recovery Postgres integration
        env:
          TEST_DATABASE_URL: ${{ env.DATABASE_URL }}
          DEEPSONAR_HUB_ENABLED: "true"
        run: pnpm ci:integration:convergence-recovery

      - name: Verify eligibility Postgres integration
        env:
          TEST_DATABASE_URL: ${{ env.DATABASE_URL }}
          DEEPSONAR_HUB_ENABLED: "true"
        run: pnpm ci:integration:verify-eligibility

      - name: Job 控制 API-only 契约冒烟
        run: pnpm --filter @deepsonar/scheduler exec tsx ../../agent-harness/test-control-mcp.ts

      - name: Runtime test policy smoke
        run: pnpm ci:smoke:runtime-policy

      - name: Scheduler convergence regression
        run: pnpm ci:smoke:convergence

      - name: Start scheduler (fake, no auth)
        env:
          AGENT_MODE: fake
          SCHEDULER_PORT: "3100"
          SCHEDULER_HOST: "127.0.0.1"
          DEEPSONAR_HUB_ENABLED: "false"
        run: |
          node apps/scheduler/dist/index.js > /tmp/scheduler-3100.log 2>&1 &
          echo $! > /tmp/scheduler-3100.pid
          for i in $(seq 1 60); do
            curl -sf http://127.0.0.1:3100/health && exit 0
            sleep 1
          done
          echo "scheduler failed to become healthy" >&2
          cat /tmp/scheduler-3100.log >&2
          exit 1

      - name: Roles API smoke
        env:
          DEEPSONAR_EXPECT_HUB_ENABLED: "false"
        run: python agent-harness/test-roles-api.py

      - name: Runtime image marketplace API smoke
        run: python agent-harness/test-runtime-images-api.py

      - name: Hub loop smoke
        env:
          DEEPSONAR_HUB_SMOKE_TIMEOUT: "300"
        run: python agent-harness/test-hub-loop.py

      - name: Local project / task API smoke
        run: python agent-harness/test-local-project-api.py

      - name: Start scheduler (auth required)
        env:
          AGENT_MODE: fake
          SCHEDULER_PORT: "3101"
          SCHEDULER_HOST: "127.0.0.1"
          DEEPSONAR_AUTH_REQUIRED: "true"
          DEEPSONAR_ADMIN_TOKEN: boot-secret
          DEEPSONAR_HUB_ENABLED: "false"
        run: |
          node apps/scheduler/dist/index.js > /tmp/scheduler-3101.log 2>&1 &
          echo $! > /tmp/scheduler-3101.pid
          for i in $(seq 1 60); do
            curl -sf http://127.0.0.1:3101/health && exit 0
            sleep 1
          done
          echo "auth scheduler failed to become healthy" >&2
          cat /tmp/scheduler-3101.log >&2
          exit 1

      - name: Auth API smoke
        env:
          DEEPSONAR_BASE: http://127.0.0.1:3101
          DEEPSONAR_ADMIN_TOKEN: boot-secret
        run: python agent-harness/test-auth-api.py

      - name: Dump scheduler logs on failure
        if: failure()
        run: |
          echo "===== scheduler :3100 ====="
          cat /tmp/scheduler-3100.log 2>/dev/null || true
          echo "===== scheduler :3101 ====="
          cat /tmp/scheduler-3101.log 2>/dev/null || true

  runtime-images:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - toolset: base
            dockerfile: deploy/Dockerfile.agent
            build_args: TOOLSET=base
            config: agent-harness/runtime-images.json
          - toolset: audit
            dockerfile: deploy/Dockerfile.agent
            build_args: TOOLSET=audit
            config: agent-harness/runtime-images.json
          - toolset: kali-minimal
            dockerfile: deploy/Dockerfile.agent-kali-minimal
            build_args: ""
            config: agent-harness/kali-minimal-runtime.json
    steps:
      - uses: actions/checkout@v4
      - id: ns
        name: GHCR namespace
        shell: bash
        run: |
          set -euo pipefail
          owner="${GITHUB_REPOSITORY_OWNER,,}"
          printf 'owner=%s\n' "$owner" >> "$GITHUB_OUTPUT"
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: fingerprint
        name: Build fingerprint
        shell: bash
        run: |
          set -euo pipefail
          # 与 release 相同 preset/platforms，便于复用 GHCR src-* 多架构产物；CI 只 pull amd64 做冒烟
          node agent-harness/image-build-fingerprint.mjs --preset "deepsonar-${{ matrix.toolset }}"
      - id: resolve
        name: Resolve src cache
        shell: bash
        env:
          IMAGE_NAME: ghcr.io/${{ steps.ns.outputs.owner }}/deepsonar-${{ matrix.toolset }}
          FINGERPRINT: ${{ steps.fingerprint.outputs.fingerprint }}
          SRC_TAG: ${{ steps.fingerprint.outputs.src_tag }}
        run: bash agent-harness/resolve-image-src-cache.sh resolve
      - name: Record reused image
        if: ${{ steps.resolve.outputs.skip == 'true' }}
        run: |
          set -euo pipefail
          echo "${{ matrix.toolset }} build unchanged: reused previously validated immutable src cache" >> "$GITHUB_STEP_SUMMARY"
      - name: Free disk for Kali toolchain image
        if: ${{ matrix.toolset == 'kali-minimal' && steps.resolve.outputs.skip != 'true' }}
        run: |
          set -euo pipefail
          sudo rm -rf \
            /usr/local/lib/android \
            /usr/share/dotnet \
            /opt/ghc \
            /usr/local/share/boost \
            /usr/share/swift \
            /usr/local/.ghcup \
            /opt/hostedtoolcache/CodeQL \
            /opt/hostedtoolcache/go \
            /opt/hostedtoolcache/Java_Temurin-Hotspot_jdk \
            "$AGENT_TOOLSDIRECTORY" 2>/dev/null || true
          sudo docker system prune -af || true
          docker system df || true
          df -h /
      - name: Set up Buildx for image build
        if: ${{ steps.resolve.outputs.skip != 'true' }}
        uses: docker/setup-buildx-action@v3
      - name: Build official runtime
        if: ${{ steps.resolve.outputs.skip != 'true' }}
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          load: true
          tags: deepsonar-${{ matrix.toolset }}:ci
          build-args: ${{ matrix.build_args }}
          # Registry cache 扛大层；ignore-error 避免 fork PR 无 packages:write 时失败
          # 不 pin 多架构 src-*（CI 仅 amd64，避免覆盖 release 的 multi-arch index）
          cache-from: |
            type=registry,ref=ghcr.io/${{ steps.ns.outputs.owner }}/deepsonar-${{ matrix.toolset }}:buildcache-ci
            type=registry,ref=ghcr.io/${{ steps.ns.outputs.owner }}/deepsonar-${{ matrix.toolset }}:${{ steps.fingerprint.outputs.src_tag }}
            type=gha,scope=runtime-${{ matrix.toolset }}
          cache-to: |
            type=registry,ref=ghcr.io/${{ steps.ns.outputs.owner }}/deepsonar-${{ matrix.toolset }}:buildcache-ci,mode=max,ignore-error=true
            type=gha,mode=max,scope=runtime-${{ matrix.toolset }}
      - name: Load reused base runtime for CLI boot smokes
        if: ${{ matrix.toolset == 'base' && steps.resolve.outputs.skip == 'true' }}
        env:
          SOURCE_IMAGE: ${{ steps.resolve.outputs.src_ref }}
        run: |
          set -euo pipefail
          test -n "$SOURCE_IMAGE"
          docker pull "$SOURCE_IMAGE"
          docker tag "$SOURCE_IMAGE" deepsonar-base:ci
          docker image inspect deepsonar-base:ci >/dev/null
      - name: Offline hardened smoke
        if: ${{ steps.resolve.outputs.skip != 'true' }}
        run: node agent-harness/test-runtime-image.mjs deepsonar-${{ matrix.toolset }}:ci ${{ matrix.toolset }} ${{ matrix.config }}
      - name: Pi RPC real Docker smoke
        if: ${{ matrix.toolset == 'base' }}
        run: |
          set -o pipefail
          node agent-harness/test-pi-rpc.mjs deepsonar-base:ci 2>&1 | tee /tmp/pi-rpc-smoke.log || {
            detail="$(tail -c 8000 /tmp/pi-rpc-smoke.log | tr '\n' ' ')"
            echo "::error title=Pi RPC real Docker smoke::${detail}"
            exit 1
          }
      - name: DSH Cordis real Docker boot smoke
        if: ${{ matrix.toolset == 'base' }}
        shell: bash
        run: |
          set -euo pipefail
          node agent-harness/test-dsh-cordis.mjs deepsonar-base:ci \
            2> >(tee /tmp/dsh-cordis-smoke.stderr >&2) || {
            detail="$(tail -c 8192 /tmp/dsh-cordis-smoke.stderr | tr '\n' ' ')"
            echo "::error title=DSH Cordis real Docker boot smoke::${detail}"
            exit 1
          }
      - name: Maven online package smoke
        if: ${{ matrix.toolset == 'kali-minimal' && steps.resolve.outputs.skip != 'true' }}
        run: node agent-harness/test-maven-package.mjs deepsonar-kali-minimal:ci

  # 在 PR/main 门禁保留 V8 arm64 交叉工具链回归。V8 使用固定的 x86_64 Clang
  # 编译，QEMU 只负责组装 arm64 运行时；真实 d8/libFuzzer 冒烟在依赖的 arm64 作业中原生执行。
  chrome-fuzz-arm64-build:
    runs-on: ubuntu-latest
    timeout-minutes: 240
    permissions:
      contents: read
      packages: write
    outputs:
      owner: ${{ steps.ns.outputs.owner }}
      digest: ${{ steps.image.outputs.digest }}
    steps:
      - uses: actions/checkout@v4
      - id: ns
        name: GHCR namespace
        shell: bash
        run: |
          set -euo pipefail
          owner="${GITHUB_REPOSITORY_OWNER,,}"
          printf 'owner=%s\n' "$owner" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: base-image
        name: Resolve immutable base image digest
        shell: bash
        run: |
          set -euo pipefail
          base_ref=ghcr.io/summersec/deepsonar-base:latest
          digest="$(docker buildx imagetools inspect "$base_ref" --format '{{.Manifest.Digest}}' 2>/dev/null || true)"
          if [[ ! "$digest" =~ ^sha256:[0-9a-f]{64}$ ]]; then
            digest="$(docker buildx imagetools inspect "$base_ref" 2>/dev/null \
              | sed -nE 's/^[[:space:]]*Digest:[[:space:]]*(sha256:[0-9a-f]{64}).*/\1/p' \
              | head -n1)"
          fi
          [[ "$digest" =~ ^sha256:[0-9a-f]{64}$ ]]
          printf 'ref=%s@%s\n' "${base_ref%:*}" "$digest" >> "$GITHUB_OUTPUT"
      - id: fingerprint
        name: Build fingerprint
        shell: bash
        run: |
          set -euo pipefail
          node agent-harness/image-build-fingerprint.mjs \
            --preset deepsonar-chrome-fuzz \
            --platforms linux/arm64 \
            --build-arg "BASE_IMAGE=${{ steps.base-image.outputs.ref }}"
      - id: resolve
        name: Resolve src cache
        shell: bash
        env:
          IMAGE_NAME: ghcr.io/${{ steps.ns.outputs.owner }}/deepsonar-chrome-fuzz
          FINGERPRINT: ${{ steps.fingerprint.outputs.fingerprint }}
          SRC_TAG: ${{ steps.fingerprint.outputs.src_tag }}
        run: bash agent-harness/resolve-image-src-cache.sh resolve
      - name: Record reused Chrome Fuzz image
        if: ${{ steps.resolve.outputs.skip == 'true' }}
        run: |
          set -euo pipefail
          echo "Chrome Fuzz arm64 build unchanged: reusing immutable src cache" >> "$GITHUB_STEP_SUMMARY"
      - id: build
        name: Build Chrome Fuzz arm64 by digest
        if: ${{ steps.resolve.outputs.skip != 'true' }}
        uses: docker/build-push-action@v6
        with:
          context: .
          file: deploy/Dockerfile.agent-chrome-fuzz
          platforms: linux/arm64
          outputs: type=image,name=ghcr.io/${{ steps.ns.outputs.owner }}/deepsonar-chrome-fuzz,push-by-digest=true,name-canonical=true,push=true
          build-args: BASE_IMAGE=${{ steps.base-image.outputs.ref }}
          provenance: mode=max
          sbom: true
          cache-from: |
            type=registry,ref=ghcr.io/${{ steps.ns.outputs.owner }}/deepsonar-chrome-fuzz:buildcache-arm64
            type=registry,ref=ghcr.io/${{ steps.ns.outputs.owner }}/deepsonar-chrome-fuzz:${{ steps.fingerprint.outputs.src_tag }}
            type=gha,scope=chrome-fuzz-arm64
          cache-to: |
            type=registry,ref=ghcr.io/${{ steps.ns.outputs.owner }}/deepsonar-chrome-fuzz:buildcache-arm64,mode=max,ignore-error=true
            type=gha,mode=max,scope=chrome-fuzz-arm64
      - id: image
        name: Resolve immutable Chrome Fuzz digest and pin src cache
        shell: bash
        env:
          IMAGE_NAME: ghcr.io/${{ steps.ns.outputs.owner }}/deepsonar-chrome-fuzz
          FINGERPRINT: ${{ steps.fingerprint.outputs.fingerprint }}
          SRC_TAG: ${{ steps.fingerprint.outputs.src_tag }}
          SKIP: ${{ steps.resolve.outputs.skip }}
          REUSE_DIGEST: ${{ steps.resolve.outputs.digest }}
          BUILD_DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          set -euo pipefail
          if [[ "$SKIP" == "true" ]]; then
            digest="$REUSE_DIGEST"
          else
            digest="$BUILD_DIGEST"
            DIGEST="$digest" bash agent-harness/resolve-image-src-cache.sh pin
          fi
          [[ "$digest" =~ ^sha256:[0-9a-f]{64}$ ]]
          printf 'digest=%s\n' "$digest" >> "$GITHUB_OUTPUT"
  # QEMU 可以组装交叉构建的镜像，但不是 ASan 插桩 V8 冒烟的可靠执行环境。
  # 该门禁固定使用原生 runner，成功结果才能证明真实 arm64 d8/libFuzzer 运行时可用。
  chrome-fuzz-arm64:
    needs: chrome-fuzz-arm64-build
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 30
    permissions:
      contents: read
      packages: read
    steps:
      - uses: actions/checkout@v4
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: 原生执行 Chrome Fuzz 不可变 digest 冒烟
        env:
          IMAGE_NAME: ghcr.io/${{ needs.chrome-fuzz-arm64-build.outputs.owner }}/deepsonar-chrome-fuzz
          DIGEST: ${{ needs.chrome-fuzz-arm64-build.outputs.digest }}
        run: |
          set -euo pipefail
          image_ref="${IMAGE_NAME}@${DIGEST}"
          [[ "$DIGEST" =~ ^sha256:[0-9a-f]{64}$ ]]
          docker pull --platform linux/arm64 "$image_ref"
          node agent-harness/test-chrome-runtime.mjs "$image_ref" chrome-fuzz agent-harness/chrome-fuzz-runtime.json linux/arm64
