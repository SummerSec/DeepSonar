name: openharmony-runtime

on:
  # #836: Draft/Ready is the developer switch. GitHub's default pull_request
  # activity types are only opened/synchronize/reopened, so a same-SHA Draft ->
  # Ready transition would otherwise never re-plan or run this matrix.
  pull_request:
    paths:
      - "deploy/Dockerfile.agent-openharmony"
      - "deploy/Dockerfile.agent-openharmony-*"
      - "deploy/openharmony-*.sh"
      - "deploy/vendor/gitcode-repo-py3"
      - "deploy/vendor/openharmony-hdc/**"
      - "agent-harness/openharmony-test-runtime.json"
      - "agent-harness/test-openharmony-hdc.mjs"
      - "agent-harness/test-openharmony-fuzz-runtime.mjs"
      - "agent-harness/runtime-manuals/**"
      - "agent-harness/materialize-runtime-manuals.mjs"
      - "agent-harness/test-runtime-manuals.mjs"
      - "agent-harness/test-runtime-manuals-runtime.mjs"
      - ".dockerignore"
      - "agent-harness/image-build-fingerprint.mjs"
      - "agent-harness/resolve-image-src-cache.sh"
      - ".github/workflows/openharmony-runtime.yml"
    types: [opened, reopened, synchronize, ready_for_review, converted_to_draft]
  push:
    branches: [main]
    paths:
      - "deploy/Dockerfile.agent-openharmony"
      - "deploy/Dockerfile.agent-openharmony-*"
      - "deploy/openharmony-*.sh"
      - "deploy/vendor/gitcode-repo-py3"
      - "deploy/vendor/openharmony-hdc/**"
      - "agent-harness/openharmony-test-runtime.json"
      - "agent-harness/test-openharmony-hdc.mjs"
      - "agent-harness/test-openharmony-fuzz-runtime.mjs"
      - "agent-harness/runtime-manuals/**"
      - "agent-harness/materialize-runtime-manuals.mjs"
      - "agent-harness/test-runtime-manuals.mjs"
      - "agent-harness/test-runtime-manuals-runtime.mjs"
      - ".dockerignore"
      - "agent-harness/image-build-fingerprint.mjs"
      - "agent-harness/resolve-image-src-cache.sh"
      - ".github/workflows/openharmony-runtime.yml"
  workflow_dispatch:

concurrency:
  group: openharmony-runtime-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  # #836: same run plan as ci.yml (one shared script, not five copies). A Draft
  # PR gets its fast checks from ci.yml, so specialists only start their heavy
  # matrices for the ready-for-review candidate, push@main, or a manual run.
  plan:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      mode: ${{ steps.plan.outputs.mode }}
      reasons: ${{ steps.plan.outputs.reasons }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - id: plan
        env:
          EVENT_NAME: ${{ github.event_name }}
          PR_BASE: ${{ github.event.pull_request.base.sha }}
          PR_HEAD: ${{ github.event.pull_request.head.sha }}
          PR_DRAFT: ${{ github.event.pull_request.draft }}
          CI_PR_MODE: ${{ vars.CI_PR_MODE }}
        run: |
          node agent-harness/ci-run-plan.mjs \
            --event-name "$EVENT_NAME" \
            --base "${PR_BASE:-}" \
            --head "${PR_HEAD:-}" \
            --draft "${PR_DRAFT:-false}" \
            --ci-pr-mode "${CI_PR_MODE:-}" \
            --root .

  openharmony-runtime-images:
    needs: plan
    if: always() && !cancelled() && needs.plan.outputs.mode == 'ready-full'
    runs-on: ${{ matrix.toolset == 'openharmony-fuzz' && matrix.arch == 'arm64' && 'ubuntu-24.04-arm' || 'ubuntu-latest' }}
    timeout-minutes: 45
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - toolset: openharmony-test
            dockerfile: deploy/Dockerfile.agent-openharmony
            check: openharmony-env.sh
            check_args: --check --hdc
            platform: linux/amd64
            arch: amd64
          - toolset: openharmony-test
            dockerfile: deploy/Dockerfile.agent-openharmony
            check: openharmony-env.sh
            check_args: --check --hdc
            platform: linux/arm64
            arch: arm64
          - toolset: openharmony-audit
            dockerfile: deploy/Dockerfile.agent-openharmony-audit
            check: openharmony-audit-env.sh
            check_args: --check
            platform: linux/amd64
            arch: amd64
          - toolset: openharmony-audit
            dockerfile: deploy/Dockerfile.agent-openharmony-audit
            check: openharmony-audit-env.sh
            check_args: --check
            platform: linux/arm64
            arch: arm64
          - toolset: openharmony-fuzz
            dockerfile: deploy/Dockerfile.agent-openharmony-fuzz
            check: openharmony-fuzz-env.sh
            check_args: --check
            platform: linux/amd64
            arch: amd64
          - toolset: openharmony-fuzz
            dockerfile: deploy/Dockerfile.agent-openharmony-fuzz
            check: openharmony-fuzz-env.sh
            check_args: --check
            platform: linux/arm64
            arch: arm64
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - id: ns
        name: GHCR namespace
        shell: bash
        run: |
          set -euo pipefail
          owner="${GITHUB_REPOSITORY_OWNER,,}"
          printf 'owner=%s\n' "$owner" >> "$GITHUB_OUTPUT"
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: base-image
        name: Resolve immutable base image digest
        shell: bash
        run: |
          set -euo pipefail
          base_ref=ghcr.io/summersec/deepsonar-base:latest
          digest="$(docker buildx imagetools inspect "$base_ref" --format '{{.Manifest.Digest}}' 2>/dev/null || true)"
          if [[ ! "$digest" =~ ^sha256:[0-9a-f]{64}$ ]]; then
            digest="$(docker buildx imagetools inspect "$base_ref" 2>/dev/null \
              | sed -nE 's/^[[:space:]]*Digest:[[:space:]]*(sha256:[0-9a-f]{64}).*/\1/p' \
              | head -n1)"
          fi
          [[ "$digest" =~ ^sha256:[0-9a-f]{64}$ ]]
          printf 'ref=%s@%s\n' "${base_ref%:*}" "$digest" >> "$GITHUB_OUTPUT"
      - id: fingerprint
        name: Build fingerprint
        shell: bash
        run: |
          set -euo pipefail
          # Keep CI fingerprints separate from release multi-arch src-* tags.
          node agent-harness/image-build-fingerprint.mjs \
            --preset "deepsonar-${{ matrix.toolset }}" \
            --platforms "${{ matrix.platform }}" \
            --build-arg "BASE_IMAGE=${{ steps.base-image.outputs.ref }}"
      - id: resolve
        name: Resolve src cache
        shell: bash
        env:
          IMAGE_NAME: ghcr.io/${{ steps.ns.outputs.owner }}/deepsonar-${{ matrix.toolset }}
          FINGERPRINT: ${{ steps.fingerprint.outputs.fingerprint }}
          SRC_TAG: ${{ steps.fingerprint.outputs.ci_src_tag }}
        run: bash agent-harness/resolve-image-src-cache.sh resolve
      - name: Record reused OpenHarmony image
        if: ${{ steps.resolve.outputs.skip == 'true' }}
        run: |
          set -euo pipefail
          echo "${{ matrix.toolset }} (${{ matrix.arch }}) build unchanged: reusing immutable src cache; manual validation and all applicable Fuzz behavior checks still run" >> "$GITHUB_STEP_SUMMARY"
      - name: Pull reused OpenHarmony image for manual validation
        if: ${{ steps.resolve.outputs.skip == 'true' }}
        run: |
          set -euo pipefail
          docker pull --platform "${{ matrix.platform }}" "${{ steps.resolve.outputs.src_ref }}"
          docker tag "${{ steps.resolve.outputs.src_ref }}" "deepsonar-${{ matrix.toolset }}:${{ matrix.arch }}-ci"
      - name: Set up QEMU for cross-architecture validation
        if: ${{ matrix.toolset != 'openharmony-fuzz' }}
        uses: docker/setup-qemu-action@v3
      - name: Set up Buildx for image build
        if: ${{ steps.resolve.outputs.skip != 'true' }}
        uses: docker/setup-buildx-action@v3
      - name: Build OpenHarmony specialist runtime
        if: ${{ steps.resolve.outputs.skip != 'true' }}
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          load: true
          tags: deepsonar-${{ matrix.toolset }}:${{ matrix.arch }}-ci
          platforms: ${{ matrix.platform }}
          build-args: BASE_IMAGE=${{ steps.base-image.outputs.ref }}
          cache-from: |
            type=registry,ref=ghcr.io/${{ steps.ns.outputs.owner }}/deepsonar-${{ matrix.toolset }}:buildcache-ci-${{ matrix.arch }}
            type=gha,scope=runtime-${{ matrix.toolset }}-${{ matrix.arch }}
          cache-to: |
            type=registry,ref=ghcr.io/${{ steps.ns.outputs.owner }}/deepsonar-${{ matrix.toolset }}:buildcache-ci-${{ matrix.arch }},mode=max,ignore-error=true
            type=gha,mode=max,scope=runtime-${{ matrix.toolset }}-${{ matrix.arch }}
      - name: Offline environment smoke
        if: ${{ matrix.toolset == 'openharmony-fuzz' || steps.resolve.outputs.skip != 'true' }}
        run: docker run --rm --network none deepsonar-${{ matrix.toolset }}:${{ matrix.arch }}-ci ${{ matrix.check }} ${{ matrix.check_args }}
      - name: Native OpenHarmony Fuzz sanitizer regression (fresh and reused images)
        if: ${{ matrix.toolset == 'openharmony-fuzz' }}
        shell: bash
        run: |
          set -euo pipefail
          node agent-harness/test-openharmony-fuzz-runtime.mjs \
            "deepsonar-${{ matrix.toolset }}:${{ matrix.arch }}-ci" \
            --platform "${{ matrix.platform }}" 2>&1 | tee openharmony-fuzz-native.log
      - name: Preserve native sanitizer evidence
        if: ${{ always() && matrix.toolset == 'openharmony-fuzz' }}
        uses: actions/upload-artifact@v4
        with:
          name: openharmony-fuzz-native-${{ matrix.arch }}
          path: openharmony-fuzz-native.log
          if-no-files-found: warn
      - name: Offline runtime manual smoke
        run: node agent-harness/test-runtime-manuals-runtime.mjs deepsonar-${{ matrix.toolset }}:${{ matrix.arch }}-ci --image-key deepsonar-${{ matrix.toolset }} --platform ${{ matrix.platform }}
      - name: Pin single-arch src cache
        if: ${{ steps.resolve.outputs.skip != 'true' }}
        shell: bash
        env:
          IMAGE_NAME: ghcr.io/${{ steps.ns.outputs.owner }}/deepsonar-${{ matrix.toolset }}
          FINGERPRINT: ${{ steps.fingerprint.outputs.fingerprint }}
          SRC_TAG: ${{ steps.fingerprint.outputs.ci_src_tag }}
          LOCAL_TAG: deepsonar-${{ matrix.toolset }}:${{ matrix.arch }}-ci
        run: |
          set -euo pipefail
          # Push a single-architecture src tag for later CI reuse; ignore fork/permission failures.
          docker tag "$LOCAL_TAG" "${IMAGE_NAME}:${SRC_TAG}"
          if docker push "${IMAGE_NAME}:${SRC_TAG}"; then
            echo "pinned ${IMAGE_NAME}:${SRC_TAG}" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "pin skipped/failed for ${IMAGE_NAME}:${SRC_TAG}" >> "$GITHUB_STEP_SUMMARY"
          fi
