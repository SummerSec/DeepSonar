# Illegal Docker fixture for #583: ingress.mode=gateway without nested gateway block.
# Pinned OpenSandbox server schema must reject this before deploy.
[server]
host = "0.0.0.0"
port = 8080
max_sandbox_timeout_seconds = 86400

[log]
level = "INFO"

[runtime]
type = "docker"
execd_image = "docker.io/opensandbox/execd@sha256:c75836c46ef4302afccec182d5d7339eb2f905f51e3d73b7aa17bb76c832526c"

[docker]
network_mode = "bridge"
api_timeout = 180
host_ip = "host.docker.internal"
port_range_min = 40000
port_range_max = 49000
drop_capabilities = ["ALL"]
no_new_privileges = true
pids_limit = 4096

[ingress]
mode = "gateway"

[egress]
image = "docker.io/opensandbox/egress@sha256:a3d30246e557525f3fa44d16226258268cea175532e652822bd1eb4e83e0f54d"
mode = "dns"
disable_ipv6 = true
readiness_timeout_seconds = 30.0

[storage]
allowed_host_paths = []

[store]
type = "sqlite"
path = "/tmp/opensandbox-schema-gate-illegal.db"

[renew_intent]
enabled = false
