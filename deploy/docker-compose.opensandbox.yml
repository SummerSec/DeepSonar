# Phase 2 overlay. Images are immutable digest pins from opensandbox-version.ts.
#   OPEN_SANDBOX_API_KEY=... docker compose -f deploy/docker-compose.opensandbox.yml up
services:
  opensandbox-resource-preflight:
    image: ${OPENSANDBOX_SERVER_IMAGE:-docker.io/opensandbox/server@sha256:25bebdcf1cf7724eb923faecbdbbf82d4038c6ab35c736151574726d14006f30}
    restart: "no"
    network_mode: none
    read_only: true
    cap_drop: [ALL]
    security_opt:
      - no-new-privileges:true
    entrypoint: ["/app/.venv/bin/python3", "/etc/opensandbox/resource-preflight.py"]
    volumes:
      - ./opensandbox/resource-preflight.py:/etc/opensandbox/resource-preflight.py:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro

  opensandbox:
    depends_on:
      opensandbox-resource-preflight:
        condition: service_completed_successfully
    image: ${OPENSANDBOX_SERVER_IMAGE:-docker.io/opensandbox/server@sha256:25bebdcf1cf7724eb923faecbdbbf82d4038c6ab35c736151574726d14006f30}
    container_name: deepsonar-opensandbox
    restart: unless-stopped
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      SANDBOX_CONFIG_PATH: /etc/opensandbox/config.toml
      OPENSANDBOX_SERVER_API_KEY: ${OPEN_SANDBOX_API_KEY:?set a Scheduler-only API key}
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - ./opensandbox/config.toml:/etc/opensandbox/config.toml:ro
      # Official server only checks /.dockerenv; Podman needs this marker (#422).
      - ./opensandbox/dockerenv:/.dockerenv:ro
      - opensandbox-data:/var/lib/opensandbox
    ports:
      - "127.0.0.1:18081:8080"
    networks:
      - deepsonar-opensandbox

volumes:
  opensandbox-data:

networks:
  deepsonar-opensandbox:
    driver: bridge
