# Device rig（#495）：物理设备只插在这台可抛弃主机上，broker 是唯一入口。
#
# rig 前置条件（宿主侧，不写进容器）：
#   1) 真机插在 rig 上，宿主对设备授权 `adb devices` 可见；
#   2) 宿主把 adb server 暴露给 broker：`adb -a -P 5037 nodaemon server`
#      （broker 容器通过 ANDROID_ADB_SERVER_ADDRESS/PORT 枚举设备，容器内不映射 USB、
#       不需要 privileged，保持与沙箱一致的「不做 USB passthrough」边界）；
#   3) rig 与沙箱宿主/调度主机网络隔离，被拿下只损失这台 rig；
#   4) `DEVICE_BROKER_ALLOWED_KEYS` 必须显式列出允许上架的序列号（空 = 拒绝所有设备）。
#
# 启动：
#   DEVICE_BROKER_TOKEN=... DEVICE_BROKER_LEASE_SECRET=... \
#   DEVICE_BROKER_ALLOWED_KEYS=<serial> DEVICE_BROKER_ADB_HOST=<rig 可达地址> \
#   docker compose -f deploy/docker-compose.device-broker.yml up -d
services:
  device-broker:
    image: ${DEVICE_BROKER_IMAGE:-deepsonar-device-broker:local}
    build:
      context: ..
      dockerfile: deploy/Dockerfile.device-broker
    container_name: ${DEVICE_BROKER_CONTAINER_NAME:-deepsonar-device-broker}
    restart: unless-stopped
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      # 沙箱可达的端点（rig 地址/端口）：Scheduler 把它投影进沙箱的 ANDROID_* 变量。
      DEVICE_BROKER_ADB_HOST: ${DEVICE_BROKER_ADB_HOST:?set the rig address reachable from sandboxes}
      DEVICE_BROKER_ADB_PORT: "${DEVICE_BROKER_ADB_PORT:-5037}"
      # 容器内 adb 客户端指向宿主 adb server（不映射 USB）。
      ANDROID_ADB_SERVER_ADDRESS: ${DEVICE_BROKER_HOST_ADB_ADDRESS:-host.docker.internal}
      ANDROID_ADB_SERVER_PORT: "${DEVICE_BROKER_ADB_PORT:-5037}"
      DEVICE_BROKER_TOKEN: ${DEVICE_BROKER_TOKEN:?set the broker inbound token}
      DEVICE_BROKER_LEASE_SECRET: ${DEVICE_BROKER_LEASE_SECRET:?set the shared lease signing secret}
      DEVICE_BROKER_ALLOWED_KEYS: ${DEVICE_BROKER_ALLOWED_KEYS:?list the device serials this rig may expose}
      DEVICE_BROKER_LEASE_TTL_SEC: "${DEVICE_BROKER_LEASE_TTL_SEC:-1800}"
      DEVICE_BROKER_LEASE_TTL_SEC_MAX: "${DEVICE_BROKER_LEASE_TTL_SEC_MAX:-86400}"
      DEVICE_BROKER_AUDIT_LOG: /var/log/deepsonar/device-broker.jsonl
    ports:
      # broker 控制面只对调度主机网段开放，不要放到公网。
      - "${DEVICE_BROKER_BIND:-0.0.0.0}:${DEVICE_BROKER_PORT:-8788}:8788"
    volumes:
      - device-broker-logs:/var/log/deepsonar
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8788/health"]
      interval: 30s
      timeout: 5s
      retries: 3

volumes:
  device-broker-logs:
