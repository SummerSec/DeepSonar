# Remote execution-plane worker: local OpenSandbox + register/heartbeat agent.
# Control plane talks to this OpenSandbox over the existing server-proxy path.
#   DEEPSONAR_CONTROL_PLANE=https://scheduler.example:3100 \
#   DEEPSONAR_WORKER_BOOTSTRAP_TOKEN=... \
#   DEEPSONAR_WORKER_ENDPOINT=10.0.0.8:18081 \
#   OPEN_SANDBOX_API_KEY=... \
#   ./deploy/deploy.sh up worker-join --control-plane https://scheduler.example:3100
#
# Bind the OpenSandbox port on a private interface reachable from the Scheduler.
# Do not invent overlay networking; sandbox exec/PTY stays on OPEN_SANDBOX_USE_SERVER_PROXY.
services:
  opensandbox:
    image: ${OPENSANDBOX_SERVER_IMAGE:-docker.io/opensandbox/server@sha256:ae8dfbb277f40a39ff01ef35e5e1c10675acfe0fa9db15259b8f323e5efab778}
    container_name: ${OPEN_SANDBOX_CONTAINER_NAME:-deepsonar-worker-opensandbox}
    restart: unless-stopped
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      SANDBOX_CONFIG_PATH: /etc/opensandbox/config.toml
      OPENSANDBOX_SERVER_API_KEY: ${OPEN_SANDBOX_API_KEY:?set this worker OpenSandbox API key}
    volumes:
      - ${DEEPSONAR_DOCKER_SOCK:-/var/run/docker.sock}:/var/run/docker.sock
      - ./opensandbox/config.toml:/etc/opensandbox/config.toml:ro
      - opensandbox-data:/var/lib/opensandbox
    ports:
      - "${OPEN_SANDBOX_BIND:-0.0.0.0}:${OPEN_SANDBOX_HOST_PORT:-18081}:8080"
    healthcheck:
      test: ["CMD", "/app/.venv/bin/python3", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8080/health')"]
      interval: 5s
      timeout: 3s
      retries: 20

  worker-agent:
    image: ${DEEPSONAR_WORKER_AGENT_IMAGE:-node:22-bookworm-slim@sha256:f32b81066cde10a75dbac96646099533316d94bac4150c55da1636e1f0ffdc46}
    restart: unless-stopped
    depends_on:
      opensandbox:
        condition: service_healthy
    environment:
      DEEPSONAR_CONTROL_PLANE: ${DEEPSONAR_CONTROL_PLANE:?set the Scheduler base URL}
      DEEPSONAR_WORKER_BOOTSTRAP_TOKEN: ${DEEPSONAR_WORKER_BOOTSTRAP_TOKEN:?set the control-plane bootstrap token}
      DEEPSONAR_WORKER_NODE_ID: ${DEEPSONAR_WORKER_NODE_ID:-}
      DEEPSONAR_WORKER_ENDPOINT: ${DEEPSONAR_WORKER_ENDPOINT:?host:port reachable from the Scheduler}
      DEEPSONAR_WORKER_MAX_SANDBOXES: ${DEEPSONAR_WORKER_MAX_SANDBOXES:-8}
      DEEPSONAR_WORKER_MEMORY_MIB: ${DEEPSONAR_WORKER_MEMORY_MIB:-16384}
      DEEPSONAR_WORKER_CPU: ${DEEPSONAR_WORKER_CPU:-8}
      DEEPSONAR_WORKER_HEARTBEAT_SEC: ${DEEPSONAR_WORKER_HEARTBEAT_SEC:-15}
      OPEN_SANDBOX_API_KEY: ${OPEN_SANDBOX_API_KEY:?set this worker OpenSandbox API key}
      OPEN_SANDBOX_PROTOCOL: ${OPEN_SANDBOX_PROTOCOL:-http}
    volumes:
      - ./worker-register.mjs:/agent/worker-register.mjs:ro
    command: ["node", "/agent/worker-register.mjs"]

volumes:
  opensandbox-data:
