rules:
  - id: cpp-unsafe-c-string-copy
    languages: [cpp]
    severity: WARNING
    message: "bounded audit review required: unbounded C string copy"
    patterns:
      - pattern-either:
          - pattern: strcpy(...)
          - pattern: strcat(...)
          - pattern: sprintf(...)
          - pattern: vsprintf(...)
  - id: cpp-unsafe-memory-copy
    languages: [cpp]
    severity: WARNING
    message: "bounded audit review required: raw memory copy with caller-controlled length"
    pattern-either:
      - pattern: memcpy(...)
      - pattern: memmove(...)
  - id: cpp-shell-command
    languages: [cpp]
    severity: WARNING
    message: "bounded audit review required: process command reaches a shell API"
    pattern-either:
      - pattern: system(...)
      - pattern: popen(...)
