# OpenSandbox Docker PoC (#162 Phase 2). Official server schema only.
# Immutable digest pins only. Floating tags and Docker host network are rejected.

[server]
host = "0.0.0.0"
port = 8080
max_sandbox_timeout_seconds = 86400

[log]
level = "INFO"

[runtime]
type = "docker"
execd_image = "docker.io/opensandbox/execd@sha256:e11fdd6fa641329a1fe5298e71c8dd2afca742674fe48bc855b2ff6715512829"

[docker]
network_mode = "bridge"
api_timeout = 180
# Compose mounts deploy/opensandbox/dockerenv at /.dockerenv so Podman
# is detected as in-container and this host_ip is used (#422).
host_ip = "host.docker.internal"
# Stay below Windows ephemeral / Hyper-V excluded ports (often 49152+).
# OpenSandbox default 40000-60000 can bind a forbidden host port (#349).
port_range_min = 40000
port_range_max = 49000
drop_capabilities = ["ALL"]
no_new_privileges = true
pids_limit = 4096

# Docker default must stay direct until the pinned OpenSandbox server implements
# gateway ingress on the Docker backend (#556). mode=gateway requires a [gateway]
# block and is only wired on the K8s path today. #548's lasting value is the
# scheduler-side upload retry / provision classification / NUL scrub, which works
# under direct; renew_intent stays disabled.
[ingress]
mode = "direct"

[egress]
image = "docker.io/opensandbox/egress@sha256:56429c89b7175c2a24af62ca93a99776f03ea67a0beb74d63c8ddb34ff16fd97"
mode = "dns"
disable_ipv6 = true
readiness_timeout_seconds = 30.0

[storage]
allowed_host_paths = []

[store]
type = "sqlite"
path = "/var/lib/opensandbox/opensandbox.db"

[renew_intent]
enabled = false
