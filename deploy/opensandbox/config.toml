# OpenSandbox Docker PoC (#162 Phase 2). Official server schema only.
# Immutable digest pins only. Floating tags and Docker host network are rejected.

[server]
host = "0.0.0.0"
port = 8080
max_sandbox_timeout_seconds = 86400

[log]
level = "INFO"

[runtime]
type = "docker"
execd_image = "docker.io/opensandbox/execd@sha256:c75836c46ef4302afccec182d5d7339eb2f905f51e3d73b7aa17bb76c832526c"

[docker]
network_mode = "bridge"
api_timeout = 180
# Compose mounts deploy/opensandbox/dockerenv at /.dockerenv so Podman
# is detected as in-container and this host_ip is used (#422).
host_ip = "host.docker.internal"
# Stay below Windows ephemeral / Hyper-V excluded ports (often 49152+).
# OpenSandbox default 40000-60000 can bind a forbidden host port (#349).
port_range_min = 40000
port_range_max = 49000
drop_capabilities = ["ALL"]
no_new_privileges = true
pids_limit = 4096

# This deployment remains direct; upgrading the pinned SDK/server does not
# enable gateway. Any gateway change needs nested ingress.gateway/route
# preflight plus independent pinned-server/backend validation (#556).
# Scheduler upload retry / provision classification / NUL scrub still work
# under direct (#548); renew_intent stays disabled.
[ingress]
mode = "direct"

[egress]
image = "docker.io/opensandbox/egress@sha256:a3d30246e557525f3fa44d16226258268cea175532e652822bd1eb4e83e0f54d"
mode = "dns"
disable_ipv6 = true
readiness_timeout_seconds = 30.0

[storage]
allowed_host_paths = []

[store]
type = "sqlite"
path = "/var/lib/opensandbox/opensandbox.db"

[renew_intent]
enabled = false
