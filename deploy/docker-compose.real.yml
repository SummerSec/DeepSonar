# Real Agent 覆盖层：AGENT_MODE=real + 调度器挂载容器运行时 socket。
# Rootless Podman：在 deploy/.env 设置 DEEPSONAR_DOCKER_SOCK（如 /tmp/podman-run-1000/podman/podman.sock）。
# 用法：./deploy/deploy.sh up real pull
services:
  scheduler:
    environment:
      AGENT_MODE: real
      SANDBOX_PROVIDER: ${SANDBOX_PROVIDER:-opensandbox}
      BLOB_DIR: /app/data/blobs
      # Sandboxes call the managed proxy; the proxy reaches Scheduler on the shared bridge.
      DEEPSONAR_GATEWAY_SANDBOX_URL: ${DEEPSONAR_GATEWAY_SANDBOX_URL:-http://deepsonar-gateway-proxy:3100/gateway}
      DEEPSONAR_GATEWAY_PROXY_UPSTREAM_URL: ${DEEPSONAR_GATEWAY_PROXY_UPSTREAM_URL:-http://scheduler:3100/gateway}
      # Read-only bind of the host Docker data filesystem; statfs only, never file traversal/deletion.
      DEEPSONAR_HOST_DISK_PATH: /host-disk
    volumes:
      - blob_data:/app/data
      - ./master.key:/run/secrets/deepsonar_master_key:ro
      - ${DEEPSONAR_DOCKER_SOCK:-/var/run/docker.sock}:/var/run/docker.sock
      - ${DEEPSONAR_HOST_DISK_SOURCE:-/var/lib/docker}:/host-disk:ro
  image-admission:
    volumes:
      - ${DEEPSONAR_DOCKER_SOCK:-/var/run/docker.sock}:/var/run/docker.sock
      - ./master.key:/run/secrets/deepsonar_master_key:ro
      - admission_scan:/scan
