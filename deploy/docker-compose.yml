services:
  postgres:
    image: postgres:16-alpine
    container_name: dfh-postgres
    environment:
      POSTGRES_USER: dfh
      POSTGRES_PASSWORD: dfh
      POSTGRES_DB: deepflowhunter
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U dfh -d deepflowhunter"]
      interval: 5s
      timeout: 3s
      retries: 20

volumes:
  pgdata:
