# 默认从阿里云 ACR 拉取已发布镜像（DEEPSONAR_IMAGE_REGISTRY / DEEPSONAR_IMAGE_TAG）。
# 本地源码构建：./deploy/deploy.sh up real build

services:
  postgres:
    # 基础库镜像可用 POSTGRES_IMAGE 覆盖（国内可改 DaoCloud 等镜像加速）
    image: ${POSTGRES_IMAGE:-postgres:16-alpine}
    restart: unless-stopped
    environment:
      POSTGRES_USER: deepsonar
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?请在 deploy/.env 中设置 POSTGRES_PASSWORD}
      POSTGRES_DB: deepsonar
    ports:
      - "${POSTGRES_BIND:-127.0.0.1:5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U deepsonar -d deepsonar"]
      interval: 5s
      timeout: 3s
      retries: 20
    logging: &default-logging
      driver: json-file
      options: { max-size: "50m", max-file: "5" }
    networks: [deepsonar]

  # 每日 pg_dump + 7 天保留（§12.3；恢复演练见 docs/ONE_CLICK_DEPLOYMENT.md）
  backup:
    image: ${POSTGRES_IMAGE:-postgres:16-alpine}
    restart: unless-stopped
    environment:
      PGPASSWORD: ${POSTGRES_PASSWORD:?}
    volumes:
      - backup_data:/backups
    entrypoint: ["/bin/sh", "-ec"]
    command:
      - |
        while true; do
          pg_dump -h postgres -U deepsonar deepsonar | gzip > "/backups/deepsonar-$$(date +%Y%m%d-%H%M%S).sql.gz"
          echo "[backup] done $$(date)"
          find /backups -name 'deepsonar-*.sql.gz' -mtime +7 -delete
          sleep 86400
        done
    depends_on:
      postgres:
        condition: service_healthy
    logging: *default-logging
    networks: [deepsonar]

  silo:
    image: ${SILO_IMAGE:-docker.io/pgsty/silo:RELEASE.2026-08-06T00-00-00Z}
    command: ["server", "/data", "--console-address", ":9001"]
    restart: unless-stopped
    environment:
      # Silo preserves the upstream MINIO_* environment contract.
      MINIO_ROOT_USER: ${BLOB_S3_ACCESS_KEY_ID:?请在 deploy/.env 中设置 BLOB_S3_ACCESS_KEY_ID}
      MINIO_ROOT_PASSWORD: ${BLOB_S3_SECRET_ACCESS_KEY:?请在 deploy/.env 中设置 BLOB_S3_SECRET_ACCESS_KEY}
    ports:
      - "${SILO_API_BIND:-127.0.0.1:9000}:9000"
      - "${SILO_CONSOLE_BIND:-127.0.0.1:9001}:9001"
    volumes:
      - silo_data:/data
    healthcheck:
      test: ["CMD", "silo", "healthcheck", "ready"]
      interval: 5s
      timeout: 5s
      retries: 20
    logging: *default-logging
    networks: [deepsonar]

  silo-init:
    image: ${SILO_IMAGE:-docker.io/pgsty/silo:RELEASE.2026-08-06T00-00-00Z}
    restart: "no"
    entrypoint: ["/bin/sh", "-c"]
    # Must be a one-element list so `sh -c` receives the whole script (string form gets word-split by Compose).
    command:
      - >-
        mcli alias set local http://silo:9000 "$${MINIO_ROOT_USER}" "$${MINIO_ROOT_PASSWORD}" &&
        mcli mb --ignore-existing "local/$${BLOB_S3_BUCKET}"
    environment:
      MINIO_ROOT_USER: ${BLOB_S3_ACCESS_KEY_ID:?请在 deploy/.env 中设置 BLOB_S3_ACCESS_KEY_ID}
      MINIO_ROOT_PASSWORD: ${BLOB_S3_SECRET_ACCESS_KEY:?请在 deploy/.env 中设置 BLOB_S3_SECRET_ACCESS_KEY}
      BLOB_S3_BUCKET: ${BLOB_S3_BUCKET:-deepsonar}
    depends_on:
      silo:
        condition: service_healthy
    logging: *default-logging
    networks: [deepsonar]

  scheduler:
    # 默认拉阿里云已发布镜像；仅在 deploy.sh 传 build 时本地构建
    image: ${DEEPSONAR_IMAGE_REGISTRY:-crpi-6s5wwv0nhl6dq1l0.cn-hangzhou.personal.cr.aliyuncs.com/summersec}/deepsonar-scheduler:${DEEPSONAR_IMAGE_TAG:?请在 deploy/.env 中设置由 Release 同步的 DEEPSONAR_IMAGE_TAG}
    build:
      context: ..
      dockerfile: deploy/Dockerfile.scheduler
    restart: unless-stopped
    env_file: .env
    environment:
      DATABASE_URL: postgres://deepsonar:${POSTGRES_PASSWORD}@postgres:5432/deepsonar
      SCHEDULER_HOST: 0.0.0.0
      SCHEDULER_PORT: 3100
      DEEPSONAR_AUTH_REQUIRED: "true"
      BLOB_STORE: ${BLOB_STORE:-s3}
      BLOB_S3_ENDPOINT: ${BLOB_S3_ENDPOINT:-http://silo:9000}
      BLOB_S3_REGION: ${BLOB_S3_REGION:-us-east-1}
      BLOB_S3_BUCKET: ${BLOB_S3_BUCKET:-deepsonar}
      BLOB_S3_PREFIX: ${BLOB_S3_PREFIX:-}
      BLOB_S3_ACCESS_KEY_ID: ${BLOB_S3_ACCESS_KEY_ID:?请在 deploy/.env 中设置 BLOB_S3_ACCESS_KEY_ID}
      BLOB_S3_SECRET_ACCESS_KEY: ${BLOB_S3_SECRET_ACCESS_KEY:?请在 deploy/.env 中设置 BLOB_S3_SECRET_ACCESS_KEY}
      BLOB_S3_FORCE_PATH_STYLE: ${BLOB_S3_FORCE_PATH_STYLE:-true}
      BLOB_S3_CACHE_DIR: /app/data/blobs
      # 必须落在 blob_data volume 内。默认相对 cwd 会写成 /app/apps/scheduler/data（容器可写层，重建即丢）。
      BLOB_DIR: /app/data/blobs
      # real mode: sandboxes call the managed proxy; the proxy reaches Scheduler on the shared bridge.
      DEEPSONAR_GATEWAY_SANDBOX_URL: ${DEEPSONAR_GATEWAY_SANDBOX_URL:-http://deepsonar-gateway-proxy:3100/gateway}
      DEEPSONAR_GATEWAY_PROXY_UPSTREAM_URL: ${DEEPSONAR_GATEWAY_PROXY_UPSTREAM_URL:-http://scheduler:3100/gateway}
      # vfs/rootless cold create can take 4-8 minutes; keep the runtime timeout explicit.
      PROVISION_TIMEOUT_SEC: ${PROVISION_TIMEOUT_SEC:-900}
      # /health.version：显式传入镜像标签；可用 DEEPSONAR_VERSION 覆盖。
      DEEPSONAR_IMAGE_TAG: ${DEEPSONAR_IMAGE_TAG:?请在 deploy/.env 中设置由 Release 同步的 DEEPSONAR_IMAGE_TAG}
      DEEPSONAR_VERSION: ${DEEPSONAR_VERSION:-}
      # stop_grace_period 配合优雅退出（dispatcher drain + fastify close）
    stop_grace_period: 30s
    volumes:
      - blob_data:/app/data
      - ./master.key:/run/secrets/deepsonar_master_key:ro
    depends_on:
      postgres:
        condition: service_healthy
      silo:
        condition: service_healthy
      silo-init:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3100/health').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 20
    logging: *default-logging
    networks: [deepsonar, sandbox_gateway]

  # 第三方镜像只在独立准入 Worker 中执行自检；Scheduler 只管理状态与审批。
  image-admission:
    image: ${DEEPSONAR_IMAGE_REGISTRY:-crpi-6s5wwv0nhl6dq1l0.cn-hangzhou.personal.cr.aliyuncs.com/summersec}/deepsonar-image-admission:${DEEPSONAR_IMAGE_TAG:?请在 deploy/.env 中设置由 Release 同步的 DEEPSONAR_IMAGE_TAG}
    build:
      context: ..
      dockerfile: deploy/Dockerfile.image-admission
    restart: unless-stopped
    env_file: .env
    environment:
      DATABASE_URL: postgres://deepsonar:${POSTGRES_PASSWORD}@postgres:5432/deepsonar
      DEEPSONAR_IMAGE_REGISTRY: ${DEEPSONAR_IMAGE_REGISTRY:-crpi-6s5wwv0nhl6dq1l0.cn-hangzhou.personal.cr.aliyuncs.com/summersec}
      DEEPSONAR_IMAGE_SCAN_VOLUME: deepsonar_admission_scan
    volumes:
      # Rootless Podman: set DEEPSONAR_DOCKER_SOCK to the user podman.sock path.
      - ${DEEPSONAR_DOCKER_SOCK:-/var/run/docker.sock}:/var/run/docker.sock
      - ./master.key:/run/secrets/deepsonar_master_key:ro
      - admission_scan:/scan
    depends_on:
      postgres:
        condition: service_healthy
    logging: *default-logging
    networks: [deepsonar]

  web:
    image: ${DEEPSONAR_IMAGE_REGISTRY:-crpi-6s5wwv0nhl6dq1l0.cn-hangzhou.personal.cr.aliyuncs.com/summersec}/deepsonar-web:${DEEPSONAR_IMAGE_TAG:?请在 deploy/.env 中设置由 Release 同步的 DEEPSONAR_IMAGE_TAG}
    build:
      context: ..
      dockerfile: deploy/Dockerfile.web
    restart: unless-stopped
    ports:
      - "${DEEPSONAR_WEB_PORT:-8080}:8080"
    depends_on:
      scheduler:
        condition: service_healthy
    logging: *default-logging
    networks: [deepsonar]

volumes:
  postgres_data:
  blob_data:
  silo_data:
  backup_data:
  admission_scan:
    name: deepsonar_admission_scan

networks:
  deepsonar:
    driver: bridge
  sandbox_gateway:
    name: deepsonar-sandbox-gateway
    driver: bridge
    labels:
      deepsonar.managed: "true"
