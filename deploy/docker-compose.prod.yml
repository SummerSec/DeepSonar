services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: dfh
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?请在 deploy/.env 中设置 POSTGRES_PASSWORD}
      POSTGRES_DB: deepflowhunter
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U dfh -d deepflowhunter"]
      interval: 5s
      timeout: 3s
      retries: 20
    logging: &default-logging
      driver: json-file
      options: { max-size: "50m", max-file: "5" }
    networks: [dfh]

  # 每日 pg_dump + 7 天保留（§12.3；恢复演练见 docs/ONE_CLICK_DEPLOYMENT.md）
  backup:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      PGPASSWORD: ${POSTGRES_PASSWORD:?}
    volumes:
      - backup_data:/backups
    entrypoint: >
      sh -c "while true; do
        pg_dump -h postgres -U dfh deepflowhunter | gzip > /backups/dfh-$$(date +\%Y\%m\%d-\%H\%M\%S).sql.gz
        && echo \"[backup] done $$(date)\";
        find /backups -name 'dfh-*.sql.gz' -mtime +7 -delete;
        sleep 86400;
      done"
    depends_on:
      postgres:
        condition: service_healthy
    logging: *default-logging
    networks: [dfh]

  scheduler:
    build:
      context: ..
      dockerfile: deploy/Dockerfile.scheduler
    restart: unless-stopped
    env_file: .env
    environment:
      DATABASE_URL: postgres://dfh:${POSTGRES_PASSWORD}@postgres:5432/deepflowhunter
      SCHEDULER_HOST: 0.0.0.0
      SCHEDULER_PORT: 3100
      DFH_AUTH_REQUIRED: "true"
      # real 模式：沙箱容器经宿主机回连网关（同 compose 网络则改为 http://scheduler:3100/gateway）
      DFH_GATEWAY_SANDBOX_URL: ${DFH_GATEWAY_SANDBOX_URL:-http://host.docker.internal:3100/gateway}
      # stop_grace_period 配合优雅退出（dispatcher drain + fastify close）
    stop_grace_period: 30s
    volumes:
      - blob_data:/app/data
      - ./master.key:/run/secrets/dfh_master_key:ro
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3100/health').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 20
    logging: *default-logging
    networks: [dfh]

  web:
    build:
      context: ..
      dockerfile: deploy/Dockerfile.web
    restart: unless-stopped
    ports:
      - "${DFH_WEB_PORT:-8080}:8080"
    depends_on:
      scheduler:
        condition: service_healthy
    logging: *default-logging
    networks: [dfh]

volumes:
  postgres_data:
  blob_data:
  backup_data:

networks:
  dfh:
    driver: bridge
